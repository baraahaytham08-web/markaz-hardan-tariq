<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    دخول المعلمين | مركز حردان طارق القرآني
  </title>

  <link
    rel="icon"
    type="image/png"
    href="logo.png">

  <link
    rel="shortcut icon"
    type="image/png"
    href="logo.png">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


  <style>

    * {
      box-sizing:
        border-box;

      margin:
        0;

      padding:
        0;
    }


    :root {

      --green:
        #174d3a;

      --green-dark:
        #0c3023;

      --green-mid:
        #21664b;

      --green-soft:
        #eaf4ef;

      --gold:
        #b28b18;

      --gold-light:
        #d9bc5c;

      --gold-soft:
        #fff8df;

      --cream:
        #faf8f0;

      --white:
        #ffffff;

      --text:
        #1d2924;

      --muted:
        #78837e;

      --border:
        #e5ebe7;

      --danger:
        #b3261e;

      --danger-soft:
        #fff0ef;

      --success:
        #237a31;
    }


    html {
      min-height:
        100%;
    }


    body {

      min-height:
        100vh;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        25px;

      position:
        relative;

      overflow:
        hidden;

      font-family:
        Arial,
        Tahoma,
        sans-serif;

      color:
        var(--text);

      background:

        radial-gradient(
          circle at 8% 10%,
          rgba(178,139,24,.13),
          transparent 23%
        ),

        radial-gradient(
          circle at 92% 85%,
          rgba(23,77,58,.13),
          transparent 28%
        ),

        linear-gradient(
          135deg,
          #faf8f0,
          #ffffff 48%,
          #edf5f1
        );
    }


    /* =====================================================
       زخارف الخلفية
    ====================================================== */

    .bg-circle {

      position:
        absolute;

      border-radius:
        50%;

      pointer-events:
        none;
    }


    .bg-circle.one {

      width:
        360px;

      height:
        360px;

      right:
        -170px;

      top:
        -140px;

      border:
        1px solid
        rgba(23,77,58,.07);
    }


    .bg-circle.two {

      width:
        260px;

      height:
        260px;

      left:
        -120px;

      bottom:
        -110px;

      border:
        1px solid
        rgba(178,139,24,.09);
    }


    .bg-circle.three {

      width:
        120px;

      height:
        120px;

      right:
        13%;

      bottom:
        8%;

      background:
        rgba(23,77,58,.025);
    }


    /* =====================================================
       WRAPPER
    ====================================================== */

    .login-wrapper {

      width:
        min(
          470px,
          100%
        );

      position:
        relative;

      z-index:
        2;
    }


    /* =====================================================
       BRAND
    ====================================================== */

    .brand {

      text-align:
        center;

      margin-bottom:
        20px;
    }


    .brand-logo {

      width:
        86px;

      height:
        86px;

      margin:
        0 auto 14px;

      padding:
        4px;

      border:
        3px solid
        rgba(178,139,24,.72);

      border-radius:
        50%;

      background:
        white;

      box-shadow:

        0 15px 35px
        rgba(23,77,58,.14),

        0 0 0 7px
        rgba(217,188,92,.06);
    }


    .brand-logo img {

      width:
        100%;

      height:
        100%;

      display:
        block;

      border-radius:
        50%;

      object-fit:
        cover;
    }


    .brand h1 {

      color:
        var(--green);

      font-size:
        24px;

      line-height:
        1.5;

      margin-bottom:
        5px;
    }


    .brand p {

      color:
        var(--muted);

      font-size:
        11px;

      line-height:
        1.8;
    }


    /* =====================================================
       LOGIN CARD
    ====================================================== */

    .login-card {

      position:
        relative;

      overflow:
        hidden;

      background:
        rgba(255,255,255,.95);

      border:
        1px solid
        rgba(229,235,231,.95);

      border-radius:
        24px;

      box-shadow:

        0 25px 65px
        rgba(23,77,58,.11),

        0 5px 20px
        rgba(23,77,58,.035);

      padding:
        31px;
    }


    .login-card::before {

      content:
        "";

      position:
        absolute;

      width:
        190px;

      height:
        190px;

      border-radius:
        50%;

      left:
        -110px;

      top:
        -125px;

      border:
        1px solid
        rgba(23,77,58,.06);

      pointer-events:
        none;
    }


    .login-card::after {

      content:
        "";

      position:
        absolute;

      width:
        170px;

      height:
        170px;

      border-radius:
        50%;

      right:
        -100px;

      bottom:
        -105px;

      border:
        1px solid
        rgba(178,139,24,.08);

      pointer-events:
        none;
    }


    .card-head {

      position:
        relative;

      z-index:
        2;

      display:
        flex;

      align-items:
        center;

      gap:
        13px;

      margin-bottom:
        23px;
    }


    .card-icon {

      width:
        46px;

      height:
        46px;

      min-width:
        46px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        13px;

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green-mid)
        );

      color:
        white;

      font-size:
        18px;

      box-shadow:
        0 8px 20px
        rgba(23,77,58,.14);
    }


    .card-head h2 {

      color:
        var(--green);

      font-size:
        20px;

      margin-bottom:
        4px;
    }


    .card-head p {

      color:
        var(--muted);

      font-size:
        10px;

      line-height:
        1.8;
    }


    /* =====================================================
       FORM
    ====================================================== */

    .form-content {

      position:
        relative;

      z-index:
        2;
    }


    .input-label {

      display:
        block;

      color:
        var(--green);

      font-size:
        11px;

      font-weight:
        bold;

      margin-bottom:
        8px;
    }


    .code-wrapper {

      position:
        relative;
    }


    .code-wrapper .main-icon {

      position:
        absolute;

      right:
        14px;

      top:
        50%;

      transform:
        translateY(-50%);

      color:
        #97a19c;

      font-size:
        14px;

      pointer-events:
        none;

      transition:
        .2s;
    }


    #teacherCode {

      width:
        100%;

      height:
        52px;

      border:
        1px solid
        var(--border);

      border-radius:
        13px;

      outline:
        none;

      background:
        #fafcfb;

      color:
        var(--text);

      font-size:
        17px;

      font-weight:
        bold;

      letter-spacing:
        5px;

      text-align:
        center;

      padding:
        0 48px 0 48px;

      transition:
        .2s;
    }


    #teacherCode::placeholder {

      color:
        #a5ada8;

      font-size:
        11px;

      font-weight:
        normal;

      letter-spacing:
        0;
    }


    #teacherCode:focus {

      background:
        white;

      border-color:
        var(--gold);

      box-shadow:
        0 0 0 4px
        rgba(178,139,24,.08);
    }


    #teacherCode:focus
    + .show-code {

      border-color:
        #d8d0ae;
    }


    .show-code {

      position:
        absolute;

      left:
        8px;

      top:
        8px;

      width:
        36px;

      height:
        36px;

      border:
        1px solid
        transparent;

      border-radius:
        9px;

      background:
        #f0f3f1;

      color:
        #66736d;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      transition:
        .2s;
    }


    .show-code:hover {

      background:
        var(--green-soft);

      color:
        var(--green);
    }


    /* =====================================================
       BUTTON
    ====================================================== */

    .login-button {

      width:
        100%;

      height:
        50px;

      margin-top:
        17px;

      border:
        none;

      border-radius:
        12px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        8px;

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green-mid)
        );

      color:
        white;

      font-size:
        12px;

      font-weight:
        bold;

      box-shadow:
        0 10px 22px
        rgba(23,77,58,.15);

      transition:
        .25s;
    }


    .login-button:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 14px 28px
        rgba(23,77,58,.20);
    }


    .login-button:active {

      transform:
        translateY(0);
    }


    .login-button:disabled {

      cursor:
        default;

      opacity:
        .85;

      transform:
        none;
    }


    /* =====================================================
       MESSAGE
    ====================================================== */

    .message {

      min-height:
        20px;

      margin-top:
        12px;

      text-align:
        center;

      font-size:
        10px;

      font-weight:
        bold;
    }


    .message.error {

      color:
        var(--danger);
    }


    .message.success {

      color:
        var(--success);
    }


    /* =====================================================
       INFO BOX
    ====================================================== */

    .info-box {

      position:
        relative;

      z-index:
        2;

      display:
        flex;

      align-items:
        flex-start;

      gap:
        10px;

      margin-top:
        17px;

      padding:
        12px 13px;

      border:
        1px solid
        #dcebe4;

      border-radius:
        12px;

      background:
        var(--green-soft);

      color:
        #5f6b66;

      font-size:
        10px;

      line-height:
        1.9;
    }


    .info-box i {

      margin-top:
        2px;

      color:
        var(--green);

      font-size:
        13px;
    }


    /* =====================================================
       FOOTER
    ====================================================== */

    .footer {

      text-align:
        center;

      margin-top:
        17px;

      color:
        #929b96;

      font-size:
        9px;
    }


    .demo-badge {

      position:
        fixed;

      left:
        12px;

      bottom:
        12px;

      z-index:
        10;

      padding:
        7px 12px;

      border-radius:
        20px;

      background:
        var(--green);

      color:
        white;

      font-size:
        9px;

      box-shadow:
        0 7px 18px
        rgba(23,77,58,.12);
    }


    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media(max-width:550px) {

      body {

        padding:
          16px;
      }


      .brand h1 {

        font-size:
          20px;
      }


      .brand-logo {

        width:
          76px;

        height:
          76px;
      }


      .login-card {

        padding:
          23px;

        border-radius:
          19px;
      }


      .card-head h2 {

        font-size:
          18px;
      }


      .info-box {

        font-size:
          9px;
      }


      .demo-badge {

        left:
          8px;

        bottom:
          8px;
      }
    }

  </style>

</head>


<body>

  <!-- زخارف الخلفية -->

  <div class="bg-circle one"></div>
  <div class="bg-circle two"></div>
  <div class="bg-circle three"></div>


  <div class="login-wrapper">


    <!-- ================= BRAND ================= -->

    <div class="brand">

      <div class="brand-logo">

        <img
          src="logo.png"
          alt="شعار مركز حردان طارق القرآني">

      </div>

      <h1>
        مركز حردان طارق القرآني
      </h1>

      <p>
        البوابة الإدارية للمعلمين
      </p>

    </div>


    <!-- ================= CARD ================= -->

    <div class="login-card">


      <div class="card-head">

        <div class="card-icon">

          <i class="fa-solid fa-user-tie"></i>

        </div>

        <div>

          <h2>
            دخول المعلمين
          </h2>

          <p>
            أدخل كود الدخول للانتقال إلى لوحة المتابعة
          </p>

        </div>

      </div>


      <div class="form-content">

        <form
          id="teacherLoginForm">


          <label
            class="input-label"
            for="teacherCode">

            كود المعلمين

          </label>


          <div class="code-wrapper">

            <i
              class="fa-solid fa-key main-icon">
            </i>


            <input
              id="teacherCode"
              type="password"
              inputmode="numeric"
              pattern="[0-9]*"
              autocomplete="off"
              maxlength="5"
              placeholder="أدخل الكود الموحد"
              required>


            <button
              class="show-code"
              id="showCode"
              type="button"
              aria-label="إظهار أو إخفاء الكود">

              <i
                class="fa-solid fa-eye">
              </i>

            </button>

          </div>


          <button
            class="login-button"
            id="loginButton"
            type="submit">

            <i
              class="fa-solid fa-right-to-bracket">
            </i>

            دخول إلى لوحة المعلم

          </button>


          <div
            class="message"
            id="message">
          </div>


        </form>


        <div class="info-box">

          <i
            class="fa-solid fa-circle-info">
          </i>

          <span>
            يستخدم جميع المعلمين نفس كود الدخول الموحّد
            للوصول إلى البوابة الإدارية.
          </span>

        </div>

      </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <div class="footer">

      © 2026 مركز حردان طارق القرآني
      — البوابة الإدارية

    </div>

  </div>


  <div class="demo-badge">
    النسخة التجريبية
  </div>


  <script>

    /* =====================================================
       كود المعلمين الموحد
    ====================================================== */

    const TEACHER_ACCESS_CODE =
      '20269';


    const form =
      document.getElementById(
        'teacherLoginForm'
      );


    const codeInput =
      document.getElementById(
        'teacherCode'
      );


    const message =
      document.getElementById(
        'message'
      );


    const loginButton =
      document.getElementById(
        'loginButton'
      );


    const showCode =
      document.getElementById(
        'showCode'
      );


    /* =====================================================
       إذا كان المعلم قد دخل مسبقًا
    ====================================================== */

    if (
      localStorage.getItem(
        'teacherAccess'
      ) === 'granted'
    ) {

      window.location.href =
        'teacher-dashboard.html';
    }


    /* =====================================================
       إظهار / إخفاء الكود
    ====================================================== */

    showCode.addEventListener(
      'click',
      function() {

        const isVisible =
          codeInput.type === 'text';


        codeInput.type =
          isVisible
            ? 'password'
            : 'text';


        showCode.innerHTML =
          isVisible

            ? '<i class="fa-solid fa-eye"></i>'

            : '<i class="fa-solid fa-eye-slash"></i>';
      }
    );


    /* =====================================================
       تسجيل الدخول
    ====================================================== */

    form.addEventListener(
      'submit',
      function(event) {

        event.preventDefault();


        const enteredCode =
          codeInput.value.trim();


        /* نجاح */

        if (
          enteredCode ===
          TEACHER_ACCESS_CODE
        ) {

          localStorage.setItem(
            'teacherAccess',
            'granted'
          );


          message.className =
            'message success';


          message.textContent =
            'تم التحقق بنجاح، جارٍ فتح لوحة المعلم...';


          loginButton.disabled =
            true;


          loginButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ الدخول...';


          setTimeout(
            function() {

              window.location.href =
                'teacher-dashboard.html';

            },
            450
          );


          return;
        }


        /* خطأ */

        message.className =
          'message error';


        message.textContent =
          'كود الدخول غير صحيح. حاول مرة أخرى.';


        codeInput.value =
          '';


        codeInput.focus();

      }
    );

  </script>

</body>

</html>
