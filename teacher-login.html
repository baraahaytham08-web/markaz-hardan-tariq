<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دخول المعلمين | مركز حردان طارق القرآني</title>

  <link rel="icon" type="image/png" href="logo.png">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --green:#174d3a;
      --green-dark:#103b2c;
      --green-mid:#21644b;
      --green-soft:#eef6f2;

      --gold:#b38c1c;
      --gold-dark:#967417;
      --gold-light:#d5b650;

      --cream:#faf8f0;
      --white:#ffffff;

      --text:#1d2924;
      --muted:#7b8781;

      --border:#e6ebe8;
      --danger:#bd3027;
      --success:#23803a;
    }

    html,
    body{
      width:100%;
      min-height:100%;
    }

    body{
      min-height:100vh;
      font-family:Arial,"Tahoma",sans-serif;
      color:var(--text);

      display:flex;
      align-items:center;
      justify-content:center;

      padding:30px 18px;

      background:
        radial-gradient(circle at top right, rgba(179,140,28,.08), transparent 30%),
        radial-gradient(circle at bottom left, rgba(23,77,58,.08), transparent 30%),
        linear-gradient(135deg,#faf8f0 0%,#ffffff 50%,#edf5f1 100%);

      position:relative;
      overflow:hidden;
    }

    /* زخرفة خلفية خفيفة */
    body::before{
      content:"";
      position:fixed;
      width:330px;
      height:330px;
      border:1px solid rgba(179,140,28,.08);
      border-radius:50%;
      top:-190px;
      left:-150px;
      pointer-events:none;
    }

    body::after{
      content:"";
      position:fixed;
      width:430px;
      height:430px;
      border:1px solid rgba(23,77,58,.06);
      border-radius:50%;
      bottom:-270px;
      right:-200px;
      pointer-events:none;
    }

    .login-wrap{
      width:min(450px,100%);
      position:relative;
      z-index:2;
    }

    /* =========================
       الشعار والعنوان
    ========================= */

    .brand{
      text-align:center;
      margin-bottom:24px;
    }

    .logo-box{
      width:86px;
      height:86px;

      margin:0 auto 15px;

      border-radius:25px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        linear-gradient(145deg,var(--green),var(--green-dark));

      box-shadow:
        0 16px 35px rgba(23,77,58,.18);

      border:4px solid rgba(255,255,255,.9);

      position:relative;
      overflow:hidden;
    }

    .logo-box::before{
      content:"";
      position:absolute;
      width:45px;
      height:45px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:50%;
    }

    .logo-box i{
      position:relative;
      z-index:2;
      color:var(--gold-light);
      font-size:36px;
    }

    .brand h1{
      color:var(--green);
      font-size:24px;
      line-height:1.4;
      font-weight:800;
      margin-bottom:6px;
    }

    .brand p{
      color:var(--muted);
      font-size:12px;
      line-height:1.8;
    }

    /* =========================
       الكرت
    ========================= */

    .card{
      background:rgba(255,255,255,.96);

      border:1px solid rgba(230,235,232,.95);

      border-radius:26px;

      padding:32px;

      box-shadow:
        0 25px 65px rgba(16,59,44,.10),
        0 5px 18px rgba(16,59,44,.04);

      backdrop-filter:blur(10px);
    }

    .card-head{
      margin-bottom:25px;
    }

    .small-title{
      display:inline-flex;
      align-items:center;
      gap:7px;

      color:var(--gold-dark);

      font-size:11px;
      font-weight:bold;

      background:#fbf8ec;

      border:1px solid rgba(179,140,28,.12);

      padding:7px 10px;

      border-radius:999px;

      margin-bottom:11px;
    }

    .small-title i{
      font-size:10px;
    }

    .card-head h2{
      color:var(--green);
      font-size:23px;
      line-height:1.4;
      margin-bottom:7px;
      font-weight:800;
    }

    .card-head p{
      color:var(--muted);
      font-size:12px;
      line-height:1.9;
    }

    /* =========================
       الحقول
    ========================= */

    .field{
      margin-bottom:18px;
    }

    label{
      display:block;
      color:var(--green);
      font-size:12px;
      font-weight:bold;
      margin-bottom:9px;
    }

    .input-wrap{
      position:relative;
    }

    .input-icon{
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);

      color:#87928d;
      font-size:14px;

      pointer-events:none;
      z-index:2;
    }

    input{
      width:100%;
      height:54px;

      border:1px solid var(--border);
      border-radius:14px;

      outline:none;

      background:#fcfdfc;
      color:var(--text);

      font-size:18px;
      font-weight:bold;

      letter-spacing:4px;
      text-align:center;

      padding:
        0 50px 0 52px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease,
        transform .2s ease;
    }

    input::placeholder{
      color:#a0aaa5;
      font-weight:normal;
      letter-spacing:0;
      font-size:13px;
    }

    input:focus{
      border-color:var(--gold);

      background:#fff;

      box-shadow:
        0 0 0 4px rgba(179,140,28,.09);

      transform:translateY(-1px);
    }

    .show-code{
      position:absolute;
      left:8px;
      top:8px;

      width:38px;
      height:38px;

      border:0;
      border-radius:10px;

      background:#f1f4f2;
      color:#65716b;

      cursor:pointer;

      transition:.2s;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    .show-code:hover{
      background:#e8eeea;
      color:var(--green);
    }

    /* =========================
       زر الدخول
    ========================= */

    .submit{
      width:100%;
      height:54px;

      margin-top:2px;

      border:0;
      border-radius:14px;

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green-mid)
        );

      color:#fff;

      font-weight:bold;
      font-size:14px;

      cursor:pointer;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;

      box-shadow:
        0 12px 24px rgba(23,77,58,.16);

      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .submit:hover{
      transform:translateY(-2px);

      box-shadow:
        0 16px 28px rgba(23,77,58,.19);

      filter:brightness(1.03);
    }

    .submit:active{
      transform:translateY(0);
    }

    .submit:disabled{
      cursor:not-allowed;
      opacity:.85;
      transform:none;
    }

    /* =========================
       الرسالة
    ========================= */

    .message{
      min-height:24px;

      margin-top:14px;

      text-align:center;

      font-size:12px;
      font-weight:bold;

      line-height:1.8;
    }

    .message.error{
      color:var(--danger);
    }

    .message.success{
      color:var(--success);
    }

    /* =========================
       التنبيه
    ========================= */

    .hint{
      margin-top:20px;

      padding:13px 15px;

      border-radius:14px;

      background:var(--green-soft);

      border:1px solid rgba(23,77,58,.06);

      color:#617069;

      font-size:11px;
      line-height:1.9;

      text-align:center;
    }

    .hint i{
      color:var(--gold-dark);
      margin-left:4px;
    }

    /* =========================
       الفوتر
    ========================= */

    .footer-note{
      text-align:center;

      color:#8d9792;

      font-size:10px;

      margin-top:17px;
    }

    /* =========================
       موبايل
    ========================= */

    @media(max-width:480px){

      body{
        padding:20px 14px;
      }

      .brand{
        margin-bottom:19px;
      }

      .logo-box{
        width:76px;
        height:76px;
        border-radius:21px;
        margin-bottom:12px;
      }

      .logo-box i{
        font-size:31px;
      }

      .brand h1{
        font-size:20px;
      }

      .brand p{
        font-size:11px;
      }

      .card{
        padding:23px 18px;
        border-radius:22px;
      }

      .card-head h2{
        font-size:21px;
      }

      .card-head p{
        font-size:11px;
      }

      input,
      .submit{
        height:52px;
      }
    }

    /* =========================
       شاشات صغيرة جداً
    ========================= */

    @media(max-height:700px){

      body{
        align-items:flex-start;
        padding-top:18px;
        padding-bottom:18px;
      }

      .brand{
        margin-bottom:15px;
      }

      .logo-box{
        width:66px;
        height:66px;
        margin-bottom:9px;
      }

      .logo-box i{
        font-size:27px;
      }

      .brand h1{
        font-size:19px;
      }

      .card{
        padding:22px 18px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrap">

    <!-- =========================
         العنوان
    ========================== -->

    <div class="brand">

      <div class="logo-box">
        <i class="fa-solid fa-book-quran"></i>
      </div>

      <h1>
        مركز حردان طارق القرآني
      </h1>

      <p>
        البوابة الإدارية الخاصة بالمعلمين
      </p>

    </div>


    <!-- =========================
         كرت الدخول
    ========================== -->

    <div class="card">

      <div class="card-head">

        <div class="small-title">
          <i class="fa-solid fa-shield-halved"></i>
          دخول آمن للمعلمين
        </div>

        <h2>
          دخول المعلمين
        </h2>

        <p>
          أدخل كود المعلمين الموحد للوصول إلى لوحة متابعة الطلاب وإدارة المركز.
        </p>

      </div>


      <form id="teacherLoginForm">

        <div class="field">

          <label for="teacherCode">
            كود الدخول
          </label>

          <div class="input-wrap">

            <i class="fa-solid fa-key input-icon"></i>

            <input
              id="teacherCode"
              type="password"
              inputmode="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              maxlength="32"
              placeholder="أدخل الكود الموحد"
              required
            >

            <button
              class="show-code"
              id="showCode"
              type="button"
              aria-label="إظهار الكود"
            >
              <i class="fa-solid fa-eye"></i>
            </button>

          </div>

        </div>


        <button
          class="submit"
          id="loginButton"
          type="submit"
        >
          <i class="fa-solid fa-right-to-bracket"></i>
          دخول إلى لوحة المعلم
        </button>


        <div
          class="message"
          id="message"
          aria-live="polite"
        ></div>

      </form>


      <div class="hint">
        <i class="fa-solid fa-circle-info"></i>
        الكود موحّد لجميع المعلمين، ولا حاجة لإدخال البريد الإلكتروني.
      </div>

    </div>


    <div class="footer-note">
      © 2026 مركز حردان طارق القرآني
    </div>

  </div>


  <script>

    /* =====================================================
       كود المعلمين الموحد
       غيّر هذه القيمة فقط لتغيير كود الدخول
    ====================================================== */

    const TEACHER_ACCESS_CODE = '20269';


    /* =====================================================
       العناصر
    ====================================================== */

    const form =
      document.getElementById('teacherLoginForm');

    const codeInput =
      document.getElementById('teacherCode');

    const message =
      document.getElementById('message');

    const loginButton =
      document.getElementById('loginButton');

    const showCode =
      document.getElementById('showCode');


    /* =====================================================
       إذا كان مسجّل دخول بالفعل
    ====================================================== */

    if (
      localStorage.getItem('teacherAccess') === 'granted'
    ) {

      window.location.href =
        'teacher-dashboard.html';

    }


    /* =====================================================
       إظهار / إخفاء الكود
    ====================================================== */

    showCode.addEventListener(
      'click',
      () => {

        const visible =
          codeInput.type === 'text';

        codeInput.type =
          visible
            ? 'password'
            : 'text';

        showCode.innerHTML =
          visible
            ? '<i class="fa-solid fa-eye"></i>'
            : '<i class="fa-solid fa-eye-slash"></i>';

      }
    );


    /* =====================================================
       تسجيل الدخول
    ====================================================== */

    form.addEventListener(
      'submit',
      (event) => {

        event.preventDefault();


        const enteredCode =
          codeInput.value.trim();


        /* إزالة الرسالة القديمة */
        message.textContent = '';
        message.className = 'message';


        /* الكود صحيح */
        if (
          enteredCode ===
          TEACHER_ACCESS_CODE
        ) {

          localStorage.setItem(
            'teacherAccess',
            'granted'
          );


          message.className =
            'message success';

          message.textContent =
            'تم التحقق بنجاح، جارٍ فتح لوحة المعلم...';


          loginButton.disabled =
            true;


          loginButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ الدخول...';


          setTimeout(
            () => {

              window.location.href =
                'teacher-dashboard.html';

            },
            400
          );


          return;

        }


        /* الكود خاطئ */
        message.className =
          'message error';

        message.textContent =
          'كود الدخول غير صحيح.';


        codeInput.value =
          '';


        codeInput.focus();

      }
    );

  </script>

</body>
</html>
