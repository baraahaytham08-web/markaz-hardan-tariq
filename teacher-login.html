<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول المعلمين | مركز حردان طارق القرآني</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    :root{
      --green:#174d3a;
      --green-dark:#103b2c;
      --green-light:#edf5f1;
      --gold:#b28b18;
      --gold-light:#d4b44c;
      --cream:#faf8f0;
      --text:#1f2933;
      --muted:#74808a;
      --border:#e5e9e6;
      --danger:#b3261e;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,"Tahoma",sans-serif;
      background:linear-gradient(135deg,#faf8f0 0%,#fff 48%,#edf5f1 100%);
      color:var(--text);
    }

    .login-wrap{
      width:min(440px,100%);
    }

    .brand{
      text-align:center;
      margin-bottom:18px;
    }

    .logo{
      width:74px;
      height:74px;
      margin:0 auto 14px;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      color:#fff;
      font-size:31px;
      box-shadow:0 15px 30px rgba(23,77,58,.14);
    }

    .brand h1{
      color:var(--green);
      font-size:23px;
      margin-bottom:6px;
    }

    .brand p{
      color:var(--muted);
      font-size:12px;
    }

    .card{
      background:rgba(255,255,255,.95);
      border:1px solid var(--border);
      border-radius:24px;
      padding:30px;
      box-shadow:0 20px 55px rgba(23,77,58,.10);
    }

    .card-head{
      margin-bottom:23px;
    }

    .card-head h2{
      color:var(--green);
      font-size:21px;
      margin-bottom:7px;
    }

    .card-head p{
      color:var(--muted);
      font-size:12px;
      line-height:1.8;
    }

    label{
      display:block;
      color:var(--green);
      font-size:12px;
      font-weight:bold;
      margin-bottom:8px;
    }

    .input-wrap{
      position:relative;
    }

    .input-wrap i{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      color:#98a29d;
      font-size:14px;
      pointer-events:none;
    }

    input{
      width:100%;
      height:50px;
      border:1px solid var(--border);
      border-radius:13px;
      outline:none;
      background:#fcfdfc;
      color:var(--text);
      font-size:18px;
      letter-spacing:3px;
      text-align:center;
      padding:0 45px 0 45px;
      transition:.2s;
    }

    input:focus{
      border-color:var(--gold);
      background:#fff;
      box-shadow:0 0 0 4px rgba(178,139,24,.08);
    }

    .show-code{
      position:absolute;
      left:9px;
      top:7px;
      width:36px;
      height:36px;
      border:0;
      border-radius:9px;
      background:#f1f4f2;
      color:#62706a;
      cursor:pointer;
    }

    .submit{
      width:100%;
      height:50px;
      margin-top:18px;
      border:0;
      border-radius:13px;
      background:linear-gradient(135deg,var(--green),#21644b);
      color:#fff;
      font-weight:bold;
      font-size:14px;
      cursor:pointer;
      transition:.2s;
      box-shadow:0 9px 20px rgba(23,77,58,.14);
    }

    .submit:hover{
      transform:translateY(-2px);
      background:linear-gradient(135deg,var(--green-dark),var(--green));
    }

    .message{
      min-height:22px;
      margin-top:13px;
      text-align:center;
      font-size:12px;
      font-weight:bold;
    }

    .message.error{
      color:var(--danger);
    }

    .message.success{
      color:#237a31;
    }

    .hint{
      margin-top:18px;
      padding:12px 14px;
      border-radius:12px;
      background:var(--green-light);
      color:#5f6b66;
      font-size:11px;
      line-height:1.8;
      text-align:center;
    }

    .footer-note{
      text-align:center;
      color:#8a938e;
      font-size:10px;
      margin-top:16px;
    }

    @media(max-width:480px){
      .card{
        padding:23px;
      }

      .brand h1{
        font-size:20px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrap">

    <div class="brand">

      <div class="logo">
        <i class="fa-solid fa-book-quran"></i>
      </div>

      <h1>
        مركز حردان طارق القرآني
      </h1>

      <p>
        البوابة الإدارية للمعلمين
      </p>

    </div>


    <div class="card">

      <div class="card-head">

        <h2>
          دخول المعلمين
        </h2>

        <p>
          أدخل كود المعلمين الموحد للوصول إلى لوحة المتابعة.
        </p>

      </div>


      <form id="teacherLoginForm">

        <label for="teacherCode">
          كود الدخول
        </label>


        <div class="input-wrap">

          <i class="fa-solid fa-key"></i>

          <input
            id="teacherCode"
            type="password"
            inputmode="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            maxlength="32"
            placeholder="أدخل الكود الموحد"
            required
          >

          <button
            class="show-code"
            id="showCode"
            type="button"
            aria-label="إظهار الكود">

            <i class="fa-solid fa-eye"></i>

          </button>

        </div>


        <button
          class="submit"
          id="loginButton"
          type="submit">

          <i class="fa-solid fa-right-to-bracket"></i>

          دخول إلى لوحة المعلم

        </button>


        <div
          class="message"
          id="message">
        </div>

      </form>


      <div class="hint">
        الكود موحّد لجميع المعلمين، ولا حاجة لإدخال البريد الإلكتروني.
      </div>

    </div>


    <div class="footer-note">
      © 2026 مركز حردان طارق القرآني
    </div>

  </div>


  <script>

    /* =====================================================
       كود المعلمين الموحد
       غيّر هذه القيمة فقط لتغيير كود الدخول
    ====================================================== */

    const TEACHER_ACCESS_CODE =
      '20269';


    const form =
      document.getElementById(
        'teacherLoginForm'
      );


    const codeInput =
      document.getElementById(
        'teacherCode'
      );


    const message =
      document.getElementById(
        'message'
      );


    const loginButton =
      document.getElementById(
        'loginButton'
      );


    const showCode =
      document.getElementById(
        'showCode'
      );


    /* إذا كان مسجّل دخول بالفعل */
    if (
      localStorage.getItem(
        'teacherAccess'
      ) === 'granted'
    ) {

      window.location.href =
        'teacher-dashboard.html';

    }


    /* إظهار / إخفاء الكود */
    showCode.addEventListener(
      'click',
      () => {

        const visible =
          codeInput.type === 'text';

        codeInput.type =
          visible
            ? 'password'
            : 'text';

        showCode.innerHTML =
          visible
            ? '<i class="fa-solid fa-eye"></i>'
            : '<i class="fa-solid fa-eye-slash"></i>';

      }
    );


    /* تسجيل الدخول */
    form.addEventListener(
      'submit',
      (event) => {

        event.preventDefault();


        const enteredCode =
          codeInput.value.trim();


        if (
          enteredCode ===
          TEACHER_ACCESS_CODE
        ) {

          localStorage.setItem(
            'teacherAccess',
            'granted'
          );


          message.className =
            'message success';

          message.textContent =
            'تم التحقق بنجاح، جارٍ فتح لوحة المعلم...';


          loginButton.disabled =
            true;


          loginButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ الدخول...';


          setTimeout(
            () => {

              window.location.href =
                'teacher-dashboard.html';

            },
            350
          );


          return;

        }


        message.className =
          'message error';


        message.textContent =
          'كود الدخول غير صحيح.';


        codeInput.value =
          '';


        codeInput.focus();

      }
    );

  </script>

</body>
</html>
