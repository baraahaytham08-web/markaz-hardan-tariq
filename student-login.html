  </div>

<script>

  const SUPABASE_URL =
    'https://lsbbcybpiulusdgfhepf.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_qECf_PrJFSGgMJJr4yJLew_MCeslUF0';

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const form =
    document.getElementById('loginForm');

  const input =
    document.getElementById('studentName');

  const button =
    document.getElementById('loginButton');

  const errorBox =
    document.getElementById('errorBox');


  function showError(message) {

    errorBox.textContent = message;
    errorBox.style.display = 'block';

  }


  function hideError() {

    errorBox.style.display = 'none';

  }


  form.addEventListener(
    'submit',
    async function(event) {

      event.preventDefault();

      hideError();

      const name =
        input.value.trim();

      if (!name) {

        showError('اكتب اسم الطالب أولاً.');

        return;

      }

      button.disabled = true;
      button.textContent = 'جاري التحقق...';

      try {

        const {
          data,
          error
        } = await supabaseClient
          .from('students')
          .select('*')
          .eq('name', name)
          .eq('status', 'active')
          .maybeSingle();


        if (error) {

          console.error(error);

          throw new Error(
            'حدث خطأ أثناء الاتصال بالنظام.'
          );

        }


        if (!data) {

          showError(
            'لم يتم العثور على طالب بهذا الاسم أو أن الحساب غير فعال.'
          );

          return;

        }


        sessionStorage.setItem(
          'studentSession',
          JSON.stringify({
            id: data.id,
            name: data.name,
            section: data.section,
            memorization: data.memorization,
            status: data.status
          })
        );


        window.location.href =
          'student-dashboard.html';


      } catch (error) {

        console.error(error);

        showError(
          error.message ||
          'تعذر تسجيل الدخول، حاول مرة أخرى.'
        );

      } finally {

        button.disabled = false;
        button.textContent = 'دخول إلى ملفي';

      }

    }
  );

</script>

</body>
