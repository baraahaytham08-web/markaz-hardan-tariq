<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ملف الطالب | مركز حردان طارق القرآني</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #07563c;
      --green2: #0b7450;
      --gold: #c29d45;
      --cream: #f8f4e8;
      --text: #17352b;
      --muted: #777;
      --white: #fff;
      --danger: #a22;
    }

    body {
      background: #f4f6f2;
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
    }

    header {
      background: linear-gradient(135deg, var(--green), #063626);
      color: white;
      padding: 22px 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .12);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .brand p {
      font-size: 13px;
      opacity: .8;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-btn {
      border: 1px solid rgba(255, 255, 255, .3);
      background: transparent;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      font-size: 14px;
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, .1);
    }

    .container {
      width: calc(100% - 30px);
      max-width: 1100px;
      margin: 25px auto 50px;
    }

    .welcome {
      background: white;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
      border-right: 5px solid var(--gold);
    }

    .welcome h2 {
      color: var(--green);
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.7;
    }

    .profile {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
    }

    .student-card {
      text-align: center;
    }

    .photo {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--gold);
      background: var(--cream);
      margin-bottom: 15px;
    }

    .student-card h2 {
      color: var(--green);
      margin-bottom: 8px;
      font-size: 21px;
    }

    .section {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 15px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .detail {
      background: #fafafa;
      border-radius: 13px;
      padding: 15px;
      border: 1px solid #eee;
    }

    .detail small {
      display: block;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .detail strong {
      color: var(--text);
      line-height: 1.5;
      word-break: break-word;
    }

    .section-title {
      color: var(--green);
      margin-bottom: 18px;
      font-size: 21px;
    }

    .progress-box {
      margin-bottom: 18px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .progress {
      height: 13px;
      background: #e9ece8;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--gold));
      border-radius: inherit;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 13px;
      text-align: right;
      border-bottom: 1px solid #eee;
    }

    th {
      background: var(--cream);
      color: var(--green);
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 8px;
      background: #fff5d8;
      color: #856404;
      font-size: 13px;
    }

    .attendance {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .attendance-item {
      background: #f8fbf8;
      border: 1px solid #dce9df;
      padding: 15px;
      border-radius: 14px;
      text-align: center;
    }

    .present {
      color: #087443;
      font-weight: bold;
      margin-top: 7px;
    }

    .empty {
      color: var(--muted);
      padding: 20px 0;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      font-size: 17px;
    }

    .error {
      max-width: 650px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      color: var(--danger);
      box-shadow: 0 5px 25px rgba(0, 0, 0, .08);
    }

    .error h2 {
      margin-bottom: 10px;
    }

    .error p {
      color: #666;
      line-height: 1.8;
    }

    .error button {
      margin-top: 18px;
      border: none;
      background: var(--green);
      color: white;
      padding: 11px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .id-box {
      margin-top: 12px;
      background: #f7f7f7;
      border-radius: 10px;
      padding: 10px;
      color: #555;
      font-size: 12px;
      direction: ltr;
      word-break: break-all;
    }

    @media (max-width: 750px) {

      .profile {
        grid-template-columns: 1fr;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .header-inner {
        align-items: flex-start;
      }

      .brand h1 {
        font-size: 18px;
      }

      .welcome {
        padding: 20px;
      }

      .header-actions {
        flex-direction: column;
        width: 100%;
      }

      .header-inner {
        flex-direction: column;
      }

      .header-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>

</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <h1>مركز حردان طارق القرآني</h1>
      <p>ملف متابعة الطالب</p>
    </div>

    <div class="header-actions">
      <a class="header-btn" href="./teacher-dashboard.html">
        ← لوحة المعلم
      </a>
    </div>

  </div>
</header>

<main class="container" id="app">

  <div class="loading">
    جاري تحميل ملف الطالب...
  </div>

</main>

<script>

  /* =========================
     إعدادات Supabase
  ========================= */

  const SUPABASE_URL =
    'https://lsbbcybpiulusdgfhepf.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_qECf_PrJFSGgMJJr4yJLew_MCeslUF0';


  /* =========================
     التحقق من Supabase
  ========================= */

  if (!window.supabase) {

    document.getElementById('app').innerHTML = `
      <div class="error">
        <h2>تعذر تشغيل الصفحة</h2>

        <p>
          لم يتم تحميل مكتبة Supabase.
          تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.
        </p>

        <button onclick="location.reload()">
          إعادة المحاولة
        </button>
      </div>
    `;

    throw new Error('Supabase library not loaded');

  }


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     أدوات مساعدة
  ========================= */

  function escapeHtml(value) {

    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  function getStudentIdFromUrl() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const id =
      params.get('id') ||
      params.get('student_id') ||
      params.get('studentId');

    return id ? String(id).trim() : '';

  }


  function detail(label, value) {

    const finalValue =
      value === undefined ||
      value === null ||
      String(value).trim() === ''
        ? 'غير محدد'
        : value;

    return `
      <div class="detail">

        <small>
          ${escapeHtml(label)}
        </small>

        <strong>
          ${escapeHtml(finalValue)}
        </strong>

      </div>
    `;

  }


  function progressBar(value) {

    let number =
      Number(value);

    if (isNaN(number)) {
      number = 0;
    }

    number =
      Math.max(
        0,
        Math.min(100, number)
      );

    return `
      <div class="progress">

        <div
          class="progress-bar"
          style="width:${number}%"
        ></div>

      </div>
    `;

  }


  function showError(title, message, studentId = '') {

    document.getElementById('app').innerHTML = `

      <div class="error">

        <h2>
          ${escapeHtml(title)}
        </h2>

        <p>
          ${escapeHtml(message)}
        </p>

        ${
          studentId
            ? `
              <div class="id-box">
                ID: ${escapeHtml(studentId)}
              </div>
            `
            : ''
        }

        <button onclick="location.reload()">
          المحاولة مرة أخرى
        </button>

        <button
          onclick="window.location.href='./teacher-dashboard.html'"
          style="
            background:#777;
            margin-right:8px;
          "
        >
          العودة للوحة المعلم
        </button>

      </div>

    `;

  }


  /* =========================
     تحميل الطالب
  ========================= */

  async function loadStudent() {

    const app =
      document.getElementById('app');

    const studentId =
      getStudentIdFromUrl();


    /* لا يوجد ID */

    if (!studentId) {

      showError(
        'لم يتم تحديد الطالب',
        'رابط صفحة الطالب لا يحتوي على رقم الطالب.'
      );

      return;

    }


    try {

      /* =========================
         جلب بيانات الطالب
      ========================= */

      const {
        data: student,
        error: studentError
      } = await supabaseClient

        .from('students')

        .select('*')

        .eq('id', studentId)

        .single();


      if (studentError) {

        console.error(
          'Student error:',
          studentError
        );

        throw new Error(
          studentError.message ||
          'تعذر جلب بيانات الطالب'
        );

      }


      if (!student) {

        throw new Error(
          'لم يتم العثور على الطالب'
        );

      }


      /* =========================
         جلب ملف الطالب
      ========================= */

      const {
        data: profileRow,
        error: profileError
      } = await supabaseClient

        .from('student_profiles')

        .select('data')

        .eq(
          'student_id',
          String(studentId)
        )

        .maybeSingle();


      if (profileError) {

        console.error(
          'Profile error:',
          profileError
        );

        throw new Error(
          profileError.message ||
          'تعذر جلب ملف الطالب'
        );

      }


      const profile =
        profileRow &&
        profileRow.data &&
        typeof profileRow.data === 'object'

          ? profileRow.data

          : {};


      renderStudent(
        student,
        profile,
        studentId
      );


    } catch (error) {

      console.error(
        'Load student error:',
        error
      );


      showError(
        'تعذر تحميل ملف الطالب',
        error.message ||
        'حدث خطأ غير معروف أثناء تحميل البيانات.',
        studentId
      );

    }

  }


  /* =========================
     عرض الطالب
  ========================= */

  function renderStudent(
    student,
    profile,
    studentId
  ) {

    const app =
      document.getElementById('app');


    /* الصورة */

    const photo =
      profile.photoUrl ||
      profile.photo_url ||
      '';


    /* البيانات */

    const weeklyGoal =
      profile.weeklyGoal ??
      profile.weekly_goal ??
      'غير محدد';


    const points =
      profile.totalPoints ??
      profile.total_points ??
      '0';


    const weeklyProgress =
      profile.weeklyProgress ??
      profile.weekly_progress ??
      0;


    const attendance =
      Array.isArray(profile.attendance)
        ? profile.attendance
        : [];


    const weeklyPlan =
      Array.isArray(profile.weeklyPlan)
        ? profile.weeklyPlan
        : [];


    const tests =
      Array.isArray(profile.tests)
        ? profile.tests
        : [];


    const recitations =
      Array.isArray(profile.recitations)
        ? profile.recitations
        : [];


    const hifzProgress =
      Number(
        profile.hifzProgress ??
        profile.hifz_progress ??
        0
      );


    const reviewProgress =
      Number(
        profile.reviewProgress ??
        profile.review_progress ??
        0
      );


    const completedPages =
      profile.completedPages ??
      profile.completed_pages ??
      '0';


    const requiredPages =
      profile.requiredPages ??
      profile.required_pages ??
      '0';


    const generalEvaluation =
      profile.generalEvaluation ??
      profile.general_evaluation ??
      'غير محدد';


    const equivalentRecitation =
      profile.equivalentRecitation ??
      profile.equivalent_recitation ??
      'غير محدد';


    const nextExam =
      profile.nextExam ??
      profile.next_exam ??
      'غير محدد';


    const nextExamDate =
      profile.nextExamDate ??
      profile.next_exam_date ??
      'غير محدد';


    /* =========================
       عرض الصفحة
    ========================= */

    app.innerHTML = `

      <!-- الترحيب -->

      <section class="welcome">

        <h2>
          ملف الطالب:
          ${escapeHtml(student.name)}
        </h2>

        <p>
          هذه صفحة متابعة الطالب في مركز حردان طارق القرآني.
          يتم تحديث المعلومات من لوحة المعلم.
        </p>

      </section>


      <!-- معلومات الطالب -->

      <section class="profile">

        <div class="card student-card">

          ${
            photo

              ? `

                <img
                  class="photo"
                  src="${escapeHtml(photo)}"
                  alt="صورة الطالب"
                >

              `

              : `

                <div
                  class="photo"
                  style="
                    display:inline-flex;
                    align-items:center;
                    justify-content:center;
                    font-size:40px;
                    color:#07563c;
                  "
                >
                  👤
                </div>

              `
          }


          <h2>
            ${escapeHtml(student.name)}
          </h2>


          <div class="section">

            ${escapeHtml(
              student.section ||
              'غير محدد'
            )}

          </div>


          <div style="
            color:#777;
            font-size:12px;
            direction:ltr;
            word-break:break-all;
          ">

            ID:
            ${escapeHtml(studentId)}

          </div>

        </div>


        <div class="card">

          <h2 class="section-title">
            معلومات الطالب
          </h2>


          <div class="details">

            ${detail(
              'الشعبة',
              student.section
            )}


            ${detail(
              'الحفظ الحالي',
              student.memorization
            )}


            ${detail(
              'الحالة',
              student.status === 'active'
                ? 'فعال'
                : student.status
            )}


            ${detail(
              'الهدف الأسبوعي',
              weeklyGoal
            )}


            ${detail(
              'مجموع النقاط',
              points
            )}


            ${detail(
              'التقدم الأسبوعي',
              weeklyProgress + '%'
            )}


            ${detail(
              'تاريخ الالتحاق',
              profile.joiningDate ||
              profile.joining_date
            )}


            ${detail(
              'مكان السكن',
              profile.residence
            )}


            ${detail(
              'الحافلة',
              profile.bus
            )}


            ${detail(
              'موقع المنزل',
              profile.homeLocation ||
              profile.home_location
            )}


            ${detail(
              'رقم ولي الأمر',
              profile.guardianPhone ||
              profile.guardian_phone
            )}


            ${detail(
              'أجزاء القرآن المكتملة',
              profile.completedQuranParts ||
              profile.completed_quran_parts
            )}

          </div>

        </div>

      </section>


      <!-- التقدم -->

      <section
        class="card"
        style="margin-bottom:20px"
      >

        <h2 class="section-title">
          التقدم الأسبوعي
        </h2>


        <div class="progress-box">

          <div class="progress-head">

            <span>
              الحفظ
            </span>

            <span>
              ${hifzProgress}%
            </span>

          </div>


          ${progressBar(hifzProgress)}


          <p style="
            margin-top:8px;
            color:#777;
          ">

            تم إنجاز
            ${escapeHtml(completedPages)}
            من
            ${escapeHtml(requiredPages)}

          </p>

        </div>


        <div class="progress-box">

          <div class="progress-head">

            <span>
              المراجعة
            </span>

            <span>
              ${reviewProgress}%
            </span>

          </div>


          ${progressBar(reviewProgress)}

        </div>


        <div class="details">

          ${detail(
            'التقييم العام',
            generalEvaluation
          )}


          ${detail(
            'التسميع المكافئ',
            equivalentRecitation
          )}


          ${detail(
            'الهدف الأسبوعي',
            weeklyGoal
          )}


          ${detail(
            'الاختبار القادم',
            nextExam
          )}


          ${detail(
            'تاريخ الاختبار',
            nextExamDate
          )}

        </div>

      </section>


      <!-- الحضور -->

      <section
        class="card"
        style="margin-bottom:20px"
      >

        <h2 class="section-title">
          الحضور
        </h2>


        ${
          attendance.length

            ? `

              <div class="attendance">

                ${attendance.map(item => `

                  <div class="attendance-item">

                    <strong>
                      ${escapeHtml(
                        item.date ||
                        item.day ||
                        ''
                      )}
                    </strong>

                    <div class="present">

                      ${escapeHtml(
                        item.status ||
                        'حاضر'
                      )}

                    </div>

                  </div>

                `).join('')}

              </div>

            `

            : `

              <div class="empty">
                لا يوجد سجل حضور مسجل حاليًا.
              </div>

            `
        }

      </section>


      <!-- الخطة الأسبوعية -->

      <section
        class="card"
        style="margin-bottom:20px"
      >

        <h2 class="section-title">
          الخطة الأسبوعية
        </h2>


        ${
          weeklyPlan.length

            ? `

              <div class="table-wrap">

                <table>

                  <thead>

                    <tr>

                      <th>
                        التاريخ
                      </th>

                      <th>
                        الجزء
                      </th>

                      <th>
                        الصفحات
                      </th>

                      <th>
                        المطلوب
                      </th>

                      <th>
                        الحالة
                      </th>

                    </tr>

                  </thead>


                  <tbody>

                    ${weeklyPlan.map(item => `

                      <tr>

                        <td>
                          ${escapeHtml(item.date)}
                        </td>

                        <td>
                          ${escapeHtml(item.juz)}
                        </td>

                        <td>
                          ${escapeHtml(item.pages)}
                        </td>

                        <td>
                          ${escapeHtml(
                            item.exam ||
                            'لا يوجد'
                          )}
                        </td>

                        <td>

                          <span class="status">

                            ${escapeHtml(
                              item.status ||
                              'قيد الانتظار'
                            )}

                          </span>

                        </td>

                      </tr>

                    `).join('')}

                  </tbody>

                </table>

              </div>

            `

            : `

              <div class="empty">
                لم يتم تسجيل خطة أسبوعية بعد.
              </div>

            `
        }

      </section>


      <!-- الاختبارات -->

      <section
        class="card"
        style="margin-bottom:20px"
      >

        <h2 class="section-title">
          الاختبارات
        </h2>


        ${
          tests.length

            ? `

              <div class="table-wrap">

                <table>

                  <thead>

                    <tr>

                      <th>
                        الاختبار
                      </th>

                      <th>
                        التاريخ
                      </th>

                      <th>
                        النتيجة
                      </th>

                      <th>
                        النقاط
                      </th>

                    </tr>

                  </thead>


                  <tbody>

                    ${tests.map(test => `

                      <tr>

                        <td>
                          ${escapeHtml(test.name)}
                        </td>

                        <td>
                          ${escapeHtml(test.date)}
                        </td>

                        <td>
                          ${escapeHtml(test.result)}
                        </td>

                        <td>
                          ${escapeHtml(test.points)}
                        </td>

                      </tr>

                    `).join('')}

                  </tbody>

                </table>

              </div>

            `

            : `

              <div class="empty">
                لا توجد اختبارات مسجلة حاليًا.
              </div>

            `
        }

      </section>


      <!-- التسميع -->

      <section
        class="card"
        style="margin-bottom:20px"
      >

        <h2 class="section-title">
          سجل التسميع
        </h2>


        ${
          recitations.length

            ? `

              <div class="table-wrap">

                <table>

                  <thead>

                    <tr>

                      <th>
                        الصفحة
                      </th>

                      <th>
                        النوع
                      </th>

                      <th>
                        العلامة
                      </th>

                      <th>
                        التقييم
                      </th>

                      <th>
                        التاريخ
                      </th>

                    </tr>

                  </thead>


                  <tbody>

                    ${recitations.map(item => `

                      <tr>

                        <td>
                          ${escapeHtml(item.page)}
                        </td>

                        <td>
                          ${escapeHtml(
                            item.type === 'hifz'
                              ? 'حفظ'
                              : item.type === 'review'
                                ? 'مراجعة'
                                : item.type || '-'
                          )}
                        </td>

                        <td>
                          ${escapeHtml(item.score)}
                        </td>

                        <td>
                          ${escapeHtml(
                            item.grade ||
                            '-'
                          )}
                        </td>

                        <td>
                          ${escapeHtml(
                            item.date ||
                            '-'
                          )}
                        </td>

                      </tr>

                    `).join('')}

                  </tbody>

                </table>

              </div>

            `

            : `

              <div class="empty">
                لا يوجد تسميع مسجل حاليًا.
              </div>

            `
        }

      </section>


      <!-- الملاحظات -->

      <section class="card">

        <h2 class="section-title">
          ملاحظات المعلم
        </h2>


        <p style="
          line-height:2;
          color:#555;
        ">

          ${escapeHtml(
            profile.notes ||
            profile.generalNotes ||
            profile.general_notes ||
            'لا يوجد ملاحظات عامة مسجلة للطالب في الوقت الحالي.'
          )}

        </p>

      </section>

    `;

  }


  /* =========================
     تشغيل الصفحة
  ========================= */

  loadStudent();

</script>

</body>
</html>
