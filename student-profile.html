function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function number(value) {

  const n = Number(value);

  return Number.isFinite(n) ? n : 0;

}


function formatNumber(value, digits = 1) {

  const n = number(value);

  if (Number.isInteger(n)) return String(n);

  return n.toFixed(digits)
    .replace(/\.0+$/, '');

}


function clamp(value, min, max) {

  return Math.min(
    max,
    Math.max(min, number(value))
  );

}


function todayISO() {

  const d = new Date();

  const year =
    d.getFullYear();

  const month =
    String(d.getMonth() + 1)
      .padStart(2, '0');

  const day =
    String(d.getDate())
      .padStart(2, '0');

  return `${year}-${month}-${day}`;

}

  const start =
    new Date(now);

  start.setDate(
    now.getDate() -
    daysSinceFriday
  );

  start.setHours(0, 0, 0, 0);

  const end =
    new Date(start);

  end.setDate(
    start.getDate() + 6
  );

  end.setHours(23, 59, 59, 999);

  return {
    start,
    end
  };

}


function dateInCurrentWeek(dateValue) {

  if (!dateValue) return false;

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  if (Number.isNaN(d.getTime()))
    return false;

  const range =
    getCurrentWeekRange();

  return (
    d >= range.start &&
    d <= range.end
  );

}


function formatDate(dateValue) {

  if (!dateValue)
    return '—';

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  if (Number.isNaN(d.getTime()))
    return escapeHtml(dateValue);

  return d.toLocaleDateString(
    'ar-JO',
    {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }
  );

}

function mergeProfile(data) {

  const base =
    defaultProfile();

  const merged = {
    ...base,
    ...(data || {})
  };

  if (
    typeof merged.weeklyGoal !== 'object' ||
    merged.weeklyGoal === null
  ) {

    merged.weeklyGoal = {

    };

  }

  if (!Array.isArray(merged.attendance))
    merged.attendance = [];

  if (!Array.isArray(merged.weeklyPlan))
    merged.weeklyPlan = [];

  if (!Array.isArray(merged.tests))
    merged.tests = [];

  if (!Array.isArray(merged.recitations))
    merged.recitations = [];

  return merged;

}


/* =========================
   الحسابات التلقائية
========================= */

function getWeeklyRecitations() {

  return profile.recitations.filter(
    item =>
      dateInCurrentWeek(item.date)
  );

}


function getCurrentWeekStats() {

  const goalHifz =
    number(
      profile.weeklyGoal?.hifz
    );

  const goalReview =
    number(
      profile.weeklyGoal?.review
    );

  const records =
    getWeeklyRecitations();

  const hifzPages =
    records
      .filter(
        item =>
          item.type === 'hifz'
      )
      .reduce(
        (sum, item) =>
          sum + number(item.pages),
        0
      );

  const reviewPages =
    records
      .filter(
        item =>
          item.type === 'review'
      )
      .reduce(
        (sum, item) =>
          sum + number(item.pages),
        0
      );

  const hifzProgress =
    goalHifz > 0
      ? (hifzPages / goalHifz) * 100
      : 0;

  const reviewProgress =
    goalReview > 0
      ? (reviewPages / goalReview) * 100
      : 0;

  const equivalent =
    hifzPages +
    (
      reviewPages /
      REVIEW_TO_HIFZ_RATIO
    );

  const requiredEquivalent =
    goalHifz +
    (
      goalReview /
      REVIEW_TO_HIFZ_RATIO
    );

  const weeklyProgress =
    requiredEquivalent > 0
      ? (
          equivalent /
          requiredEquivalent
        ) * 100
      : 0;

  return {

    goalHifz,

    goalReview,

    hifzPages,

    reviewPages,

    hifzProgress,

    reviewProgress,

    equivalent,

    requiredEquivalent,

    weeklyProgress

  };

}


function getAllHifzPages() {

  return profile.recitations
    .filter(
      item =>
        item.type === 'hifz'
    )
    .map(
      item =>
        number(item.page)
    )
    .filter(
      page =>
        page >= 1 &&
        page <= TOTAL_QURAN_PAGES
    );

}


function getAllReviewPages() {

  return profile.recitations
    .filter(
      item =>
        item.type === 'review'
    )
    .map(
      item =>
        number(item.page)
    )
    .filter(
      page =>
        page >= 1 &&
        page <= TOTAL_QURAN_PAGES
    );

}


function getUniquePages() {

  const pages =
    new Set([
      ...getAllHifzPages(),
      ...getAllReviewPages()
    ]);

  return pages;

}


function getQuranProgress() {

  const unique =
    getUniquePages();

  return {

    completed:
      unique.size,

    percent:
      (
        unique.size /
        TOTAL_QURAN_PAGES
      ) * 100

  };

}


function getCompletedJuz() {

  const hifzPages =
    new Set(
      getAllHifzPages()
    );

  let completed = 0;

  let start = 1;

  for (
    let juz = 1;
    juz <= 30;
    juz++
  ) {

    const length =
      juz === 1 ||
      juz === 2
        ? 21
        : (
            juz === 30
              ? 23
              : 20
          );

    let all = true;

    for (
      let page = start;
      page < start + length;
      page++
    ) {

      if (!hifzPages.has(page)) {
        all = false;
        break;
      }

    }

    if (all)
      completed++;

    start += length;

  }

  return completed;

}


function getTestPoints() {

  return profile.tests.reduce(
    (sum, item) => {

      if (
        item.points !== '' &&
        item.points !== null &&
        item.points !== undefined
      ) {

        return sum +
          number(item.points);

      }

      const result =
        String(
          item.result || ''
        ).trim();

      if (
        result.includes('ممتاز')
      )
        return sum + 12;

      if (
        result.includes('جيد جداً') ||
        result.includes('جيد جدًا')
      )
        return sum + 8;

      if (
        result.includes('جيد')
      )
        return sum + 4;

      return sum;

    },
    0
  );

}


function getRecitationStats() {

  const records =
    profile.recitations;

  const pages =
    records.reduce(
      (sum, item) =>
        sum + number(item.pages || 1),
      0
    );

  const graded =
    records
      .map(
        item =>
          number(item.score)
      )
      .filter(
        score =>
          score > 0
      );

  const average =
    graded.length
      ? (
          graded.reduce(
            (a,b) => a + b,
            0
          ) /
          graded.length
        )
      : 0;

  let highest = '—';

  if (records.length) {

    const grades =
      records
        .map(
          item =>
            item.grade || ''
        )
        .filter(Boolean);

    const order = [
      'ممتاز+',
      'ممتاز',
      'جيد جداً',
      'جيد جدًا',
      'جيد'
    ];

    for (
      const wanted of order
    ) {

      if (
        grades.some(
          grade =>
            grade === wanted
        )
      ) {

        highest = wanted;
        break;

      }

    }

  }

  return {

    records:
      records.length,

    pages,

    average,

    highest

  };

}


function getGeneralEvaluation() {

  const weekly =
    getCurrentWeekStats();

  if (weekly.weeklyProgress >= 100)
    return 'ملتزم ممتاز';

  if (weekly.weeklyProgress >= 75)
    return 'ملتزم جداً';

  if (weekly.weeklyProgress >= 50)
    return 'ملتزم';

  if (weekly.weeklyProgress > 0)
    return 'ملتزم جزئياً';

  return 'بحاجة للمتابعة';

}


/* =========================

========================= */

async function checkTeacher() {

  try {

    const {
      data: { user },
      error
    } =
      await supabaseClient.auth.getUser();

    if (
      error ||
      !user
    ) {

      window.location.href =
        'teacher-login.html';

      return false;

    }

    if (
      String(user.email || '')
        .toLowerCase() !==
      TEACHER_EMAIL.toLowerCase()
    ) {

      alert(
        'هذا القسم مخصص للمعلم فقط.'
      );

      await supabaseClient.auth.signOut();

      window.location.href =
        'teacher-login.html';

      return false;

    }

    return true;

  } catch (error) {

    console.error(error);

    window.location.href =
      'teacher-login.html';

    return false;

  }

}


/* =========================
   تحميل الطالب
========================= */

async function loadStudent() {

  try {

    if (!(await checkTeacher()))
      return;

    const params =
      new URLSearchParams(
        window.location.search
      );

    studentId =
      params.get('id');

    if (!studentId) {

      document.getElementById(
        'app'
      ).innerHTML = `
        <div class="loading">
          لم يتم تحديد الطالب.
        </div>
      `;

      return;

    }

    const {
      data,
      error
    } =
      await supabaseClient
        .from('students')
        .select('*')
        .eq('id', studentId)
        .maybeSingle();

    if (error)
      throw error;

    if (!data) {

      document.getElementById(
        'app'
      ).innerHTML = `
        <div class="loading">
          تعذر العثور على الطالب.
        </div>
      `;

      return;

    }

    student = data;

    const {
      data: profileRow,
      error: profileError
    } =
      await supabaseClient
        .from('student_profiles')
        .select('data')
        .eq(
          'student_id',
          String(studentId)
        )
        .maybeSingle();

    if (profileError) {

      console.error(
        'Profile error:',
        profileError
      );

      profile =
        defaultProfile();

    } else {

      profile =
        mergeProfile(
          profileRow?.data || {}
        );

    }

    render();

  } catch (error) {

    console.error(
      'LOAD STUDENT ERROR:',
      error
    );

    document.getElementById(
      'app'
    ).innerHTML = `
      <div class="loading">
        <h2 style="color:#b42318;margin-bottom:10px;">
          تعذر تحميل ملف الطالب
        </h2>

        <p>
          حدث خطأ أثناء تحميل البيانات.
        </p>
      </div>
    `;

  }

}

/* =========================
   خريطة القرآن
========================= */

function getJuzInfo(juz) {

  let start = 1;

  for (
    let i = 1;
    i < juz;
    i++
  ) {

    start +=
      i === 1 ||
      i === 2
        ? 21
        : (
            i === 30
              ? 23
              : 20
          );

  }

  const length =
    juz === 1 ||
    juz === 2
      ? 21
      : (
          juz === 30
            ? 23
            : 20
        );

  return {

    start,

    end:
      start + length - 1,

    length

  };

}


function getPageState(page) {

  const hasHifz =
    profile.recitations.some(
      item =>
        item.type === 'hifz' &&
        number(item.page) === page
    );

  const hasReview =
    profile.recitations.some(
      item =>
        item.type === 'review' &&
        number(item.page) === page
    );

  if (hasHifz && hasReview)
    return 'both';

  if (hasHifz)
    return 'hifz';

  if (hasReview)
    return 'review';

  return '';

}


function renderQuranMap() {

  const box =
    document.getElementById(
      'quranMap'
    );

  if (!box) return;

  let html = '';

  for (
    let juz = 1;
    juz <= 30;
    juz++
  ) {

    const info =
      getJuzInfo(juz);

    let completed = 0;

    let pagesHtml = '';

    for (
      let page = info.start;
      page <= info.end;
      page++
    ) {

      const state =
        getPageState(page);

      if (state)
        completed++;

      let title =
        `صفحة ${page}`;

      if (state === 'hifz')
        title += ' — حفظ جديد';

      if (state === 'review')
        title += ' — مراجعة';

      if (state === 'both')
        title += ' — حفظ + مراجعة';

      pagesHtml += `

        <div
          class="page-dot ${state}"
          title="${title}"
          onclick="showPageInfo(${page})"
        ></div>

      `;

    }

    html += `

      <div class="juz-card">

        <div class="juz-head">

          <span class="juz-title">
            الجزء ${juz}
          </span>

          <span class="juz-count">
            ${completed}/${info.length}
          </span>

        </div>

        <div class="page-grid">

          ${pagesHtml}

        </div>

      </div>

    `;

  }

  box.innerHTML = html;

}


function showPageInfo(page) {

  const records =
    profile.recitations.filter(
      item =>
        number(item.page) === page
    );

  if (!records.length) {

    alert(
      `صفحة ${page}\n\nلا يوجد سجل تسميع لهذه الصفحة حتى الآن.`
    );

    return;

  }

  const text =
    records
      .map(
        item => {

          const type =
            item.type === 'review'
              ? 'مراجعة'
              : 'حفظ جديد';

          return `
${type}
التاريخ: ${formatDate(item.date)}
الدرجة: ${item.score || 'غير مسجلة'}%
التقدير: ${item.grade || 'غير مسجل'}
الملاحظة: ${item.note || 'لا توجد'}
          `.trim();

        }
      )
      .join('\n\n----------------\n\n');

  alert(
    `📖 تفاصيل الصفحة ${page}\n\n${text}`
  );

}

    } =

          .trim()

    };


    const {
      error: profileError
    } =
      await supabaseClient
        .from('student_profiles')

          student_id:
            String(studentId),

          data:
            newProfile,

          updated_at:
            new Date().toISOString()

        });


    if (profileError)
      throw profileError;


    profile =
      mergeProfile(
        newProfile
      );

    student = {

    };


    showMessage(
      'تم حفظ بيانات الطالب وحساب الإحصائيات تلقائياً بنجاح ✅',
      'success'
    );


    render();

  } catch (error) {

    console.error(
      'SAVE ERROR:',
      error
    );

    showMessage(
      error.message ||
      'حدث خطأ أثناء حفظ البيانات.',
      'error'
    );

  } finally {

    button.disabled = false;

    button.textContent =
      '💾 حفظ جميع التعديلات';

  }

}
