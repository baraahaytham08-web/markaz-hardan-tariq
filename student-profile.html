function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function number(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


function formatNumber(
  value,
  digits = 1
) {

  const n =
    number(value);

  if (
    Number.isInteger(n)
  ) {

    return String(n);

  }

  return n
    .toFixed(digits)
    .replace(
      /\.0+$/,
      ''
    );

}


function clamp(
  value,
  min,
  max
) {

  return Math.min(
    max,
    Math.max(
      min,
      number(value)
    )
  );

}


function todayISO() {

  const d =
    new Date();

  return `${d.getFullYear()}-${String(
    d.getMonth() + 1
  ).padStart(2,'0')}-${String(
    d.getDate()
  ).padStart(2,'0')}`;

}


function formatDate(
  dateValue
) {

  if (!dateValue)
    return '—';

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {

    return escapeHtml(
      dateValue
    );

  }

  return d.toLocaleDateString(
    'ar-JO',
    {
      year:'numeric',
      month:'2-digit',
      day:'2-digit'
    }
  );

}

/* =========================================================
   WEEK
========================================================= */

function getWeekRangeForDate(
  dateValue
) {

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  if (
    Number.isNaN(d.getTime())
  )
    return null;

  const day =
    d.getDay();

  const daysSinceFriday =
    (day + 2) % 7;

  const start =
    new Date(d);

  start.setDate(
    d.getDate() -
    daysSinceFriday
  );

  start.setHours(
    0,0,0,0
  );

  const end =
    new Date(start);

  end.setDate(
    start.getDate() + 6
  );

  end.setHours(
    23,59,59,999
  );

  return {
    start,
    end
  };

}


function dateInCurrentWeek(
  dateValue
) {

  if (!dateValue)
    return false;

  const range =
    getWeekRangeForDate(
      todayISO()
    );

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  return !!range &&
    d >= range.start &&
    d <= range.end;

}

function getRecitationGrade(
  score
) {

  const s =
    number(score);

  if (
    !score &&
    score !== 0
  ) {

    return {

      label:'لم يتم التقييم',

      className:'grade-empty'

    };

  }

  if (
    s >= 97
  ) {

    return {

      label:'ممتاز (متقن)',

      className:'grade-excellent'

    };

  }

  if (
    s >= 95
  ) {

    return {

      label:'جيد جداً (أخطاء قليلة)',

      className:'grade-very-good'

    };

  }

  if (
    s >= 92
  ) {

    return {

      label:'جيد (أخطاء متعددة)',

      className:'grade-good'

    };

  }

  if (
    s >= 90
  ) {

    return {

      label:'مقبول (يحتاج تمكين)',

      className:'grade-acceptable'

    };

  }

  return {

    label:'مراجعة الصفحة',

    className:'grade-review'

  };

}

function getRecitationPoints(
  item
) {

  const score =
    number(item.score);

  if (
    score <= 0
  )
    return 0;

  if (
    item.type === 'hifz'
  ) {

    if (score >= 97) return 6;
    if (score >= 95) return 5;
    if (score >= 92) return 4;
    if (score >= 90) return 2;

    return 0;

  }

  if (
    item.type === 'review'
  ) {

    if (score >= 97) return 3;
    if (score >= 95) return 2.5;
    if (score >= 92) return 2;
    if (score >= 90) return 1;

    return 0;

  }

  return 0;

}


function getTestPointsByResult(
  result
) {

  const r =
    String(result || '');

  if (
    r.includes('ممتاز+')
  )
    return 12;

  if (
    r.includes('ممتاز')
  )
    return 12;

  if (
    r.includes('جيد جداً') ||
    r.includes('جيد جدًا')
  )
    return 8;

  if (
    r.includes('جيد')
  )
    return 4;

  return 0;

}

function getCurrentWeekStats() {

  const goalHifz =
    number(
      profile.weeklyGoal?.hifz
    );

  const goalReview =
    number(
      profile.weeklyGoal?.review
    );

  const records =
    getWeeklyRecitations();

  const hifzPages =
    records.filter(
      item =>
        item.type === 'hifz'
    ).length;

  const reviewPages =
    records.filter(
      item =>
        item.type === 'review'
    ).length;

  const hifzProgress =
    goalHifz > 0
      ? (
          hifzPages /
          goalHifz
        ) * 100
      : 0;

  const reviewProgress =
    goalReview > 0
      ? (
          reviewPages /
          goalReview
        ) * 100
      : 0;

  const equivalent =
    hifzPages +
    (
      reviewPages /
      REVIEW_TO_HIFZ_RATIO
    );

  const requiredEquivalent =
    goalHifz +
    (
      goalReview /
      REVIEW_TO_HIFZ_RATIO
    );

  const weeklyProgress =
    requiredEquivalent > 0
      ? (
          equivalent /
          requiredEquivalent
        ) * 100
      : 0;

  return {

    goalHifz,

    goalReview,

    hifzPages,

    reviewPages,

    hifzProgress,

    reviewProgress,

    equivalent,

    requiredEquivalent,

    weeklyProgress

  };

}

function getJuzInfo(
  juz
) {

  let start =
    1;

  for (
    let i = 1;
    i < juz;
    i++
  ) {

    if (
      i === 1
    ) {

      start += 21;

    } else {

      start += 20;

    }

  }

  let length =
    20;

  if (
    juz === 1
  )
    length = 21;

  if (
    juz === 30
  )
    length = 23;

  return {

    start,

    end:
      start + length - 1,

    length

  };

}


function getCompletedJuz() {

  const hifz =
    getHifzPageSet();

  let completed =
    0;

  for (
    let juz = 1;
    juz <= 30;
    juz++
  ) {

    const info =
      getJuzInfo(juz);

    let all =
      true;

    for (
      let page = info.start;
      page <= info.end;
      page++
    ) {

      if (
        !hifz.has(page)
      ) {

        all =
          false;

        break;

      }

    }

    if (
      all
    )
      completed++;

  }

  return completed;

}

/* =========================================================
   COMMITMENT
========================================================= */

function getAttendanceCommitment() {

  const records =
    profile.attendance.filter(
      item =>
        dateInCurrentWeek(
          item.date
        )
    );

  if (
    !records.length
  )
    return 100;

  let score =
    0;

  records.forEach(
    item => {

      if (
        item.status === 'حاضر'
      )
        score += 1;

      else if (
        item.status === 'متأخر'
      )
        score += .5;

      else if (
        item.status === 'معتذر'
      )
        score += .5;

    }
  );

  return (
    score /
    records.length
  ) * 100;

}


function getTestCommitment() {

  const tests =
    profile.tests.filter(
      item =>
        dateInCurrentWeek(
          item.date
        )
    );

  if (
    !tests.length
  )
    return 100;

  const passed =
    tests.filter(
      item =>
        getTestPointsByResult(
          item.result
        ) > 0
    ).length;

  return (
    passed /
    tests.length
  ) * 100;

}

    getCurrentWeekStats();

  const attendance =
    clamp(
      getAttendanceCommitment(),
      0,
      100
    );

  const hifz =
    clamp(
      weekly.hifzProgress,
      0,
      100
    );

  const review =
    clamp(
      weekly.reviewProgress,
      0,
      100
    );

  const tests =
    clamp(
      getTestCommitment(),
      0,
      100
    );

  const total =
    (
      attendance * .20
    ) +
    (
      hifz * .35
    ) +
    (
      review * .25
    ) +
    (
      tests * .20
    );

  let label =
    'بحاجة للمتابعة';

  if (
    total >= 90
  )
    label =
      'ممتاز الالتزام';

  else if (
    total >= 80
  )
    label =
      'جيد جداً';

  else if (
    total >= 70
  )
    label =
      'جيد';

  else if (
    total >= 60
  )
    label =
      'مقبول';

  return {

    total,

    label,

    attendance,

    hifz,

    review,

    tests

  };

}

function getHighestGrade() {

  const grades =
    profile.recitations
      .map(
        item =>
          getRecitationGrade(
            item.score
          )
      )
      .filter(
        grade =>
          grade.label !==
          'لم يتم التقييم'
      );

  if (
    !grades.length
  )
    return '—';

  const order = [

    'ممتاز (متقن)',

    'جيد جداً (أخطاء قليلة)',

    'جيد (أخطاء متعددة)',

    'مقبول (يحتاج تمكين)',

    'مراجعة الصفحة'

  ];

  for (
    const wanted of order
  ) {

    if (
      grades.some(
        grade =>
          grade.label ===
          wanted
      )
    )
      return wanted;

  }

  return '—';

}


function getRecitationStats() {

  const records =
    profile.recitations;

  const scores =
    records
      .map(
        item =>
          number(item.score)
      )
      .filter(
        score =>
          score >= 0 &&
          score <= 100
      );

  const average =
    scores.length
      ? (
          scores.reduce(
            (
              a,
              b
            ) =>
              a + b,
            0
          ) /
          scores.length
        )
      : 0;

  return {

    records:
      records.length,

    pages:
      records.length,

    average,

    highest:
      getHighestGrade()

  };

}


/* =========================================================
   PLAN
========================================================= */

function isDateInsideRange(
  dateValue,
  range
) {

  if (!dateValue)
    return false;

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  return (
    d >= range.start &&
    d <= range.end
  );

}


function getPlanStatus(
  item
) {

  const targetHifz =
    number(
      item.hifzTarget ??
      item.hifz ??
      0
    );

  const targetReview =
    number(
      item.reviewTarget ??
      item.review ??
      0
    );

  if (!item.date) {

    return {

      label:
        'قيد الإدخال',

      className:
        'status-pending'

    };

  }

  const range =
    getWeekRangeForDate(
      item.date
    );

  if (!range) {

    return {

      label:
        'قيد الإدخال',

      className:
        'status-pending'

    };

  }

  const hifz =
    profile.recitations.filter(
      rec =>
        rec.type === 'hifz' &&
        isDateInsideRange(
          rec.date,
          range
        )
    ).length;

  const review =
    profile.recitations.filter(
      rec =>
        rec.type === 'review' &&
        isDateInsideRange(
          rec.date,
          range
        )
    ).length;

  const hifzDone =
    targetHifz <= 0
      ? true
      : hifz >= targetHifz;

  const reviewDone =
    targetReview <= 0
      ? true
      : review >= targetReview;

  if (
    hifzDone &&
    reviewDone
  ) {

    return {

      label:
        'مكتملة ✅',

      className:
        'status-complete'

    };

  }

  if (
    hifz > 0 ||
    review > 0
  ) {

    return {

      label:
        'جزئية',

      className:
        'status-partial'

    };

  }

  return {

    label:
      'قيد التنفيذ',

    className:
      'status-running'

  };

}


/* =========================================================
   TEACHER CHECK
========================================================= */

async function checkTeacher() {

  /*
    أولاً:
    نسمح بالدخول إذا كان المعلم دخل من الـDashboard
    باستخدام مفتاح الدخول المحلي الموجود عندك.
  */

  const localAccess =
    localStorage.getItem(
      'teacherAccess'
    );

  if (
    localAccess === 'granted'
  ) {

    return true;

  }


  /*
    احتياط:
    إذا كان عندك أيضاً تسجيل دخول Supabase Auth
    نبقيه شغالاً.
  */

  try {

    const {
      data:{
        user
      } = {},
      error
    } =
      await supabaseClient
        .auth
        .getUser();

    if (
      !error &&
      user
    ) {

      if (
        String(
          user.email || ''
        ).toLowerCase() ===
        TEACHER_EMAIL.toLowerCase()
      ) {

        return true;

      }

    }

  } catch (
    error
  ) {

    console.error(
      'TEACHER CHECK ERROR:',
      error
    );

  }


  window.location.href =
    'teacher-login.html';

  return false;

}

          </h2>

          <p>
            افتح ملف الطالب من لوحة المعلم مرة أخرى.
          </p>

        </div>

      `;

      return;

    }


    /*
      حفظ المعرّف محلياً كاحتياط
    */

    localStorage.setItem(
      'selectedStudentId',
      String(studentId)
    );


    /*
      تحميل الطالب من جدول students
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .from('students')
        .select('*')
        .eq(
          'id',
          studentId
        )
        .limit(1)
        .maybeSingle();


    if (error)
      throw error;


    if (!data) {

      document.getElementById(
        'app'
      ).innerHTML = `

        <div class="loading">

          <div class="loading-icon">
            🔎
          </div>

          <h2
            style="
              color:#b42318;
              margin-bottom:10px;
            "
          >
            تعذر العثور على الطالب
          </h2>

          <p
            style="
              margin-bottom:8px;
            "
          >
            لم يتم العثور على سجل الطالب في قاعدة البيانات.
          </p>

          <div
            style="
              display:inline-block;
              padding:8px 12px;
              background:#f7faf8;
              border-radius:10px;
              color:#718078;
              font-size:12px;
            "
          >
            المعرّف:
            ${escapeHtml(studentId)}
          </div>

        </div>

      `;

      return;

    }


    /*
      تحميل profile قبل تثبيت اسم الطالب
    */

    let profileData =
      {};

    try {

      profileData =
        await loadStudentProfileData();

    } catch (
      profileError
    ) {

      console.error(
        'PROFILE LOAD ERROR:',
        profileError
      );

      profileData =
        defaultProfile();

    }


    /*
      تطبيع بيانات الطالب
      واستخراج الاسم بشكل قوي
    */

    student =
      normalizeStudent(
        data,
        profileData
      );


    profile =
      mergeProfile(
        profileData
      );


    /*
      إذا كان الاسم موجوداً في profile فقط،
      نخليه متاحاً في العرض والحفظ.
    */

    if (
      !student.name &&
      profile.name
    ) {

      student.name =
        String(
          profile.name
        ).trim();

    }


    /*
      تغيير عنوان الصفحة حسب اسم الطالب
    */

    const displayName =
      getStudentName(
        student,
        profile
      );


    if (
      displayName
    ) {

      document.title =
        `ملف ${displayName} | مركز حردان طارق القرآني`;

    }


    render();

  } catch (
    error
  ) {

    console.error(
      'LOAD ERROR:',
      error
    );


    document.getElementById(
      'app'
    ).innerHTML = `

      <div class="loading">

            text-align:left;

        >
          ${escapeHtml(
            error?.message ||
            String(error)

}

async function handlePhotoFile(
  input
) {

  const file =
    input.files?.[0];

  if (!file)
    return;

  if (
    !file.type.startsWith(
      'image/'
    )
  ) {

    alert(
      'الملف المحدد ليس صورة.'
    );

    input.value =
      '';

    return;

  }

  try {

    const compressed =
      await compressImage(
        file
      );

    profile.photoUrl =
      compressed;

    const preview =
      document.getElementById(
        'photoPreview'
      );

    const hero =
      document.getElementById(
        'heroPhoto'
      );

    if (preview)
      preview.src =
        compressed;

    if (hero)
      hero.src =
        compressed;

    setHeroSaveMessage(
      '📷 تم إدراج الصورة، اضغط حفظ البيانات الأساسية لتثبيتها.',
      'success'
    );

  } catch (
    error
  ) {

    console.error(
      error
    );

    alert(
      'تعذر تجهيز الصورة.'
    );

  }

}


function compressImage(
  file
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();

      reader.onload =
        () => {

          const img =
            new Image();

          img.onload =
            () => {

              const maxSize =
                700;

              let width =
                img.width;

              let height =
                img.height;

              if (
                width > height &&
                width > maxSize
              ) {

                height =
                  Math.round(
                    height *
                    maxSize /
                    width
                  );

                width =
                  maxSize;

              }

              else if (
                height >= width &&
                height > maxSize
              ) {

                width =
                  Math.round(
                    width *
                    maxSize /
                    height
                  );

                height =
                  maxSize;

              }

              const canvas =
                document.createElement(
                  'canvas'
                );

              canvas.width =
                width;

              canvas.height =
                height;

              const ctx =
                canvas.getContext(
                  '2d'
                );

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );

              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  0.82
                )
              );

            };

          img.onerror =
            reject;

          img.src =
            reader.result;

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}

async function readFreshProfile() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from('student_profiles')
      .select('data')
      .eq(
        'student_id',
        String(studentId)
      )
      .maybeSingle();

  if (error)
    throw error;

  return mergeProfile(
    data?.data || {}
  );

}


async function saveProfilePatch(
  changes
) {

  const fresh =
    await readFreshProfile();

  const merged = {

    ...fresh,

    ...changes

  };

  const {
    error
  } =
    await supabaseClient
      .from('student_profiles')
      .upsert({

        student_id:
          String(studentId),

        data:
          merged,

        updated_at:
          new Date()
            .toISOString()

      });

  if (error)
    throw error;

  return merged;

}

  },

  },

      'ملاحظات المعلم',

    label:

  }

];


function setupAccordions() {

  const sections =
    [
      ...document.querySelectorAll(
        '#app > .section'
      )
    ];

  sections.forEach(
    section => {

      if (
        section.dataset.accordionReady ===
        '1'
      )
        return;

      const head =
        section.querySelector(
          ':scope > .section-head'
        );

      const titleElement =
        head?.querySelector(
          '.section-title'
        );

      if (
        !head ||
        !titleElement
      )
        return;

      const title =
        titleElement
          .textContent
          .replace(
            /\s+/g,
            ' '
          )
          .trim();

      const config =
        SECTION_SAVE_CONFIG.find(
          item =>
            title.includes(
              item.match
            )
        );

      section.classList.add(
        'accordion-section'
      );

      section.dataset.accordionReady =
        '1';

      section.dataset.accordionKey =
        config?.key || '';


      head.setAttribute(
        'role',
        'button'
      );

      head.setAttribute(
        'tabindex',
        '0'
      );

      head.setAttribute(
        'aria-expanded',
        'false'
      );


      head.addEventListener(
        'click',
        () => {

          toggleAccordion(
            section
          );

        }
      );


      head.addEventListener(
        'keydown',
        event => {

          if (
            event.key === 'Enter' ||
            event.key === ' '
          ) {

            event.preventDefault();

            toggleAccordion(
              section
            );

          }

        }
      );


      const body =
        document.createElement(
          'div'
        );

      body.className =
        'section-body';


      [
        ...section.children
      ].forEach(
        child => {

          if (
            child !== head
          )
            body.appendChild(
              child
            );

        }
      );


      section.appendChild(
        body
      );


      if (
        config
      ) {

        const saveWrap =
          document.createElement(
            'div'
          );

        saveWrap.className =
          'section-save-wrap';


        const saveButton =
          document.createElement(
            'button'
          );

        saveButton.type =
          'button';

        saveButton.className =
          'section-save-btn';

        saveButton.textContent =
          config.label;


        saveButton.addEventListener(
          'click',
          event => {

            event.stopPropagation();

            saveStudentSection(
              config.key,
              saveButton
            );

          }
        );


        const saveMessage =
          document.createElement(
            'span'
          );

        saveMessage.className =
          'section-save-message';


        saveWrap.appendChild(
          saveButton
        );

        saveWrap.appendChild(
          saveMessage
        );


        body.appendChild(
          saveWrap
        );

      }


      closeAccordion(
        section
      );

    }
  );

}


function toggleAccordion(
  section
) {

  if (
    section.classList.contains(
      'open'
    )
  ) {

    closeAccordion(
      section
    );

  } else {

    openAccordion(
      section
    );

  }

}


function openAccordion(
  section
) {

  document.querySelectorAll(
    '.accordion-section.open'
  ).forEach(
    other => {

      if (
        other !== section
      )
        closeAccordion(
          other
        );

    }
  );


  section.classList.add(
    'open'
  );


  section
    .querySelector(
      '.section-head'
    )
    ?.setAttribute(
      'aria-expanded',
      'true'
    );

}


function closeAccordion(
  section
) {

  section.classList.remove(
    'open'
  );

  section
    .querySelector(
      '.section-head'
    )
    ?.setAttribute(
      'aria-expanded',
      'false'
    );

}


function openAccordionByKey(
  key
) {

  const section =
    document.querySelector(
      `.accordion-section[data-accordion-key="${key}"]`
    );

  if (
    section
  )
    openAccordion(
      section
    );

  return section;

}


function showSectionSaveMessage(
  section,
  text,
  type = 'success'
) {

  const message =
    section?.querySelector(
      '.section-save-message'
    );

  if (!message)
    return;

  message.className =
    `section-save-message ${type}`;

  message.textContent =
    text;

}

async function saveStudentSection(
  key,
  button
) {

  if (
    !studentId ||
    !profile
  )
    return;


  const section =
    button.closest(
      '.accordion-section'
    );


  const oldText =
    button.textContent;


  button.disabled =
    true;

  button.textContent =
    '⏳ جاري الحفظ...';


  try {

    switch (
      key
    ) {

      case 'weeklyGoal': {

        const weeklyGoal = {

          hifz:
            number(
              document
                .getElementById(
                  'goalHifz'
                )
                ?.value
            ),

          review:
            number(
              document
                .getElementById(
                  'goalReview'
                )
                ?.value
            )

        };


        profile =
          mergeProfile(
            await saveProfilePatch({
              weeklyGoal
            })
          );


        break;

      }


      case 'attendance': {

        const attendance =
          collectAttendance();


        profile =
          mergeProfile(
            await saveProfilePatch({
              attendance
            })
          );


        break;

      }


      case 'weeklyPlan': {

        const weeklyPlan =
          collectPlan();


        profile =
          mergeProfile(
            await saveProfilePatch({
              weeklyPlan
            })
          );


        break;

      }


      case 'tests': {

        const tests =
          collectTests();


        profile =
          mergeProfile(
            await saveProfilePatch({
              tests
            })
          );


        break;

      }


      case 'recitations': {

        const recitations =
          collectRecitations();


        profile =
          mergeProfile(
            await saveProfilePatch({
              recitations
            })
          );


        break;

      }


      case 'notes': {

        const notes =
          document
            .getElementById(
              'notes'
            )
            ?.value
            .trim() || '';


        profile =
          mergeProfile(
            await saveProfilePatch({
              notes
            })
          );


        break;

      }


      default:

        throw new Error(
          'الخانة غير معروفة.'
        );

    }


    render();


    const reopened =
      openAccordionByKey(
        key
      );


    showSectionSaveMessage(
      reopened,

      '✅ تم حفظ هذه الخانة فقط بنجاح.',

      'success'
    );


  } catch (
    error
  ) {

    console.error(
      'SECTION SAVE ERROR:',
      error
    );


    showSectionSaveMessage(
      section,

      error?.message ||
      'حدث خطأ أثناء الحفظ.',

      'error'
    );

  } finally {

    if (
      button
    ) {

      const current =
        document.querySelector(
          `.accordion-section[data-accordion-key="${key}"] .section-save-btn`
        );

      if (
        current
      ) {

        current.disabled =
          false;

        current.textContent =
          oldText;

      }

    }

  }

}

  profile.attendance.push({

    date:
      todayISO(),

    status:
      'حاضر'

  });


  renderAttendance();

}


function removeAttendance(
  index
) {

  profile.attendance.splice(
    index,
    1
  );

  renderAttendance();

}


function collectAttendance() {

  return profile.attendance.map(
    (
      item,
      index
    ) => ({

    document.querySelector(
      `[data-rec-type="${index}"]`
    )?.value ||
    'hifz';

  const grade =
    getRecitationGrade(
      score
    );

  const points =
    getRecitationPoints({
      type,
      score
    });

  const gradeElement =
    document.getElementById(
      `grade-preview-${index}`
    );

  const pointsElement =
    document.getElementById(
      `points-preview-${index}`
    );

  if (
    gradeElement
  ) {

    gradeElement.className =
      `grade-preview ${grade.className}`;

    gradeElement.textContent =
      grade.label;

  }

  if (
    pointsElement
  ) {

    pointsElement.value =
      formatNumber(
        points,
        1
      );

  }

    .map(
      (
        item,
        index
      ) => {

        const type =
          document.querySelector(
            `[data-rec-type="${index}"]`
          )?.value ||
          'hifz';

        const scoreRaw =
          document.querySelector(
            `[data-rec-score="${index}"]`
          )?.value;

        const score =
          scoreRaw === ''
            ? ''
            : clamp(
                scoreRaw,
                0,
                100
              );

        const grade =
          score === ''
            ? ''
            : getRecitationGrade(
                score
              ).label;

        return {

          date:
            document.querySelector(
              `[data-rec-date="${index}"]`
            )?.value || '',

          page:
            number(
              document.querySelector(
                `[data-rec-page="${index}"]`
              )?.value
            ),

          type,

          score,

          grade,

          note:
            document.querySelector(
              `[data-rec-note="${index}"]`
            )?.value || ''

        };

      }
    )
    .filter(
      item =>
        item.page >= 1 &&
        item.page <= 604
    );

/* =========================================================
   QURAN MAP
========================================================= */

function getPageState(
  page
) {

  const hifz =
    getHifzPageSet();

  const review =
    getReviewPageSet();

  const hasHifz =
    hifz.has(page);

  const hasReview =
    review.has(page);

  if (
    hasHifz &&
    hasReview
  )
    return 'both';

  if (
    hasHifz
  )
    return 'hifz';

  if (
    hasReview
  )
    return 'review';

  return '';

}


function renderQuranMap() {

  const box =
    document.getElementById(
      'quranMap'
    );

  if (!box)
    return;

  let html =
    '';

  for (
    let juz = 1;
    juz <= 30;
    juz++
  ) {

    const info =
      getJuzInfo(
        juz
      );

    let completed =
      0;

    let pagesHtml =
      '';

    for (
      let page =
        info.start;

      page <= info.end;

      page++
    ) {

      const state =
        getPageState(
          page
        );

      if (
        state
      )
        completed++;

      let stateText =
        'غير مسجلة';

      if (
        state === 'hifz'
      )
        stateText =
          'حفظ جديد';

      else if (
        state === 'review'
      )
        stateText =
          'مراجعة';

      else if (
        state === 'both'
      )
        stateText =
          'حفظ + مراجعة';

      pagesHtml += `

        <div
          class="
            page-dot
            ${state}
          "
          title="
            صفحة ${page} —
            ${stateText}
          "
          onclick="
            showPageInfo(
              ${page}
            )
          "
        >
          ${page}
        </div>

      `;

    }

    html += `

      <div class="juz-card">

        <div class="juz-head">

          <span class="juz-title">
            الجزء ${juz}
          </span>

          <span class="juz-count">
            ${completed}/${info.length}
          </span>

        </div>


        <div class="juz-range">
          الصفحات
          ${info.start}
          -
          ${info.end}
        </div>


        <div class="page-grid">
          ${pagesHtml}
        </div>

      </div>

    `;

  }

  box.innerHTML =
    html;

}


function showPageInfo(
  page
) {

  const records =
    profile.recitations.filter(
      item =>
        number(item.page) ===
        page
    );

  if (
    !records.length
  ) {

    alert(
      `📖 صفحة ${page}\n\nلا يوجد سجل لهذه الصفحة حتى الآن.`
    );

    return;

  }

  const details =
    records.map(
      item => {

        const grade =
          getRecitationGrade(
            item.score
          );

        const points =
          getRecitationPoints(
            item
          );

        const type =
          item.type === 'review'
            ? 'مراجعة'
            : 'حفظ جديد';

        return [

          `النوع: ${type}`,

          `التاريخ: ${formatDate(
            item.date
          )}`,

          `الدرجة: ${
            item.score === ''
              ? 'غير مسجلة'
              : item.score + '%'
          }`,

          `التقدير: ${grade.label}`,

          `النقاط: ${
            formatNumber(
              points,
              1
            )
          }`,

          `الملاحظة: ${
            item.note ||
            'لا توجد'
          }`

        ].join('\n');

      }
    )
    .join(
      '\n\n----------------\n\n'
    );

  alert(
    `📖 تفاصيل الصفحة ${page}\n\n${details}`
  );

}
