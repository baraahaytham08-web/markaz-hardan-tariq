
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    ملف الطالب | مركز حردان طارق القرآني
  </title>

  <link
    rel="icon"
    type="image/png"
    href="logo.png"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="logo.png"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #0d4d3a;
      --green-2: #176b50;
      --green-3: #218866;
      --dark: #092f25;

      --gold: #c5a04a;
      --gold-2: #e0c36c;

      --cream: #f8f5eb;

      --bg: #f2f6f3;
      --white: #ffffff;

      --text: #17362c;
      --muted: #718078;

      --border: #e2e9e5;

      --success: #16834b;
      --danger: #b42318;

      --blue: #2869a8;
      --orange: #b76a18;

      --shadow:
        0 12px 35px rgba(13, 77, 58, .08);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(
          circle at 10% 5%,
          rgba(197,160,74,.10),
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 15%,
          rgba(23,107,80,.08),
          transparent 25%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background:
        rgba(9,47,37,.96);

      backdrop-filter:
        blur(16px);

      color: white;

      box-shadow:
        0 8px 25px rgba(0,0,0,.10);
    }

    .header-inner {
      width:
        min(
          1250px,
          calc(100% - 30px)
        );

      min-height: 78px;

      margin: auto;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 18px;
    }

    .brand-link {
      color: white;
      text-decoration: none;

      display: flex;
      align-items: center;

      gap: 13px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;

      border-radius: 50%;

      object-fit: cover;

      overflow: hidden;

      border:
        2px solid
        rgba(224,195,108,.8);

      box-shadow:
        0 5px 18px rgba(0,0,0,.2);
    }

    .brand h1 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .brand p {
      color:
        rgba(255,255,255,.68);

      font-size: 12px;
    }

    .back {
      color: white;

      text-decoration: none;

      border:
        1px solid
        rgba(255,255,255,.20);

      background:
        rgba(255,255,255,.07);

      padding:
        11px 16px;

      border-radius: 12px;

      transition: .2s;

      white-space: nowrap;
    }

    .back:hover {
      background:
        rgba(255,255,255,.14);

      transform:
        translateY(-2px);
    }


    /* =========================
       PAGE
    ========================= */

    .container {
      width:
        min(
          1250px,
          calc(100% - 30px)
        );

      margin:
        28px auto 80px;
    }


    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: none;

      padding: 15px 18px;

      border-radius: 15px;

      margin-bottom: 18px;

      font-weight: bold;

      box-shadow: var(--shadow);
    }

    .success {
      background: #eaf8ef;
      color: #13743f;
      border: 1px solid #cbead6;
    }

    .error {
      background: #fff0ef;
      color: #a31d16;
      border: 1px solid #f2cdca;
    }


    /* =========================
       HERO
    ========================= */

    .student-hero {
      position: relative;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(224,195,108,.18),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #0a382c,
          #14654b
        );

      border-radius: 28px;

      padding: 28px;

      color: white;

      margin-bottom: 20px;

      box-shadow:
        0 18px 45px
        rgba(13,77,58,.18);
    }

    .student-hero::before {
      content: "";

      position: absolute;

      width: 230px;
      height: 230px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 50%;

      left: -90px;
      top: -120px;
    }

    .student-hero::after {
      content: "";

      position: absolute;

      width: 280px;
      height: 280px;

      border:
        1px solid
        rgba(224,195,108,.12);

      border-radius: 50%;

      right: -130px;
      bottom: -170px;
    }

    .hero-content {
      position: relative;
      z-index: 2;

      display: flex;

      align-items: center;

      gap: 22px;
    }

    .hero-photo {
      width: 105px;
      height: 105px;

      border-radius: 50%;

      object-fit: cover;

      overflow: hidden;

      border:
        4px solid
        rgba(224,195,108,.95);

      background:
        rgba(255,255,255,.10);

      flex-shrink: 0;

      box-shadow:
        0 8px 28px
        rgba(0,0,0,.20);
    }

    .hero-info {
      flex: 1;
    }

    .hero-info h2 {
      font-size:
        clamp(
          24px,
          4vw,
          34px
        );

      margin-bottom: 7px;
    }

    .hero-info p {
      color:
        rgba(255,255,255,.75);

      margin-bottom: 14px;
    }

    .hero-pills {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }

    .hero-pill {
      background:
        rgba(255,255,255,.10);

      border:
        1px solid
        rgba(255,255,255,.13);

      padding:
        8px 12px;

      border-radius: 999px;

      font-size: 12px;
    }

    .hero-side {
      min-width: 240px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 9px;
    }

    .hero-stat {
      background:
        rgba(255,255,255,.08);

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: 18px;

      padding: 15px 12px;

      text-align: center;
    }

    .hero-stat small {
      display: block;

      color:
        rgba(255,255,255,.65);

      margin-bottom: 5px;

      font-size: 11px;
    }

    .hero-stat strong {
      font-size: 24px;

      color:
        var(--gold-2);
    }


    /* =========================
       SECTION
    ========================= */

    .section {
      margin-top: 20px;

      background:
        rgba(255,255,255,.94);

      border:
        1px solid
        rgba(226,233,229,.9);

      border-radius: 22px;

      padding: 23px;

      box-shadow:
        var(--shadow);
    }

    .section-head {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 20px;
    }

    .section-title {
      display: flex;

      align-items: center;

      gap: 10px;

      color:
        var(--green);

      font-size: 20px;
    }

    .section-title::before {
      content: "";

      width: 5px;
      height: 25px;

      border-radius: 20px;

      background:
        linear-gradient(
          var(--gold),
          var(--gold-2)
        );
    }

    .section-subtitle {
      color:
        var(--muted);

      font-size: 12px;

      margin-top: 4px;
    }


    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 14px;
    }

    .stat {
      position: relative;

      overflow: hidden;

      border:
        1px solid
        var(--border);

      background:
        linear-gradient(
          145deg,
          #fff,
          #f8fbf9
        );

      border-radius: 18px;

      padding: 18px;

      transition: .25s;
    }

    .stat:hover {
      transform:
        translateY(-4px);

      box-shadow:
        0 14px 30px
        rgba(13,77,58,.10);
    }

    .stat::after {
      content: "";

      position: absolute;

      width: 70px;
      height: 70px;

      border-radius: 50%;

      left: -25px;
      bottom: -35px;

      background:
        rgba(197,160,74,.08);
    }

    .stat-icon {
      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background:
        var(--cream);

      margin-bottom: 12px;

      font-size: 20px;
    }

    .stat-label {
      color:
        var(--muted);

      font-size: 12px;

      margin-bottom: 5px;
    }

    .stat-value {
      color:
        var(--green);

      font-size: 26px;

      font-weight: 900;
    }

    .stat-note {
      color:
        var(--muted);

      font-size: 11px;

      margin-top: 5px;
    }


    /* =========================
       PROGRESS
    ========================= */

    .progress-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 16px;
    }

    .progress-card {
      border:
        1px solid
        var(--border);

      border-radius: 18px;

      padding: 18px;

      background: #fcfdfc;
    }

    .progress-top {
      display: flex;

      justify-content: space-between;

      gap: 12px;

      margin-bottom: 12px;
    }

    .progress-top strong {
      color:
        var(--green);
    }

    .percent {
      font-weight: 900;

      color:
        var(--gold);

      font-size: 21px;
    }

    .bar {
      height: 11px;

      background:
        #e8eee9;

      border-radius: 999px;

      overflow: hidden;
    }

    .bar-fill {
      height: 100%;

      width: 0;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          var(--green),
          var(--green-3)
        );

      transition:
        width .5s ease;
    }

    .progress-note {
      margin-top: 10px;

      color:
        var(--muted);

      font-size: 12px;
    }


    /* =========================
       FORM
    ========================= */

    .form-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 15px;
    }

    .field.full-field {
      grid-column:
        1 / -1;
    }

    label {
      display: block;

      color:
        #345248;

      font-weight: bold;

      font-size: 13px;

      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;

      border:
        1px solid
        #dce5df;

      border-radius: 12px;

      padding:
        12px 13px;

      background: white;

      color:
        var(--text);

      font-size: 14px;

      outline: none;

      transition: .2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color:
        var(--green-2);

      box-shadow:
        0 0 0 4px
        rgba(23,107,80,.08);
    }

    textarea {
      min-height: 130px;

      resize: vertical;
    }

    input[readonly] {
      background:
        #f7faf8;

      cursor: default;
    }


    /* =========================
       IMAGE PICKER
    ========================= */

    .image-upload {
      border:
        1px dashed
        #bdcdc4;

      background:
        #f8fbf9;

      border-radius: 15px;

      padding: 15px;
    }

    .image-upload-row {
      display: flex;

      align-items: center;

      gap: 14px;
    }

    .image-preview {
      width: 75px;
      height: 75px;

      border-radius: 50%;

      object-fit: cover;

      border:
        2px solid
        var(--gold);

      background:
        #eef3ef;
    }

    .file-button {
      position: relative;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      padding:
        11px 15px;

      border-radius: 11px;

      background:
        var(--green);

      color: white;

      cursor: pointer;

      font-weight: bold;

      transition: .2s;
    }

    .file-button:hover {
      transform:
        translateY(-2px);

      background:
        var(--green-2);
    }

    .file-button input {
      position: absolute;

      opacity: 0;

      inset: 0;

      cursor: pointer;
    }

    .image-help {
      margin-top: 8px;

      font-size: 11px;

      color:
        var(--muted);
    }


    /* =========================
       TABLE
    ========================= */

    .table-wrap {
      overflow-x: auto;

      border:
        1px solid
        var(--border);

      border-radius: 15px;
    }

    table {
      width: 100%;

      border-collapse:
        collapse;

      min-width: 720px;
    }

    th {
      background:
        #f3f7f4;

      color:
        var(--green);

      padding: 13px;

      text-align: right;

      font-size: 12px;

      white-space: nowrap;
    }

    td {
      padding: 12px;

      border-top:
        1px solid
        var(--border);

      font-size: 13px;

      vertical-align:
        middle;
    }


    /* =========================
       EDITOR
    ========================= */

    .editor-list {
      display: flex;

      flex-direction: column;

      gap: 12px;
    }

    .editor-row {
      border:
        1px solid
        var(--border);

      border-radius: 16px;

      background:
        #fbfdfc;

      padding: 15px;
    }

    .editor-row-head {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 12px;

      gap: 10px;
    }

    .editor-row-title {
      font-weight: 900;

      color:
        var(--green);
    }

    .editor-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;
    }

    .remove {
      border: none;

      background:
        #fff0ef;

      color:
        var(--danger);

      border-radius: 9px;

      padding:
        8px 11px;

      cursor: pointer;

      font-weight: bold;
    }

    .remove:hover {
      background:
        #ffe1df;
    }

    .add {
      width: 100%;

      margin-top: 12px;

      border:
        1px dashed
        #b9c9c0;

      background:
        #f8fbf9;

      color:
        var(--green);

      padding: 12px;

      border-radius: 12px;

      cursor: pointer;

      font-weight: bold;

      transition: .2s;
    }

    .add:hover {
      background:
        #edf5f1;

      border-color:
        var(--green-2);
    }


    /* =========================
       RECITATION
    ========================= */

    .recitation-summary {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;

      margin-bottom: 16px;
    }

    .mini-stat {
      padding: 14px;

      background:
        #f7faf8;

      border:
        1px solid
        var(--border);

      border-radius: 14px;
    }

    .mini-stat small {
      display: block;

      color:
        var(--muted);

      margin-bottom: 5px;
    }

    .mini-stat strong {
      color:
        var(--green);

      font-size: 20px;
    }


    /* =========================
       GRADE
    ========================= */

    .grade-preview {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      width: 100%;

      min-height: 45px;

      padding: 8px 10px;

      border-radius: 11px;

      font-size: 12px;

      font-weight: 900;

      text-align: center;
    }

    .grade-excellent {
      background: #e7f7ed;
      color: #13743f;
    }

    .grade-very-good {
      background: #e8f1fb;
      color: #2869a8;
    }

    .grade-good {
      background: #fff3df;
      color: #9b5c0d;
    }

    .grade-acceptable {
      background: #f6f0dd;
      color: #7b6634;
    }

    .grade-review {
      background: #fff0ef;
      color: #b42318;
    }

    .grade-empty {
      background: #f1f3f2;
      color: #63716b;
    }


    /* =========================
       STATUS
    ========================= */

    .status-badge {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding:
        7px 11px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: bold;

      white-space: nowrap;
    }

    .status-complete {
      background: #e7f7ed;
      color: #13743f;
    }

    .status-partial {
      background: #fff3df;
      color: #9b5c0d;
    }

    .status-running {
      background: #e8f1fb;
      color: #2869a8;
    }

    .status-pending {
      background: #f1f3f2;
      color: #63716b;
    }


    /* =========================
       QURAN MAP
    ========================= */

    .quran-progress {
      margin-bottom: 20px;

      padding: 18px;

      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          #f4f8f5,
          #fbfaf3
        );

      border:
        1px solid
        var(--border);
    }

    .quran-progress-head {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 10px;
    }

    .quran-progress-head strong {
      color:
        var(--green);

      font-size: 22px;
    }

    .juz-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 13px;
    }

    .juz-card {
      border:
        1px solid
        var(--border);

      border-radius: 15px;

      padding: 13px;

      background: white;
    }

    .juz-head {
      display: flex;

      justify-content:
        space-between;

      gap: 8px;

      margin-bottom: 10px;
    }

    .juz-title {
      font-weight: 900;

      color:
        var(--green);

      font-size: 13px;
    }

    .juz-count {
      color:
        var(--muted);

      font-size: 11px;
    }

    .juz-range {
      color:
        #8a968f;

      font-size: 10px;

      margin-bottom: 8px;
    }

    .page-grid {
      display: grid;

      grid-template-columns:
        repeat(10, 1fr);

      gap: 4px;
    }

    .page-dot {
      min-height: 26px;

      border-radius: 6px;

      border:
        1px solid
        #e2e8e4;

      background:
        #f1f4f2;

      cursor: pointer;

      transition: .15s;

      position: relative;

      display: flex;

      align-items: center;

      justify-content: center;

      color:
        #68756f;

      font-size: 8px;

      font-weight: 900;

      user-select: none;
    }

    .page-dot:hover {
      transform:
        scale(1.12);

      z-index: 2;

      box-shadow:
        0 5px 12px
        rgba(0,0,0,.10);
    }

    .page-dot.hifz {
      background:
        #19764f;

      border-color:
        #19764f;

      color: white;
    }

    .page-dot.review {
      background:
        #d5b24e;

      border-color:
        #d5b24e;

      color:
        #3f3210;
    }

    .page-dot.both {
      background:
        linear-gradient(
          135deg,
          #19764f 50%,
          #d5b24e 50%
        );

      border-color:
        #19764f;

      color: white;
    }

    .map-legend {
      display: flex;

      flex-wrap: wrap;

      gap: 15px;

      margin-top: 15px;

      color:
        var(--muted);

      font-size: 12px;
    }

    .legend-item {
      display: flex;

      align-items: center;

      gap: 6px;
    }

    .legend-dot {
      width: 13px;
      height: 13px;

      border-radius: 4px;

      background:
        #f1f4f2;

      border:
        1px solid
        #ddd;
    }

    .legend-dot.hifz {
      background:
        #19764f;

      border-color:
        #19764f;
    }

    .legend-dot.review {
      background:
        #d5b24e;

      border-color:
        #d5b24e;
    }


    /* =========================
       POINTS
    ========================= */

    .points-breakdown {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;

      margin-bottom: 16px;
    }

    .points-card {
      padding: 14px;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          #f8fbf9,
          #fffdf6
        );

      border:
        1px solid
        var(--border);
    }

    .points-card small {
      display: block;

      color:
        var(--muted);

      margin-bottom: 5px;
    }

    .points-card strong {
      color:
        var(--green);

      font-size: 20px;
    }


    /* =========================
       ACTIONS
    ========================= */

    .actions {
      position: sticky;

      bottom: 15px;

      z-index: 20;

      margin-top: 22px;

      background:
        rgba(255,255,255,.90);

      backdrop-filter:
        blur(15px);

      border:
        1px solid
        rgba(226,233,229,.9);

      border-radius: 18px;

      padding: 13px;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.12);

      display: flex;

      justify-content:
        flex-start;

      gap: 10px;
    }

    .save {
      border: none;

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green-3)
        );

      color: white;

      padding:
        14px 24px;

      border-radius: 12px;

      cursor: pointer;

      font-weight: 900;

      font-size: 14px;

      box-shadow:
        0 8px 20px
        rgba(13,77,58,.18);

      transition: .2s;
    }

    .save:hover {
      transform:
        translateY(-2px);
    }

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function number(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


function formatNumber(
  value,
  digits = 1
) {

  const n =
    number(value);

  if (
    Number.isInteger(n)
  ) {
    return String(n);
  }

  return n
    .toFixed(digits)
    .replace(/\.0+$/, '');

}


function clamp(
  value,
  min,
  max
) {

  return Math.min(
    max,
    Math.max(
      min,
      number(value)
    )
  );

}


function todayISO() {

  const d =
    new Date();

  const year =
    d.getFullYear();

  const month =
    String(
      d.getMonth() + 1
    ).padStart(2, '0');

  const day =
    String(
      d.getDate()
    ).padStart(2, '0');

  return (
    `${year}-${month}-${day}`
  );

}


function formatDate(
  dateValue
) {

  if (!dateValue)
    return '—';

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {
    return escapeHtml(
      dateValue
    );
  }

  return d.toLocaleDateString(
    'ar-JO',
    {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }
  );

}


/* =========================================================
   الأسابيع
   الجمعة → الخميس
========================================================= */

function getWeekRangeForDate(
  dateValue
) {

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {
    return null;
  }

  const day =
    d.getDay();

  /*
    JavaScript:
    الأحد 0
    الاثنين 1
    ...
    الجمعة 5
    السبت 6
  */

  const daysSinceFriday =
    (day + 2) % 7;


  const start =
    new Date(d);

  start.setDate(
    d.getDate() -
    daysSinceFriday
  );

  start.setHours(
    0, 0, 0, 0
  );


  const end =
    new Date(start);

  end.setDate(
    start.getDate() + 6
  );

  end.setHours(
    23, 59, 59, 999
  );


  return {
    start,
    end
  };

}


function dateInCurrentWeek(
  dateValue
) {

  if (!dateValue)
    return false;

  const range =
    getWeekRangeForDate(
      todayISO()
    );

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  if (!range)
    return false;

  return (
    d >= range.start &&
    d <= range.end
  );

}

              a + b,
            0
          ) /
          scores.length
        )
      : 0;


  return {

    records:
      records.length,

    pages:
      records.length,

    average,

    highest:
      getHighestGrade()

  };

}


/* =========================================================
   حالة الخطة الأسبوعية
========================================================= */

function getPlanStatus(
  item
) {

  const targetHifz =
    number(
      item.hifzTarget ??
      item.hifz ??
      0
    );


  const targetReview =
    number(
      item.reviewTarget ??
      item.review ??
      0
    );


  if (
    !item.date
  ) {

    return {
      label:
        'قيد الإدخال',

      className:
        'status-pending'
    };

  }


  const range =
    getWeekRangeForDate(
      item.date
    );


  if (!range) {

    return {
      label:
        'قيد الإدخال',

      className:
        'status-pending'
    };

  }


  const hifz =
    profile.recitations.filter(
      rec =>
        rec.type === 'hifz' &&
        isDateInsideRange(
          rec.date,
          range
        )
    ).length;


  const review =
    profile.recitations.filter(
      rec =>
        rec.type === 'review' &&
        isDateInsideRange(
          rec.date,
          range
        )
    ).length;


  const hifzDone =
    targetHifz <= 0
      ? true
      : hifz >= targetHifz;


  const reviewDone =
    targetReview <= 0
      ? true
      : review >= targetReview;


  if (
    hifzDone &&
    reviewDone
  ) {

    return {

      label:
        'مكتملة ✅',

      className:
        'status-complete'

    };

  }


  if (
    hifz > 0 ||
    review > 0
  ) {

    return {

      label:
        'جزئية',

      className:
        'status-partial'

    };

  }


  return {

    label:
      'قيد التنفيذ',

    className:
      'status-running'

  };

}


function isDateInsideRange(
  dateValue,
  range
) {

  if (!dateValue)
    return false;


  const d =
    new Date(
      `${dateValue}T12:00:00`
    );


  return (
    d >= range.start &&
    d <= range.end
  );

}


/* =========================================================
   التحقق من المعلم
========================================================= */

async function checkTeacher() {

  try {

    const {
      data: {
        user
      },
      error
    } =
      await supabaseClient.auth.getUser();


    if (
      error ||
      !user
    ) {

      window.location.href =
        'teacher-login.html';

      return false;

    }


    if (
      String(
        user.email || ''
      ).toLowerCase() !==
      TEACHER_EMAIL.toLowerCase()
    ) {

      alert(
        'هذا القسم مخصص للمعلم فقط.'
      );


      await supabaseClient
        .auth
        .signOut();


      window.location.href =
        'teacher-login.html';

      return false;

    }


    return true;

  } catch (
    error
  ) {

    console.error(
      error
    );

    window.location.href =
      'teacher-login.html';

    return false;

  }

}


/* =========================================================
   تحميل الطالب
========================================================= */

async function loadStudent() {

  try {

    if (
      !(await checkTeacher())
    ) {
      return;
    }


    const params =
      new URLSearchParams(
        window.location.search
      );


    studentId =
      params.get('id');


    if (!studentId) {

      document.getElementById(
        'app'
      ).innerHTML = `

        <div class="loading">

          لم يتم تحديد الطالب.

        </div>

      `;

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient

        .from('students')

        .select('*')

        .eq(
          'id',
          studentId
        )

        .maybeSingle();


    if (error)
      throw error;


    if (!data) {

      document.getElementById(
        'app'
      ).innerHTML = `

        <div class="loading">

          تعذر العثور على الطالب.

        </div>

      `;

      return;

    }


    student =
      data;


    const {
      data: profileRow,
      error: profileError
    } =
      await supabaseClient

        .from('student_profiles')

        .select('data')

        .eq(
          'student_id',
          String(studentId)
        )

        .maybeSingle();


    if (profileError) {

      console.error(
        profileError
      );

      profile =
        defaultProfile();

    } else {

      profile =
        mergeProfile(
          profileRow?.data || {}
        );

    }


    render();

  } catch (
    error
  ) {

    console.error(
      'LOAD ERROR:',
      error
    );


    document.getElementById(
      'app'
    ).innerHTML = `

      <div class="loading">

        <h2
          style="
            color:#b42318;
            margin-bottom:10px;
          "
        >
          تعذر تحميل ملف الطالب
        </h2>

        <p>
          حدث خطأ أثناء تحميل البيانات.
        </p>

      </div>

    `;

  }

}

/* =========================================================
   رفع الصورة من الجهاز
========================================================= */

async function handlePhotoFile(
  input
) {

  const file =
    input.files?.[0];


  if (!file)
    return;


  if (
    !file.type.startsWith(
      'image/'
    )
  ) {

    alert(
      'الملف المحدد ليس صورة.'
    );

    input.value = '';

    return;

  }


  try {

    const compressed =
      await compressImage(
        file
      );


    profile.photoUrl =
      compressed;


    const preview =
      document.getElementById(
        'photoPreview'
      );


    const hero =
      document.getElementById(
        'heroPhoto'
      );


    if (preview)
      preview.src =
        compressed;


    if (hero)
      hero.src =
        compressed;


    showMessage(
      'تم إدراج صورة الطالب بنجاح. اضغط حفظ لتثبيتها ✅',
      'success'
    );

  } catch (
    error
  ) {

    console.error(
      error
    );

    alert(
      'تعذر تجهيز الصورة.'
    );

  }

}


function compressImage(
  file
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload = () => {

        const img =
          new Image();


        img.onload = () => {

          const maxSize =
            700;


          let width =
            img.width;

          let height =
            img.height;


          if (
            width > height &&
            width > maxSize
          ) {

            height =
              Math.round(
                height *
                maxSize /
                width
              );

            width =
              maxSize;

          }

          else if (
            height >= width &&
            height > maxSize
          ) {

            width =
              Math.round(
                width *
                maxSize /
                height
              );

            height =
              maxSize;

          }


          const canvas =
            document.createElement(
              'canvas'
            );


          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              '2d'
            );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          const result =
            canvas.toDataURL(
              'image/jpeg',
              0.82
            );


          resolve(
            result
          );

        };


        img.onerror =
          reject;


        img.src =
          reader.result;

      };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

function refreshPlanStatus(
  index
) {

  const item =
    profile.weeklyPlan[
      index

  if (!item)
    return;


  const date =
    document.querySelector(
      `[data-plan-date="${index}"]`
    )?.value || '';


  const hifz =
    number(
      document.querySelector(
        `[data-plan-hifz="${index}"]`
      )?.value
    );


  const review =
    number(
      document.querySelector(
        `[data-plan-review="${index}"]`
      )?.value
    );


  const temporary = {

    ...item,

    date,

    hifzTarget:
      hifz,

    reviewTarget:
      review

  };


  const status =
    getPlanStatus(
      temporary
    );


  const element =
    document.getElementById(
      `plan-status-${index}`
    );


  if (element) {

    element.className =
      `status-badge ${status.className}`;

    element.textContent =
      status.label;

  }

}

   التسميع
========================================================= */

function renderRecitations() {

  const box =
    document.getElementById(
      'recitationsEditor'
    );


  const items =
    profile.recitations ||
    [];


  if (!items.length) {

    box.innerHTML = `

      <div
        style="
          padding:18px;
          text-align:center;
          color:#718078;
          background:#f7faf8;
          border-radius:14px;
        "
      >
        لم يتم تسجيل أي تسميع بعد.
      </div>

    `;

    return;

  }


  box.innerHTML =
    items.map(
      (
        item,
        index
      ) => {

        const grade =
          getRecitationGrade(
            item.score
          );


        const points =
          getRecitationPoints(
            item
          );


        return `

          <div
            class="editor-row"
            id="recitation-row-${index}"
          >

            <div
              class="editor-row-head"
            >

              <span
                class="editor-row-title"
              >
                📖 صفحة
                ${
                  escapeHtml(
                    item.page || '—'
                  )
                }
              </span>


              <button
                class="remove"
                onclick="
                  removeRecitation(
                    ${index}
                  )
                "
              >
                حذف
              </button>

            </div>


            <div
              class="editor-grid"
            >

              <div
                class="field"
              >

                <label>
                  التاريخ
                </label>

                <input
                  type="date"
                  value="${escapeHtml(
                    item.date || ''
                  )}"
                  data-rec-date="${index}"
                >

              </div>


              <div
                class="field"
              >

                <label>
                  رقم الصفحة
                </label>

                <input
                  type="number"
                  min="1"
                  max="604"
                  value="${escapeHtml(
                    item.page || ''
                  )}"
                  placeholder="1 - 604"
                  data-rec-page="${index}"
                >

              </div>


              <div
                class="field"
              >

                <label>
                  النوع
                </label>

                <select
                  data-rec-type="${index}"
                  onchange="
                    refreshRecitationPreview(
                      ${index}
                    )
                  "
                >

                  <option
                    value="hifz"
                    ${
                      item.type === 'hifz'
                        ? 'selected'
                        : ''
                    }
                  >
                    حفظ جديد
                  </option>

                  <option
                    value="review"
                    ${
                      item.type === 'review'
                        ? 'selected'
                        : ''
                    }
                  >
                    مراجعة
                  </option>

                </select>

              </div>


              <div
                class="field"
              >

                <label>
                  الدرجة من 100
                </label>

                <input
                  type="number"
                  min="0"
                  max="100"
                  step="1"
                  value="${escapeHtml(
                    item.score ?? ''
                  )}"
                  placeholder="مثال: 97"
                  data-rec-score="${index}"
                  oninput="
                    refreshRecitationPreview(
                      ${index}
                    )
                  "
                >

              </div>


              <div
                class="field"
              >

                <label>
                  التقدير التلقائي
                </label>

                <div
                  id="grade-preview-${index}"
                  class="
                    grade-preview
                    ${grade.className}
                  "
                >
                  ${escapeHtml(
                    grade.label
                  )}
                </div>

              </div>


              <div
                class="field"
              >

                <label>
                  نقاط التسميع
                </label>

                <input
                  id="points-preview-${index}"
                  readonly
                  value="${formatNumber(
                    points,
                    1
                  )}"
                >

              </div>


              <div
                class="field"
                style="
                  grid-column:1 / -1;
                "
              >

                <label>
                  ملاحظة على الصفحة
                </label>

                <input
                  value="${escapeHtml(
                    item.note || ''
                  )}"
                  placeholder="مثال: أخطاء في بداية الصفحة"
                  data-rec-note="${index}"
                >

              </div>

            </div>

          </div>

        `;

      }
    )
    .join('');

}


function refreshRecitationPreview(
  index
) {

  const score =
    document.querySelector(
      `[data-rec-score="${index}"]`
    )?.value;


  const type =
    document.querySelector(
      `[data-rec-type="${index}"]`
    )?.value ||
    'hifz';


  const grade =
    getRecitationGrade(
      score
    );


  const points =
    getRecitationPoints({

      type,

      score

    });


  const gradeElement =
    document.getElementById(
      `grade-preview-${index}`
    );


  const pointsElement =
    document.getElementById(
      `points-preview-${index}`
    );


  if (gradeElement) {

    gradeElement.className =
      `grade-preview ${grade.className}`;

    gradeElement.textContent =
      grade.label;

  }


  if (pointsElement) {

    pointsElement.value =
      formatNumber(
        points,
        1
      );

  }

}


function addRecitation() {

  profile.recitations.unshift({

    date:
      todayISO(),

    page: '',

    type:
      'hifz',

    score:
      '',

    grade:
      '',

    note:
      ''

  });


  renderRecitations();


  const firstPage =
    document.querySelector(
      '[data-rec-page="0"]'
    );


  if (firstPage) {

    firstPage.focus();

  }

}


function removeRecitation(
  index
) {

  profile.recitations.splice(
    index,
    1
  );


  renderRecitations();

}


function collectRecitations() {

  return profile.recitations.map(
    (
      item,
      index
    ) => {

      const type =
        document.querySelector(
          `[data-rec-type="${index}"]`
        )?.value ||
        'hifz';


      const scoreRaw =
        document.querySelector(
          `[data-rec-score="${index}"]`
        )?.value;


      const score =
        scoreRaw === ''
          ? ''
          : clamp(
              scoreRaw,
              0,
              100
            );


      const grade =
        score === ''
          ? ''
          : getRecitationGrade(
              score
            ).label;


      return {

        date:
          document.querySelector(
            `[data-rec-date="${index}"]`
          )?.value || '',

        page:
          number(
            document.querySelector(
              `[data-rec-page="${index}"]`
            )?.value
          ),

        type,

        score,

        grade,

        note:
          document.querySelector(
            `[data-rec-note="${index}"]`
          )?.value || ''

      };

    }
  ).filter(
    item =>
      item.page >= 1 &&
      item.page <= 604
  );

}


/* =========================================================
   خريطة القرآن
========================================================= */

function getPageState(
  page
) {

  const hifz =
    getHifzPageSet();


  const review =
    getReviewPageSet();


  const hasHifz =
    hifz.has(page);


  const hasReview =
    review.has(page);


  if (
    hasHifz &&
    hasReview
  ) {
    return 'both';
  }


  if (hasHifz)
    return 'hifz';


  if (hasReview)
    return 'review';


  return '';

}


function renderQuranMap() {

  const box =
    document.getElementById(
      'quranMap'
    );


  if (!box)
    return;


  let html =
    '';


  for (
    let juz = 1;
    juz <= 30;
    juz++
  ) {

    const info =
      getJuzInfo(juz);


    let completed =
      0;


    let pagesHtml =
      '';


    for (
      let page =
        info.start;
      page <= info.end;
      page++
    ) {

      const state =
        getPageState(
          page
        );


      if (state)
        completed++;


      let stateText =
        'غير مسجلة';


      if (
        state === 'hifz'
      ) {

        stateText =
          'حفظ جديد';

      }

      else if (
        state === 'review'
      ) {

        stateText =
          'مراجعة';

      }

      else if (
        state === 'both'
      ) {

        stateText =
          'حفظ + مراجعة';

      }


      pagesHtml += `

        <div
          class="
            page-dot
            ${state}
          "
          title="
            صفحة ${page} —
            ${stateText}
          "
          onclick="
            showPageInfo(
              ${page}
            )
          "
        >
          ${page}
        </div>

      `;

    }


    html += `

      <div
        class="juz-card"
      >

        <div
          class="juz-head"
        >

          <span
            class="juz-title"
          >
            الجزء ${juz}
          </span>


          <span
            class="juz-count"
          >
            ${completed}/${info.length}
          </span>

        </div>


        <div
          class="juz-range"
        >
          الصفحات
          ${info.start}
          -
          ${info.end}
        </div>


        <div
          class="page-grid"
        >
          ${pagesHtml}
        </div>

      </div>

    `;

  }


  box.innerHTML =
    html;

}


function showPageInfo(
  page
) {

  const records =
    profile.recitations.filter(
      item =>
        number(item.page) === page
    );


  if (!records.length) {

    alert(
      `📖 صفحة ${page}\n\nلا يوجد سجل لهذه الصفحة حتى الآن.`
    );

    return;

  }


  const details =
    records.map(
      item => {

        const grade =
          getRecitationGrade(
            item.score
          );


        const points =
          getRecitationPoints(
            item
          );


        const type =
          item.type === 'review'
            ? 'مراجعة'
            : 'حفظ جديد';


        return [

          `النوع: ${type}`,

          `التاريخ: ${formatDate(
            item.date
          )}`,

          `الدرجة: ${
            item.score === ''
              ? 'غير مسجلة'
              : item.score + '%'
          }`,

          `التقدير: ${
            grade.label
          }`,

          `النقاط: ${
            formatNumber(
              points,
              1
            )
          }`,

          `الملاحظة: ${
            item.note ||
            'لا توجد'
          }`

        ].join('\n');

      }
    )
    .join(
      '\n\n----------------\n\n'
    );


  alert(
    `📖 تفاصيل الصفحة ${page}\n\n${details}`
  );

}


/* =========================================================
   حفظ جميع البيانات
========================================================= */

async function saveProfile() {

  hideMessage();


  const button =
    document.getElementById(
      'saveButton'
    );


  button.disabled =
    true;


  button.textContent =
    'جاري الحفظ...';


  try {

    const studentUpdate = {

      name:
        document
          .getElementById(
            'name'
          )
          .value
          .trim(),

      section:
        document
          .getElementById(
            'section'
          )
          .value
          .trim(),

      memorization:
        document
          .getElementById(
            'memorization'
          )
          .value
          .trim(),

      status:
        document
          .getElementById(
            'status'
          )
          .value

    };


    if (
      !studentUpdate.name
    ) {

      throw new Error(
        'اسم الطالب مطلوب.'
      );

    }


    /*
      أولاً تحديث جدول الطلاب
    */

    const {
      error:
        studentError
    } =
      await supabaseClient

        .from('students')

        .update(
          studentUpdate
        )

        .eq(
          'id',
          studentId
        );


    if (studentError)
      throw studentError;


    /*
      جمع البيانات
    */

    const newProfile = {

      photoUrl:
        profile.photoUrl ||
        '',

      guardianPhone:
        document
          .getElementById(
            'guardianPhone'
          )
          .value
          .trim(),

      joiningDate:
        document
          .getElementById(
            'joiningDate'
          )
          .value,

      residence:
        document
          .getElementById(
            'residence'
          )
          .value
          .trim(),

      bus:
        document
          .getElementById(
            'bus'
          )
          .value
          .trim(),

      homeLocation:
        document
          .getElementById(
            'homeLocation'
          )
          .value
          .trim(),


      weeklyGoal: {

        hifz:
          number(
            document
              .getElementById(
                'goalHifz'
              )
              .value
          ),

        review:
          number(
            document
              .getElementById(
                'goalReview'
              )
              .value
          )

      },


      attendance:
        collectAttendance(),


      weeklyPlan:
        collectPlan(),


      tests:
        collectTests(),


      recitations:
        collectRecitations(),


      notes:
        document
          .getElementById(
            'notes'
          )
          .value
          .trim()

    };


    /*
      حفظ profile داخل
      student_profiles
    */

    const {
      error:
        profileError
    } =
      await supabaseClient

        .from(
          'student_profiles'
        )

        .upsert({

          student_id:
            String(
              studentId
            ),

          data:
            newProfile,

          updated_at:
            new Date()
              .toISOString()

        });


    if (profileError)
      throw profileError;


    /*
      تحديث البيانات الحالية
    */

    profile =
      mergeProfile(
        newProfile
      );


    student = {

      ...student,

      ...studentUpdate

    };


    showMessage(
      'تم حفظ جميع البيانات وإعادة احتساب النسب والنقاط وحالة الخطة تلقائياً ✅',
      'success'
    );


    render();


  } catch (
    error
  ) {

    console.error(
      'SAVE ERROR:',
      error
    );


    showMessage(
      error.message ||
      'حدث خطأ أثناء حفظ البيانات.',
      'error'
    );


  } finally {

    button =
      document.getElementById(
        'saveButton'
      );


    if (button) {

      button.disabled =
        false;

      button.textContent =
        '💾 حفظ جميع التعديلات';

    }

  }

}
