    .field {

    .field.full-field {

    label {

      color: #345248;
      font-size: 14px;

      font-family: inherit;
      font-size: 14px;
      outline: none;
      background: white;

    input:focus,
    textarea:focus,
    select:focus {

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .array-editor {

      flex-direction: column;
      gap: 10px;
    }

    .array-row {
      background: #f8faf8;
      border: 1px solid #e4e9e5;
      border-radius: 12px;
      padding: 12px;
    }

    .array-row-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .remove {
      margin-top: 8px;
      border: none;
      background: #fff0f0;
      color: var(--danger);
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;

    .add {

      background: #f8fbf8;
      color: var(--green);
      padding: 11px;
      border-radius: 10px;

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

async function checkTeacher() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {

    window.location.href =
      'teacher-login.html';

    return false;

  }

  if (
    String(user.email || '').toLowerCase() !==
    TEACHER_EMAIL.toLowerCase()
  ) {

    alert('هذا القسم مخصص للمعلم فقط.');

    await supabaseClient.auth.signOut();

    window.location.href =
      'teacher-login.html';

    return false;

  }

  return true;

}


async function loadStudent() {

  if (!(await checkTeacher())) return;

  const params =
    new URLSearchParams(
      window.location.search
    );

  studentId =
    params.get('id');

  if (!studentId) {

    document.getElementById('app').innerHTML = `
      <div class="card">
        لم يتم تحديد الطالب.
      </div>
    `;

    return;

  }


  const {
    data,
    error
  } = await supabaseClient
    .from('students')
    .select('*')
    .eq('id', studentId)
    .single();


  if (error || !data) {

    console.error(error);

    document.getElementById('app').innerHTML = `
      <div class="card">
        تعذر العثور على الطالب.
      </div>
    `;

    return;

  }


  student = data;


  const {
    data: profileRow
  } = await supabaseClient
    .from('student_profiles')
    .select('data')
    .eq(
      'student_id',
      String(studentId)
    )
    .maybeSingle();


  profile =
    mergeProfile(
      profileRow?.data || {}
    );


  render();

}
