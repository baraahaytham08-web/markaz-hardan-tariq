                onclick="removeRecitation(${index})"
              >
                حذف
              </button>

            </div>


            <div class="editor-grid">


              <div class="field">

                <label>
                  التاريخ
                </label>

                <input
                  type="date"
                  value="${escapeHtml(
                    item.date || ''
                  )}"
                  data-rec-date="${index}"
                >

              </div>


              <div class="field">

                <label>
                  رقم الصفحة
                </label>

                <input
                  type="number"
                  min="1"
                  max="604"
                  value="${escapeHtml(
                    item.page || ''
                  )}"
                  placeholder="1 - 604"
                  data-rec-page="${index}"
                >

              </div>


              <div class="field">

                <label>
                  النوع
                </label>

                <select
                  data-rec-type="${index}"
                  onchange="
                    refreshRecitationPreview(
                      ${index}
                    )
                  "
                >

                  <option
                    value="hifz"
                    ${
                      item.type === 'hifz'
                        ? 'selected'
                        : ''
                    }
                  >
                    حفظ جديد
                  </option>

                  <option
                    value="review"
                    ${
                      item.type === 'review'
                        ? 'selected'
                        : ''
                    }
                  >
                    مراجعة
                  </option>

                </select>

              </div>


              <div class="field">

                <label>
                  الدرجة من 100
                </label>

                <input
                  type="number"
                  min="0"
                  max="100"
                  step="1"
                  value="${escapeHtml(
                    item.score ?? ''
                  )}"
                  placeholder="مثال: 97"
                  data-rec-score="${index}"
                  oninput="
                    refreshRecitationPreview(
                      ${index}
                    )
                  "
                >

              </div>


              <div class="field">

                <label>
                  التقدير التلقائي
                </label>

                <div
                  id="grade-preview-${index}"
                  class="
                    grade-preview
                    ${grade.className}
                  "
                >
                  ${escapeHtml(
                    grade.label
                  )}
                </div>

              </div>


              <div class="field">

                <label>
                  نقاط التسميع
                </label>

                <input
                  id="points-preview-${index}"
                  readonly
                  value="${formatNumber(
                    points,
                    1
                  )}"
                >

              </div>


              <div
                class="field"
                style="
                  grid-column:1 / -1;
                "
              >

                <label>
                  ملاحظة على الصفحة
                </label>

                <input
                  value="${escapeHtml(
                    item.note || ''
                  )}"
                  placeholder="مثال: أخطاء في بداية الصفحة"
                  data-rec-note="${index}"
                >

              </div>

            </div>

          </div>

        `;

      }
    )
    .join('');

}


function refreshRecitationPreview(
  index
) {

  const score =
    document.querySelector(
      `[data-rec-score="${index}"]`
    )?.value;

  const type =
    document.querySelector(
      `[data-rec-type="${index}"]`
    )?.value ||
    'hifz';

  const grade =
    getRecitationGrade(
      score
    );

  const points =
    getRecitationPoints({

      type,

      score

    });

  const gradeElement =
    document.getElementById(
      `grade-preview-${index}`
    );

  const pointsElement =
    document.getElementById(
      `points-preview-${index}`
    );

  if (gradeElement) {

    gradeElement.className =
      `grade-preview ${grade.className}`;

    gradeElement.textContent =
      grade.label;

  }

  if (pointsElement) {

    pointsElement.value =
      formatNumber(
        points,
        1
      );

  }

}


function addRecitation() {

  profile.recitations.unshift({

    date:
      todayISO(),

    page: '',

    type:
      'hifz',

    score:
      '',

    grade:
      '',

    note:
      ''

  });

  renderRecitations();

  const firstPage =
    document.querySelector(
      '[data-rec-page="0"]'
    );

  if (firstPage) {

    firstPage.focus();

  }

  showToast(
    'تمت إضافة جلسة تسميع جديدة',
    '📖'
  );

}


function removeRecitation(
  index
) {

  profile.recitations.splice(
    index,
    1
  );

  renderRecitations();

}


function collectRecitations() {

  return profile.recitations.map(
    (
      item,
      index
    ) => {

      const type =
        document.querySelector(
          `[data-rec-type="${index}"]`
        )?.value ||
        'hifz';

      const scoreRaw =
        document.querySelector(
          `[data-rec-score="${index}"]`
        )?.value;

      const score =
        scoreRaw === ''
          ? ''
          : clamp(
              scoreRaw,
              0,
              100
            );

      const grade =
        score === ''
          ? ''
          : getRecitationGrade(
              score
            ).label;

      return {

        date:
          document.querySelector(
            `[data-rec-date="${index}"]`
          )?.value || '',

        page:
          number(
            document.querySelector(
              `[data-rec-page="${index}"]`
            )?.value
          ),

        type,

        score,

        grade,

        note:
          document.querySelector(
            `[data-rec-note="${index}"]`
          )?.value || ''

      };

    }
  ).filter(
    item =>
      item.page >= 1 &&
      item.page <= 604
  );

}


/* =========================================================
   خريطة القرآن
========================================================= */

function getPageState(
  page
) {

  const hifz =
    getHifzPageSet();

  const review =
    getReviewPageSet();

  const hasHifz =
    hifz.has(page);

  const hasReview =
    review.has(page);

  if (
    hasHifz &&
    hasReview
  ) {

    return 'both';

  }

  if (hasHifz)
    return 'hifz';

  if (hasReview)
    return 'review';

  return '';

}


function renderQuranMap() {

  const box =
    document.getElementById(
      'quranMap'
    );

  if (!box)
    return;

  let html =
    '';

  for (
    let juz = 1;
    juz <= 30;
    juz++
  ) {

    const info =
      getJuzInfo(
        juz
      );

    let completed =
      0;

    let pagesHtml =
      '';

    for (
      let page =
        info.start;
      page <= info.end;
      page++
    ) {

      const state =
        getPageState(
          page
        );

      if (state)
        completed++;

      let stateText =
        'غير مسجلة';

      if (
        state === 'hifz'
      ) {

        stateText =
          'حفظ جديد';

      } else if (
        state === 'review'
      ) {

        stateText =
          'مراجعة';

      } else if (
        state === 'both'
      ) {

        stateText =
          'حفظ + مراجعة';

      }

      pagesHtml += `

        <div
          class="
            page-dot
            ${state}
          "
          title="
            صفحة ${page}
            — ${stateText}
          "
          onclick="showPageInfo(${page})"
        >
          ${page}
        </div>

      `;

    }

    html += `

      <div class="juz-card">

        <div class="juz-head">

          <span class="juz-title">
            الجزء ${juz}
          </span>


          <span class="juz-count">
            ${completed}/${info.length}
          </span>

        </div>


        <div class="juz-range">
          الصفحات
          ${info.start}
          -
          ${info.end}
        </div>


        <div class="page-grid">
          ${pagesHtml}
        </div>

      </div>

    `;

  }

  box.innerHTML =
    html;

}


/* =========================================================
   Modal الصفحة
========================================================= */

function showPageInfo(
  page
) {

  const records =
    profile.recitations.filter(
      item =>
        number(item.page) === page
    );

  const overlay =
    document.getElementById(
      'pageModalOverlay'
    );

  const title =
    document.getElementById(
      'pageModalTitle'
    );

  const body =
    document.getElementById(
      'pageModalBody'
    );

  if (
    !overlay ||
    !title ||
    !body
  ) {

    return;

  }

  title.textContent =
    `📖 تفاصيل الصفحة ${page}`;

  if (!records.length) {

    body.innerHTML = `

      <div class="empty-state">

        لا يوجد سجل لهذه الصفحة حتى الآن.

      </div>

    `;

  } else {

    body.innerHTML =
      records.map(
        item => {

          const grade =
            getRecitationGrade(
              item.score
            );

          const points =
            getRecitationPoints(
              item
            );

          const type =
            item.type === 'review'
              ? 'مراجعة'
              : 'حفظ جديد';

          return `

            <div class="page-record">

              <div class="page-record-grid">


                <div class="detail-item">

                  <small>
                    النوع
                  </small>

                  <strong>
                    ${type}
                  </strong>

                </div>


                <div class="detail-item">

                  <small>
                    التاريخ
                  </small>

                  <strong>
                    ${formatDate(
                      item.date
                    )}
                  </strong>

                </div>


                <div class="detail-item">

                  <small>
                    الدرجة
                  </small>

                  <strong>
                    ${
                      item.score === ''
                        ? 'غير مسجلة'
                        : `${item.score}%`
                    }
                  </strong>

                </div>


                <div class="detail-item">

                  <small>
                    التقدير
                  </small>

                  <strong>
                    ${escapeHtml(
                      grade.label
                    )}
                  </strong>

                </div>


                <div class="detail-item">

                  <small>
                    النقاط
                  </small>

                  <strong>
                    ${formatNumber(
                      points,
                      1
                    )}
                  </strong>

                </div>

              </div>


              <div class="detail-note">

                <b>
                  الملاحظة:
                </b>

                ${escapeHtml(
                  item.note ||
                  'لا توجد ملاحظة.'
                )}

              </div>

            </div>

          `;

        }
      )
      .join('');

  }

  overlay.classList.add(
    'show'
  );

  document.body.style.overflow =
    'hidden';

}


function closePageModal() {

  const overlay =
    document.getElementById(
      'pageModalOverlay'
    );

  if (!overlay)
    return;

  overlay.classList.remove(
    'show'
  );

  document.body.style.overflow =
    '';

}


function handleModalOverlay(
  event
) {

  if (
    event.target?.id ===
    'pageModalOverlay'
  ) {

    closePageModal();

  }

}


document.addEventListener(
  'keydown',
  event => {

    if (
      event.key === 'Escape'
    ) {

      closePageModal();

    }

  }
);


/* =========================================================
   حفظ جميع البيانات
========================================================= */

async function saveProfile() {

  hideMessage();

  const button =
    document.getElementById(
      'saveButton'
    );

  if (!button)
    return;

  button.disabled =
    true;

  button.textContent =
    '⏳ جاري حفظ البيانات...';

  try {

    const studentUpdate = {

      name:
        document
          .getElementById(
            'name'
          )
          .value
          .trim(),

      section:
        document
          .getElementById(
            'section'
          )
          .value
          .trim(),

      memorization:
        document
          .getElementById(
            'memorization'
          )
          .value
          .trim(),

      status:
        document
          .getElementById(
            'status'
          )
          .value

    };


    if (
      !studentUpdate.name
    ) {

      throw new Error(
        'اسم الطالب مطلوب.'
      );

    }


    const {
      error:
        studentError
    } =
      await supabaseClient
        .from('students')
        .update(
          studentUpdate
        )
        .eq(
          'id',
          studentId
        );

    if (studentError)
      throw studentError;


    const newProfile = {

      photoUrl:
        profile.photoUrl ||
        '',

      guardianPhone:
        document
          .getElementById(
            'guardianPhone'
          )
          .value
          .trim(),

      joiningDate:
        document
          .getElementById(
            'joiningDate'
          )
          .value,

      residence:
        document
          .getElementById(
            'residence'
          )
          .value
          .trim(),

      bus:
        document
          .getElementById(
            'bus'
          )
          .value
          .trim(),

      homeLocation:
        document
          .getElementById(
            'homeLocation'
          )
          .value
          .trim(),

      weeklyGoal: {

        hifz:
          number(
            document
              .getElementById(
                'goalHifz'
              )
              .value
          ),

        review:
          number(
            document
              .getElementById(
                'goalReview'
              )
              .value
          )

      },

      attendance:
        collectAttendance(),

      weeklyPlan:
        collectPlan(),

      tests:
        collectTests(),

      recitations:
        collectRecitations(),

      notes:
        document
          .getElementById(
            'notes'
          )
          .value
          .trim()

    };


    const {
      error:
        profileError
    } =
      await supabaseClient
        .from(
          'student_profiles'
        )
        .upsert({

          student_id:
            String(
              studentId
            ),

          data:
            newProfile,

          updated_at:
            new Date()
              .toISOString()

        });

    if (profileError)
      throw profileError;


    profile =
      mergeProfile(
        newProfile
      );

    student = {

      ...student,

      ...studentUpdate

    };


    sessionStorage.setItem(
      'studentSession',
      JSON.stringify({

        id:
          student.id,

        name:
          student.name,

        section:
          student.section,

        memorization:
          student.memorization,

        status:
          student.status

      })
    );


    showMessage(
      'تم حفظ جميع البيانات وإعادة احتساب النسب والنقاط وحالة الخطة تلقائياً ✅',
      'success'
    );


    showToast(
      'تم حفظ جميع التعديلات بنجاح',
      '✓'
    );


    render();


    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });


  } catch (
    error
  ) {

    console.error(
      'SAVE ERROR:',
      error
    );

    showMessage(
      error.message ||
      'حدث خطأ أثناء حفظ البيانات.',
      'error'
    );

  } finally {

    const currentButton =
      document.getElementById(
        'saveButton'
      );

    if (currentButton) {

      currentButton.disabled =
        false;

      currentButton.textContent =
        '💾 حفظ جميع التعديلات';

    }

  }

}

loadStudent();
