<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#092f25"
  >

  <title>
    ملف الطالب | مركز حردان طارق القرآني
  </title>

  <link
    rel="icon"
    type="image/png"
    href="logo.png"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="logo.png"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    /* =========================================================
       ROOT
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {

      --green-950: #06251d;
      --green-900: #092f25;
      --green-800: #0d4d3a;
      --green-700: #176b50;
      --green-600: #218866;
      --green-500: #2da77b;

      --gold-700: #98792d;
      --gold-600: #b58f36;
      --gold: #c5a04a;
      --gold-400: #d8b65e;
      --gold-300: #e0c36c;
      --gold-200: #f0df9d;

      --cream: #fbf7ea;
      --cream-2: #fffaf0;

      --bg: #f1f5f3;
      --bg-2: #eaf1ed;

      --white: #ffffff;

      --text: #17362c;
      --text-2: #355148;
      --muted: #718078;
      --muted-2: #87938e;

      --border: #dfe8e3;
      --border-2: #edf2ef;

      --success: #16834b;
      --success-bg: #e9f8ef;

      --danger: #b42318;
      --danger-bg: #fff0ef;

      --blue: #2869a8;
      --blue-bg: #eaf2fb;

      --orange: #a96116;
      --orange-bg: #fff3df;

      --shadow-xs:
        0 4px 14px rgba(10, 55, 42, .04);

      --shadow-sm:
        0 8px 24px rgba(10, 55, 42, .06);

      --shadow:
        0 16px 42px rgba(10, 55, 42, .09);

      --shadow-lg:
        0 25px 70px rgba(10, 55, 42, .14);

      --radius-sm: 12px;
      --radius: 18px;
      --radius-lg: 26px;
      --radius-xl: 32px;

      --transition:
        .25s cubic-bezier(.22, .61, .36, 1);

    }


    /* =========================================================
       BASE
    ========================================================= */

    html {
      scroll-behavior: smooth;
    }

    body {

      min-height: 100vh;

      color: var(--text);

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 7% 2%,
          rgba(197,160,74,.13),
          transparent 22%
        ),

        radial-gradient(
          circle at 95% 7%,
          rgba(33,136,102,.09),
          transparent 24%
        ),

        radial-gradient(
          circle at 50% 100%,
          rgba(13,77,58,.05),
          transparent 30%
        ),

        linear-gradient(
          180deg,
          #f6f9f7 0%,
          #eef4f1 48%,
          #edf3f0 100%
        );

      overflow-x: hidden;
    }

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: -1;

      opacity: .42;

      background-image:
        radial-gradient(
          rgba(13,77,58,.06) 1px,
          transparent 1px
        );

      background-size: 28px 28px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 80%
        );
    }

    body::after {

      content: "";

      position: fixed;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      left: -180px;
      bottom: -150px;

      border:
        1px solid
        rgba(197,160,74,.11);

      box-shadow:
        0 0 0 55px rgba(197,160,74,.025),
        0 0 0 110px rgba(197,160,74,.018);

      pointer-events: none;

      z-index: -1;

      animation:
        floatOrb 8s ease-in-out infinite;
    }

    body.ready #app {

      animation:
        pageEnter .55s ease both;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button,
    a,
    input,
    select,
    textarea {
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: rgba(197,160,74,.24);
      color: var(--green-900);
    }

    a {
      color: inherit;
    }


    /* =========================================================
       SCROLLBAR
    ========================================================= */

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #e8eeeb;
    }

    ::-webkit-scrollbar-thumb {

      background:
        linear-gradient(
          var(--green-700),
          var(--green-500)
        );

      border-radius: 999px;

      border: 2px solid #e8eeeb;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    header {

      position: sticky;

      top: 0;

      z-index: 1000;

      color: white;

      background:
        linear-gradient(
          135deg,
          rgba(6,37,29,.98),
          rgba(9,47,37,.97) 52%,
          rgba(13,77,58,.95)
        );

      border-bottom:
        1px solid
        rgba(255,255,255,.07);

      box-shadow:
        0 10px 35px rgba(0,0,0,.14);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);
    }

    header::after {

      content: "";

      position: absolute;

      inset-inline: 0;

      bottom: 0;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(224,195,108,.65),
          transparent
        );

      opacity: .55;
    }

    .header-inner {

      width:
        min(
          1320px,
          calc(100% - 28px)
        );

      min-height: 78px;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 18px;
    }

    .brand-link {

      color: white;

      text-decoration: none;

      display: flex;

      align-items: center;

      gap: 13px;

      min-width: 0;
    }

    .brand-logo-wrap {

      position: relative;

      width: 50px;
      height: 50px;

      flex-shrink: 0;
    }

    .brand-logo-glow {

      position: absolute;

      inset: -5px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(224,195,108,.24),
          transparent 68%
        );

      animation:
        breathe 3s ease-in-out infinite;
    }

    .brand-logo {

      position: relative;

      width: 50px;
      height: 50px;

      border-radius: 50%;

      display: block;

      object-fit: cover;

      border:
        2px solid
        rgba(224,195,108,.88);

      box-shadow:
        0 7px 20px rgba(0,0,0,.24);
    }

    .brand {

      min-width: 0;
    }

    .brand h1 {

      font-size: 18px;

      line-height: 1.35;

      margin-bottom: 3px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .brand p {

      color:
        rgba(255,255,255,.65);

      font-size: 11px;

      white-space: nowrap;
    }

    .header-actions {

      display: flex;

      align-items: center;

      gap: 9px;
    }

    .header-chip {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      min-height: 38px;

      padding: 0 12px;

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: 999px;

      background:
        rgba(255,255,255,.06);

      color:
        rgba(255,255,255,.83);

      font-size: 11px;

      white-space: nowrap;
    }

    .header-dot {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        #69d69d;

      box-shadow:
        0 0 0 5px rgba(105,214,157,.10);

      animation:
        statusPulse 2s infinite;
    }

    .back {

      min-height: 42px;

      padding:
        0 14px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      color: white;

      text-decoration: none;

      border:
        1px solid
        rgba(255,255,255,.15);

      background:
        rgba(255,255,255,.06);

      border-radius: 12px;

      transition:
        transform var(--transition),
        background var(--transition),
        border-color var(--transition);
    }

    .back:hover {

      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,.12);

      border-color:
        rgba(224,195,108,.35);
    }


    /* =========================================================
       PAGE
    ========================================================= */

    .container {

      width:
        min(
          1320px,
          calc(100% - 28px)
        );

      margin:
        24px auto 95px;
    }

    #app {
      min-height: 300px;
    }


    /* =========================================================
       MESSAGE
    ========================================================= */

    .message {

      display: none;

      position: relative;

      padding:
        14px 18px;

      margin-bottom: 16px;

      border-radius: 16px;

      font-size: 13px;

      font-weight: bold;

      box-shadow:
        var(--shadow-sm);

      animation:
        messageIn .35s ease both;
    }

    .message::before {

      content: "";

      position: absolute;

      right: 0;

      top: 12px;
      bottom: 12px;

      width: 4px;

      border-radius: 10px;

      background: currentColor;

      opacity: .7;
    }

    .success {

      background:
        linear-gradient(
          135deg,
          #eefaf2,
          #e5f7ec
        );

      color: #13743f;

      border:
        1px solid
        #ccebd7;
    }

    .error {

      background:
        linear-gradient(
          135deg,
          #fff4f2,
          #ffeded
        );

      color: #a31d16;

      border:
        1px solid
        #f0cfcb;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .student-hero {

      position: relative;

      overflow: hidden;

      border-radius: var(--radius-xl);

      margin-bottom: 16px;

      color: white;

      background:

        radial-gradient(
          circle at 15% 15%,
          rgba(224,195,108,.20),
          transparent 23%
        ),

        radial-gradient(
          circle at 86% 85%,
          rgba(45,167,123,.16),
          transparent 22%
        ),

        linear-gradient(
          135deg,
          #07271f 0%,
          #0a382c 42%,
          #14654b 100%
        );

      border:
        1px solid
        rgba(255,255,255,.07);

      box-shadow:
        0 24px 65px
        rgba(13,77,58,.20);

      isolation: isolate;
    }

    .student-hero::before {

      content: "";

      position: absolute;

      width: 360px;
      height: 360px;

      border:
        1px solid
        rgba(255,255,255,.07);

      border-radius: 50%;

      left: -175px;
      top: -220px;

      box-shadow:
        0 0 0 36px rgba(255,255,255,.018),
        0 0 0 72px rgba(255,255,255,.012);

      animation:
        rotateSlow 22s linear infinite;
    }

    .student-hero::after {

      content: "";

      position: absolute;

      width: 430px;
      height: 430px;

      border:
        1px solid
        rgba(224,195,108,.10);

      border-radius: 50%;

      right: -220px;
      bottom: -275px;

      box-shadow:
        0 0 0 48px rgba(224,195,108,.018),
        0 0 0 96px rgba(224,195,108,.010);

      animation:
        rotateSlow 30s linear infinite reverse;
    }

    .hero-grid-lines {

      position: absolute;

      inset: 0;

      opacity: .055;

      background:
        linear-gradient(
          90deg,
          transparent 49%,
          rgba(255,255,255,.12) 50%,
          transparent 51%
        ),
        linear-gradient(
          0deg,
          transparent 49%,
          rgba(255,255,255,.12) 50%,
          transparent 51%
        );

      background-size:
        36px 36px;

      mask-image:
        radial-gradient(
          circle at center,
          black,
          transparent 73%
        );

      pointer-events: none;
    }

    .hero-content {

      position: relative;

      z-index: 3;

      min-height: 265px;

      padding: 29px;

      display: grid;

      grid-template-columns:
        auto
        minmax(0, 1fr)
        minmax(300px, 390px);

      align-items: center;

      gap: 24px;
    }

    .hero-photo-wrap {

      position: relative;

      width: 126px;
      height: 126px;

      display: grid;

      place-items: center;

      flex-shrink: 0;
    }

    .hero-photo-ring {

      position: absolute;

      inset: 0;

      border-radius: 50%;

      border:
        2px solid
        rgba(224,195,108,.94);

      box-shadow:
        0 0 0 7px rgba(224,195,108,.08),
        0 0 0 15px rgba(255,255,255,.025);

      animation:
        ringGlow 3.5s ease-in-out infinite;
    }

    .hero-photo-ring::after {

      content: "";

      position: absolute;

      width: 13px;
      height: 13px;

      border-radius: 50%;

      top: 7px;
      right: 12px;

      background:
        var(--gold-300);

      box-shadow:
        0 0 0 5px rgba(224,195,108,.13),
        0 0 20px rgba(224,195,108,.38);
    }

    .hero-photo {

      width: 108px;
      height: 108px;

      border-radius: 50%;

      object-fit: cover;

      display: block;

      position: relative;

      z-index: 2;

      border:
        4px solid
        rgba(255,255,255,.96);

      background:
        rgba(255,255,255,.10);

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.28);
    }

    .hero-info {

      min-width: 0;
    }

    .hero-kicker {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding:
        6px 10px;

      border-radius: 999px;

      margin-bottom: 10px;

      font-size: 11px;

      color:
        rgba(255,255,255,.84);

      background:
        rgba(255,255,255,.07);

      border:
        1px solid
        rgba(255,255,255,.11);
    }

    .hero-kicker-dot {

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background:
        var(--gold-300);

      box-shadow:
        0 0 10px rgba(224,195,108,.55);
    }

    .hero-info h2 {

      font-size:
        clamp(
          26px,
          4vw,
          40px
        );

      line-height: 1.2;

      letter-spacing: -.4px;

      margin-bottom: 7px;

      text-wrap: balance;
    }

    .hero-subline {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      color:
        rgba(255,255,255,.70);

      font-size: 13px;

      margin-bottom: 15px;
    }

    .hero-sub-item {

      display: inline-flex;

      align-items: center;

      gap: 5px;
    }

    .hero-separator {
      opacity: .36;
    }

    .hero-pills {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }

    .hero-pill {

      display: inline-flex;

      align-items: center;

      gap: 6px;

      min-height: 33px;

      padding:
        0 11px;

      border-radius: 999px;

      font-size: 11px;

      color:
        rgba(255,255,255,.87);

      background:
        rgba(255,255,255,.075);

      border:
        1px solid
        rgba(255,255,255,.10);

      backdrop-filter:
        blur(7px);

      transition:
        transform var(--transition),
        background var(--transition);
    }

    .hero-pill:hover {

      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,.12);
    }

    .hero-side {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;
    }

    .hero-stat {

      position: relative;

      overflow: hidden;

      min-height: 96px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      padding:
        12px;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.10),
          rgba(255,255,255,.045)
        );

      border:
        1px solid
        rgba(255,255,255,.10);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035);

      backdrop-filter:
        blur(10px);

      transition:
        transform var(--transition),
        background var(--transition);
    }

    .hero-stat:hover {

      transform:
        translateY(-4px);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.14),
          rgba(255,255,255,.06)
        );
    }

    .hero-stat::before {

      content: "";

      position: absolute;

      width: 75px;
      height: 75px;

      border-radius: 50%;

      right: -28px;
      bottom: -38px;

      background:
        rgba(224,195,108,.07);
    }

    .hero-stat small {

      color:
        rgba(255,255,255,.58);

      font-size: 10px;

      margin-bottom: 5px;
    }

    .hero-stat strong {

      position: relative;

      color:
        var(--gold-300);

      font-size: 25px;

      line-height: 1;

      font-weight: 900;
    }

    .hero-stat-wide {

      grid-column:
        1 / -1;

      min-height: 73px;

      flex-direction: row;

      gap: 12px;

      justify-content: space-between;

      padding:
        12px 15px;
    }

    .hero-wide-label {

      display: flex;

      align-items: center;

      gap: 9px;

      color:
        rgba(255,255,255,.77);

      font-size: 11px;
    }

    .hero-wide-label-icon {

      width: 35px;
      height: 35px;

      border-radius: 11px;

      display: grid;

      place-items: center;

      background:
        rgba(224,195,108,.10);

      border:
        1px solid
        rgba(224,195,108,.12);

      font-size: 16px;
    }


    /* =========================================================
       QUICK NAV
    ========================================================= */

    .quick-nav {

      display: flex;

      align-items: center;

      gap: 8px;

      overflow-x: auto;

      padding:
        4px 2px 9px;

      margin-bottom: 7px;

      scrollbar-width: none;
    }

    .quick-nav::-webkit-scrollbar {
      display: none;
    }

    .quick-link {

      flex-shrink: 0;

      text-decoration: none;

      min-height: 40px;

      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding:
        0 13px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.78);

      border:
        1px solid
        var(--border);

      color:
        var(--text-2);

      font-size: 11px;

      box-shadow:
        var(--shadow-xs);

      transition:
        var(--transition);

      backdrop-filter:
        blur(10px);
    }

    .quick-link:hover {

      transform:
        translateY(-2px);

      color:
        var(--green);

      border-color:
        rgba(23,107,80,.22);

      background:
        white;

      box-shadow:
        var(--shadow-sm);
    }


    /* =========================================================
       SECTION
    ========================================================= */

    .section {

      position: relative;

      overflow: hidden;

      scroll-margin-top: 95px;

      margin-top: 16px;

      padding: 23px;

      border-radius:
        var(--radius-lg);

      border:
        1px solid
        rgba(219,229,223,.92);

      background:
        rgba(255,255,255,.88);

      box-shadow:
        var(--shadow-sm);

      backdrop-filter:
        blur(14px);

      animation:
        sectionEnter .55s ease both;
    }

    .section::after {

      content: "";

      position: absolute;

      width: 130px;
      height: 130px;

      border-radius: 50%;

      left: -70px;
      bottom: -75px;

      background:
        radial-gradient(
          circle,
          rgba(197,160,74,.075),
          transparent 68%
        );

      pointer-events: none;
    }

    .section-head {

      position: relative;

      z-index: 1;

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;
    }

    .section-title-wrap {
      min-width: 0;
    }

    .section-title {

      display: flex;

      align-items: center;

      gap: 10px;

      color:
        var(--green-800);

      font-size: 20px;

      line-height: 1.3;
    }

    .section-title::before {

      content: "";

      width: 5px;
      height: 25px;

      flex-shrink: 0;

      border-radius: 99px;

      background:
        linear-gradient(
          180deg,
          var(--gold-400),
          var(--gold)
        );

      box-shadow:
        0 4px 14px rgba(197,160,74,.18);
    }

    .section-subtitle {

      color:
        var(--muted);

      font-size: 11px;

      margin-top: 5px;

      line-height: 1.8;
    }

    .section-badge {

      flex-shrink: 0;

      min-height: 33px;

      padding:
        0 10px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      border-radius: 999px;

      background:
        var(--cream);

      border:
        1px solid
        #efe3bd;

      color:
        #7b6634;

      font-size: 10px;

      font-weight: bold;
    }


    /* =========================================================
       STATS
    ========================================================= */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 13px;
    }

    .stat {

      position: relative;

      overflow: hidden;

      min-height: 150px;

      padding: 18px;

      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #f7faf8
        );

      border:
        1px solid
        var(--border);

      box-shadow:
        var(--shadow-xs);

      transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
    }

    .stat::before {

      content: "";

      position: absolute;

      width: 125px;
      height: 125px;

      border-radius: 50%;

      left: -62px;
      bottom: -73px;

      background:
        radial-gradient(
          circle,
          rgba(197,160,74,.10),
          transparent 68%
        );
    }

    .stat:hover {

      transform:
        translateY(-5px);

      box-shadow:
        var(--shadow);

      border-color:
        #d6e3dc;
    }

    .stat-top {

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 15px;
    }

    .stat-icon {

      width: 44px;
      height: 44px;

      display: grid;

      place-items: center;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          #f8f1db,
          #fffaf0
        );

      border:
        1px solid
        #efe5c9;

      font-size: 20px;

      box-shadow:
        0 6px 15px rgba(197,160,74,.08);
    }

    .stat-trend {

      font-size: 10px;

      color:
        var(--muted);

      background:
        #f3f7f4;

      border-radius: 999px;

      padding:
        5px 8px;
    }

    .stat-label {

      color:
        var(--muted);

      font-size: 11px;

      margin-bottom: 6px;
    }

    .stat-value {

      color:
        var(--green-800);

      font-size: 28px;

      font-weight: 900;

      line-height: 1;
    }

    .stat-note {

      color:
        var(--muted);

      font-size: 10px;

      margin-top: 7px;

      line-height: 1.7;
    }


    /* =========================================================
       PROGRESS
    ========================================================= */

    .progress-grid {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 13px;
    }

    .progress-card {

      position: relative;

      overflow: hidden;

      padding: 18px;

      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          #fbfdfc,
          #ffffff
        );

      border:
        1px solid
        var(--border);

      box-shadow:
        var(--shadow-xs);
    }

    .progress-card::after {

      content: "";

      position: absolute;

      width: 100px;
      height: 100px;

      border-radius: 50%;

      left: -52px;
      top: -52px;

      background:
        radial-gradient(
          circle,
          rgba(33,136,102,.06),
          transparent 65%
        );
    }

    .progress-top {

      position: relative;

      z-index: 1;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 12px;
    }

    .progress-top strong {

      color:
        var(--green-800);

      font-size: 13px;
    }

    .percent {

      color:
        var(--gold-600);

      font-size: 23px;

      font-weight: 900;

      white-space: nowrap;
    }

    .bar {

      height: 11px;

      position: relative;

      overflow: hidden;

      background:
        #e8efeb;

      border-radius: 999px;

      box-shadow:
        inset 0 1px 3px rgba(0,0,0,.035);
    }

    .bar-fill {

      position: relative;

      height: 100%;

      width: 0;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          var(--green-800),
          var(--green-600),
          #43b48a
        );

      box-shadow:
        0 2px 8px rgba(23,107,80,.19);

      transition:
        width 1s cubic-bezier(.22,.61,.36,1);
    }

    .bar-fill::after {

      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.28),
          transparent
        );

      transform:
        translateX(120%);

      animation:
        barShine 2.6s ease-in-out infinite;
    }

    .progress-note {

      margin-top: 10px;

      color:
        var(--muted);

      font-size: 11px;

      line-height: 1.8;
    }

    .progress-note b {
      color:
        var(--green-800);
    }


    /* =========================================================
       QUOTE / INFO
    ========================================================= */

    .soft-note {

      margin-top: 13px;

      padding:
        14px 16px;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #f6faf7,
          #fffdf7
        );

      border:
        1px solid
        var(--border);

      color:
        var(--text-2);

      font-size: 11px;

      line-height: 1.9;
    }

    .soft-note strong {
      color:
        var(--green-800);
    }

    .gold-note {

      margin-top: 13px;

      padding:
        15px 17px;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #fffdf6,
          #fcf7e8
        );

      border:
        1px solid
        #eee4c5;

      color:
        #675a37;

      font-size: 11px;

      line-height: 1.9;
    }


    /* =========================================================
       COMMITMENT
    ========================================================= */

    .commitment-grid {

      display: grid;

      grid-template-columns:
        1.3fr
        repeat(4, 1fr);

      gap: 12px;

      align-items: stretch;
    }

    .commitment-main {

      position: relative;

      overflow: hidden;

      border-radius: 20px;

      padding: 19px;

      min-height: 180px;

      background:
        linear-gradient(
          140deg,
          #edf8f2,
          #fbfaf2
        );

      border:
        1px solid
        #dce8df;

      display: flex;

      align-items: center;

      gap: 15px;
    }

    .commitment-ring {

      --value: 0%;

      width: 116px;
      height: 116px;

      border-radius: 50%;

      display: grid;

      place-items: center;

      flex-shrink: 0;

      position: relative;

      background:
        conic-gradient(
          var(--green-700)
          var(--value),
          #dce8e1 0
        );

      box-shadow:
        0 13px 25px rgba(23,107,80,.10);
    }

    .commitment-ring::before {

      content: "";

      position: absolute;

      inset: 8px;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          white,
          #f6faf8
        );

      box-shadow:
        inset 0 0 0 1px #e8efea;
    }

    .commitment-ring-inner {

      position: relative;

      z-index: 2;

      text-align: center;
    }

    .commitment-ring-inner strong {

      display: block;

      color:
        var(--green-800);

      font-size: 28px;

      font-weight: 900;

      line-height: 1;
    }

    .commitment-ring-inner small {

      display: block;

      color:
        var(--muted);

      font-size: 9px;

      margin-top: 4px;
    }

    .commitment-text {

      min-width: 0;
    }

    .commitment-text small {

      display: block;

      color:
        var(--muted);

      font-size: 10px;

      margin-bottom: 6px;
    }

    .commitment-text h3 {

      color:
        var(--green-800);

      font-size: 19px;

      margin-bottom: 5px;
    }

    .commitment-text p {

      color:
        var(--text-2);

      font-size: 10px;

      line-height: 1.8;
    }

    .commitment-mini {

      padding: 15px;

      border-radius: 17px;

      background:
        #ffffff;

      border:
        1px solid
        var(--border);

      box-shadow:
        var(--shadow-xs);

      display: flex;

      flex-direction: column;

      justify-content: center;
    }

    .commitment-mini small {

      color:
        var(--muted);

      font-size: 10px;

      margin-bottom: 6px;
    }

    .commitment-mini strong {

      color:
        var(--green-800);

      font-size: 24px;

      line-height: 1;
    }

    .commitment-mini span {

      margin-top: 6px;

      color:
        var(--muted);

      font-size: 9px;

      line-height: 1.5;
    }


    /* =========================================================
       POINTS
    ========================================================= */

    .points-breakdown {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;
    }

    .points-card {

      position: relative;

      overflow: hidden;

      padding: 16px;

      min-height: 105px;

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          #f8fbf9,
          #fffdf6
        );

      border:
        1px solid
        var(--border);

      transition:
        transform var(--transition),
        box-shadow var(--transition);
    }

    .points-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        var(--shadow-sm);
    }

    .points-card::after {

      content: "★";

      position: absolute;

      left: -3px;
      bottom: -12px;

      font-size: 58px;

      color:
        rgba(197,160,74,.055);
    }

    .points-card small {

      display: block;

      color:
        var(--muted);

      font-size: 10px;

      margin-bottom: 7px;
    }

    .points-card strong {

      color:
        var(--green-800);

      font-size: 23px;

      line-height: 1;

      font-weight: 900;
    }


    /* =========================================================
       FORM
    ========================================================= */

    .form-grid {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 14px;
    }

    .field.full-field {
      grid-column:
        1 / -1;
    }

    .field {
      min-width: 0;
    }

    label {

      display: block;

      margin-bottom: 7px;

      color:
        var(--text-2);

      font-weight: bold;

      font-size: 11px;
    }

    input,
    textarea,
    select {

      width: 100%;

      min-height: 46px;

      outline: none;

      border:
        1px solid
        #dbe5df;

      border-radius: 13px;

      padding:
        0 13px;

      background:
        rgba(255,255,255,.96);

      color:
        var(--text);

      font-size: 13px;

      transition:
        border-color var(--transition),
        box-shadow var(--transition),
        transform var(--transition);
    }

    textarea {

      min-height: 145px;

      padding:
        13px;

      resize: vertical;

      line-height: 1.8;
    }

    input::placeholder,
    textarea::placeholder {
      color:
        #a4afaa;
    }

    input:hover,
    textarea:hover,
    select:hover {
      border-color:
        #cedbd4;
    }

    input:focus,
    textarea:focus,
    select:focus {

      border-color:
        var(--green-600);

      box-shadow:
        0 0 0 4px
        rgba(33,136,102,.075);

      transform:
        translateY(-1px);
    }

    input[readonly] {

      background:
        #f6faf8;

      color:
        #4f645a;

      cursor: default;
    }

    select {
      cursor: pointer;
    }


    /* =========================================================
       IMAGE UPLOAD
    ========================================================= */

    .image-upload {

      position: relative;

      padding: 15px;

      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          #f6faf7,
          #fffdf7
        );

      border:
        1px dashed
        #bfcfc6;
    }

    .image-upload-row {

      display: flex;

      align-items: center;

      gap: 15px;
    }

    .image-preview-wrap {

      position: relative;

      width: 88px;
      height: 88px;

      flex-shrink: 0;
    }

    .image-preview-ring {

      position: absolute;

      inset: -4px;

      border-radius: 50%;

      border:
        2px solid
        var(--gold);

      opacity: .75;
    }

    .image-preview {

      position: relative;

      z-index: 2;

      width: 88px;
      height: 88px;

      border-radius: 50%;

      object-fit: cover;

      background:
        #eef3ef;

      border:
        4px solid white;

      box-shadow:
        0 9px 24px rgba(13,77,58,.10);
    }

    .file-button {

      position: relative;

      min-height: 44px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      padding:
        0 15px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          var(--green-800),
          var(--green-600)
        );

      color: white;

      cursor: pointer;

      font-size: 12px;

      font-weight: bold;

      box-shadow:
        0 8px 18px
        rgba(13,77,58,.14);

      transition:
        transform var(--transition),
        box-shadow var(--transition);
    }

    .file-button:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 12px 22px
        rgba(13,77,58,.20);
    }

    .file-button input {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      opacity: 0;

      padding: 0;

      min-height: 0;

      cursor: pointer;
    }

    .image-help {

      margin-top: 8px;

      color:
        var(--muted);

      font-size: 9px;

      line-height: 1.8;
    }


    /* =========================================================
       EDITOR
    ========================================================= */

    .editor-list {

      display: flex;

      flex-direction: column;

      gap: 11px;
    }

    .editor-row {

      position: relative;

      overflow: hidden;

      padding: 15px;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          #fbfdfc,
          #ffffff
        );

      border:
        1px solid
        var(--border);

      box-shadow:
        var(--shadow-xs);

      transition:
        transform var(--transition),
        box-shadow var(--transition);
    }

    .editor-row::before {

      content: "";

      position: absolute;

      right: 0;

      top: 0;
      bottom: 0;

      width: 4px;

      background:
        linear-gradient(
          180deg,
          var(--gold-400),
          var(--green-600)
        );

      opacity: .65;
    }

    .editor-row:hover {

      transform:
        translateY(-2px);

      box-shadow:
        var(--shadow-sm);
    }

    .editor-row-head {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 12px;
    }

    .editor-row-title {

      color:
        var(--green-800);

      font-size: 13px;

      font-weight: 900;
    }

    .editor-grid {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;
    }

    .remove {

      min-height: 35px;

      padding:
        0 10px;

      border:
        1px solid
        #f1d4d0;

      background:
        var(--danger-bg);

      color:
        var(--danger);

      border-radius: 10px;

      cursor: pointer;

      font-size: 10px;

      font-weight: bold;

      transition:
        var(--transition);
    }

    .remove:hover {

      transform:
        translateY(-2px);

      background:
        #ffe3e0;

      border-color:
        #ebc1bc;
    }

    .add {

      width: 100%;

      margin-top: 12px;

      min-height: 45px;

      border:
        1px dashed
        #b8c9c0;

      background:
        linear-gradient(
          135deg,
          #f8fbf9,
          #fffef9
        );

      color:
        var(--green-800);

      border-radius: 13px;

      cursor: pointer;

      font-weight: bold;

      font-size: 12px;

      transition:
        transform var(--transition),
        border-color var(--transition),
        background var(--transition);
    }

    .add:hover {

      transform:
        translateY(-2px);

      border-color:
        var(--green-600);

      background:
        #eef7f2;
    }


    /* =========================================================
       EMPTY
    ========================================================= */

    .empty-state {

      padding:
        22px;

      text-align: center;

      color:
        var(--muted);

      background:
        linear-gradient(
          135deg,
          #f7faf8,
          #fffdf8
        );

      border:
        1px dashed
        #d4dfd9;

      border-radius: 15px;

      font-size: 11px;
    }


    /* =========================================================
       SUMMARY MINI
    ========================================================= */

    .recitation-summary {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 11px;

      margin-bottom: 14px;
    }

    .mini-stat {

      position: relative;

      overflow: hidden;

      padding: 14px;

      min-height: 83px;

      background:
        linear-gradient(
          145deg,
          #f7faf8,
          #fffdf7
        );

      border:
        1px solid
        var(--border);

      border-radius: 15px;
    }

    .mini-stat small {

      display: block;

      color:
        var(--muted);

      font-size: 9px;

      margin-bottom: 6px;
    }

    .mini-stat strong {

      color:
        var(--green-800);

      font-size: 20px;

      line-height: 1.15;
    }


    /* =========================================================
       GRADE
    ========================================================= */

    .grade-preview {

      width: 100%;

      min-height: 46px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 8px 9px;

      border-radius: 11px;

      font-size: 10px;

      line-height: 1.4;

      font-weight: 900;

      text-align: center;

      transition:
        var(--transition);
    }

    .grade-excellent {

      background:
        linear-gradient(
          135deg,
          #e6f8ed,
          #f0fcf5
        );

      color:
        #13743f;

      border:
        1px solid
        #caead5;
    }

    .grade-very-good {

      background:
        linear-gradient(
          135deg,
          #e8f1fb,
          #f3f8fe
        );

      color:
        #2869a8;

      border:
        1px solid
        #d4e2f1;
    }

    .grade-good {

      background:
        linear-gradient(
          135deg,
          #fff2dd,
          #fff8ec
        );

      color:
        #9b5c0d;

      border:
        1px solid
        #f2dfbf;
    }

    .grade-acceptable {

      background:
        linear-gradient(
          135deg,
          #f8f2df,
          #fcf8eb
        );

      color:
        #7b6634;

      border:
        1px solid
        #ece2c0;
    }

    .grade-review {

      background:
        linear-gradient(
          135deg,
          #fff0ef,
          #fff5f4
        );

      color:
        #b42318;

      border:
        1px solid
        #f0ceca;
    }

    .grade-empty {

      background:
        #f2f4f3;

      color:
        #68756f;

      border:
        1px solid
        #e2e7e4;
    }


    /* =========================================================
       STATUS
    ========================================================= */

    .status-badge {

      width: 100%;

      min-height: 45px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      padding:
        8px 11px;

      border-radius: 11px;

      font-size: 10px;

      font-weight: 900;

      text-align: center;
    }

    .status-complete {

      background:
        #e7f7ed;

      color:
        #13743f;

      border:
        1px solid
        #ccebd7;
    }

    .status-partial {

      background:
        #fff3df;

      color:
        #9b5c0d;

      border:
        1px solid
        #f0dfbf;
    }

    .status-running {

      background:
        #e8f1fb;

      color:
        #2869a8;

      border:
        1px solid
        #d4e2f0;
    }

    .status-pending {

      background:
        #f1f3f2;

      color:
        #63716b;

      border:
        1px solid
        #e1e6e3;
    }


    /* =========================================================
       QURAN
    ========================================================= */

    .quran-progress {

      position: relative;

      overflow: hidden;

      margin-bottom: 16px;

      padding: 18px;

      border-radius: 19px;

      background:
        linear-gradient(
          135deg,
          #f3f8f5,
          #fffaf0
        );

      border:
        1px solid
        var(--border);
    }

    .quran-progress::after {

      content: "﷽";

      position: absolute;

      left: 12px;
      bottom: -9px;

      color:
        rgba(197,160,74,.065);

      font-size: 55px;

      pointer-events: none;
    }

    .quran-progress-top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 12px;
    }

    .quran-progress-copy small {

      display: block;

      color:
        var(--muted);

      font-size: 10px;

      margin-bottom: 4px;
    }

    .quran-progress-copy strong {

      color:
        var(--green-800);

      font-size: 15px;
    }

    .quran-percent {

      color:
        var(--gold-600);

      font-size: 25px;

      font-weight: 900;
    }

    .quran-progress-foot {

      margin-top: 9px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      color:
        var(--muted);

      font-size: 10px;
    }

    .quran-progress-foot b {

      color:
        var(--green-800);
    }

    .juz-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 12px;
    }

    .juz-card {

      position: relative;

      overflow: hidden;

      border:
        1px solid
        var(--border);

      border-radius: 17px;

      padding: 13px;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #f8fbf9
        );

      box-shadow:
        var(--shadow-xs);

      transition:
        transform var(--transition),
        box-shadow var(--transition);
    }

    .juz-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        var(--shadow-sm);
    }

    .juz-card::before {

      content: "";

      position: absolute;

      width: 70px;
      height: 70px;

      border-radius: 50%;

      left: -35px;
      bottom: -38px;

      background:
        rgba(197,160,74,.055);
    }

    .juz-head {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 8px;
    }

    .juz-title {

      color:
        var(--green-800);

      font-size: 12px;

      font-weight: 900;
    }

    .juz-count {

      min-width: 39px;

      text-align: center;

      padding:
        5px 7px;

      border-radius: 999px;

      background:
        #f3f7f4;

      color:
        var(--muted);

      font-size: 9px;
    }

    .juz-range {

      color:
        #8a968f;

      font-size: 9px;

      margin-bottom: 9px;
    }

    .page-grid {

      display: grid;

      grid-template-columns:
        repeat(10, 1fr);

      gap: 4px;
    }

    .page-dot {

      position: relative;

      min-height: 27px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 7px;

      border:
        1px solid
        #e2e8e4;

      background:
        #f1f4f2;

/* =========================================================

========================================================= */

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function number(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


function formatNumber(
  value,
  digits = 1
) {

  const n =
    number(value);

  if (
    Number.isInteger(n)
  ) {

    return String(n);

  }

  return n
    .toFixed(digits)
    .replace(/\.0+$/, '');

}


function clamp(
  value,
  min,
  max
) {

  return Math.min(
    max,
    Math.max(
      min,
      number(value)
    )
  );

}


function todayISO() {

  const d =
    new Date();

  const year =
    d.getFullYear();

  const month =
    String(
      d.getMonth() + 1
    ).padStart(2, '0');

  const day =
    String(
      d.getDate()
    ).padStart(2, '0');

  return (
    `${year}-${month}-${day}`
  );

}


function formatDate(
  dateValue
) {

  if (!dateValue)
    return '—';

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {

    return escapeHtml(
      dateValue
    );

  }

  return d.toLocaleDateString(
    'ar-JO',
    {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }
  );

}


function showToast(
  text,
  icon = '✓'
) {

  const toast =
    document.getElementById(
      'toast'
    );

  const toastText =
    document.getElementById(
      'toastText'
    );

  const toastIcon =
    toast?.querySelector(
      '.toast-icon'
    );

  if (!toast)
    return;

  if (toastText)
    toastText.textContent = text;

  if (toastIcon)
    toastIcon.textContent = icon;

  toast.classList.add('show');

  clearTimeout(
    toastTimer

/* =========================================================
   الأسابيع
   الجمعة → الخميس
========================================================= */

function getWeekRangeForDate(
  dateValue
) {

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {

    return null;

  }

  const day =
    d.getDay();

  const daysSinceFriday =
    (day + 2) % 7;

  const start =
    new Date(d);

  start.setDate(
    d.getDate() -
    daysSinceFriday
  );

  start.setHours(
    0,
    0,
    0,
    0
  );

  const end =
    new Date(start);

  end.setDate(
    start.getDate() + 6
  );

  end.setHours(
    23,
    59,
    59,
    999
  );

  return {
    start,
    end
  };

}


function dateInCurrentWeek(
  dateValue
) {

  if (!dateValue)
    return false;

  const range =
    getWeekRangeForDate(
      todayISO()
    );

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  if (!range)
    return false;

  return (
    d >= range.start &&
    d <= range.end
  );

}

function getRecitationGrade(
  score
) {

  const s =
    number(score);

  if (
    score === '' ||
    score === null ||
    score === undefined
  ) {

    return {

      label:
        'لم يتم التقييم',

      className:
        'grade-empty'

    };

  }


  if (s >= 97) {

    return {

      label:
        'ممتاز (متقن)',

      className:
        'grade-excellent'

    };

  }


  if (s >= 95) {

    return {

      label:
        'جيد جداً (أخطاء قليلة)',

      className:
        'grade-very-good'

    };

  }


  if (s >= 92) {

    return {

      label:
        'جيد (أخطاء متعددة)',

      className:
        'grade-good'

    };

  }


  if (s >= 90) {

    return {

      label:
        'مقبول (يحتاج تمكين)',

      className:
        'grade-acceptable'

    };

  }


  return {

    label:
      'مراجعة الصفحة',

    className:
      'grade-review'

  };

}


/* =========================================================
   نظام النقاط
========================================================= */

function getRecitationPoints(
  item
) {

  const score =
    number(item.score);

  if (
    score <= 0
  ) {

    return 0;

  }


  if (
    item.type === 'hifz'
  ) {

    if (score >= 97)
      return 6;

    if (score >= 95)
      return 5;

    if (score >= 92)
      return 4;

    if (score >= 90)
      return 2;

    return 0;

  }


  if (
    item.type === 'review'
  ) {

    if (score >= 97)
      return 3;

    if (score >= 95)
      return 2.5;

    if (score >= 92)
      return 2;

    if (score >= 90)
      return 1;

    return 0;

  }


  return 0;

}


/* =========================================================
   نقاط الاختبارات
========================================================= */

function getTestPointsByResult(
  result
) {

  const r =
    String(
      result || ''
    );

  if (
    r.includes('ممتاز+')
  ) {

    return 12;

  }

  if (
    r.includes('ممتاز')
  ) {

    return 12;

  }

  if (
    r.includes('جيد جداً') ||
    r.includes('جيد جدًا')
  ) {

    return 8;

  }

  if (
    r.includes('جيد')
  ) {

    return 4;

  }

  return 0;

}

function getCurrentWeekStats() {

  const goalHifz =
    number(

  const goalReview =

  const records =

        item.type === 'hifz'
    ).length;

  const reviewPages =
    records.filter(
      item =>
        item.type === 'review'
    ).length;

  const hifzProgress =
    goalHifz > 0
      ? (
          hifzPages /
          goalHifz
        ) * 100
      : 0;

  const reviewProgress =
    goalReview > 0
      ? (
          reviewPages /
          goalReview
        ) * 100
      : 0;

  const equivalent =
    hifzPages +
    (
      reviewPages /
      REVIEW_TO_HIFZ_RATIO
    );

    goalHifz +
    (
      goalReview /
      REVIEW_TO_HIFZ_RATIO
    );

  const weeklyProgress =
    requiredEquivalent > 0
      ? (
          equivalent /
          requiredEquivalent
        ) * 100
      : 0;

  return {

    goalHifz,

    goalReview,

    hifzPages,

    reviewPages,

    hifzProgress,

    reviewProgress,

    equivalent,

    requiredEquivalent,

    weeklyProgress

  };

}

/* =========================================================
   تقسيم الأجزاء
========================================================= */

function getJuzInfo(
  juz
) {

  let start =
    1;

  for (
    let i = 1;
    i < juz;
    i++
  ) {

    if (i === 1) {

      start += 21;

    } else if (
      i >= 2 &&
      i <= 29
    ) {

      start += 20;

    }

  }

  let length =
    20;

  if (juz === 1)
    length = 21;

  if (juz === 30)
    length = 23;

  return {

    start,

    end:
      start + length - 1,

    length

  };

}


function getCompletedJuz() {

  const hifz =
    getHifzPageSet();

  let completed =
    0;

  for (
    let juz = 1;
    juz <= 30;
    juz++
  ) {

    const info =
      getJuzInfo(
        juz
      );

    let all =
      true;

    for (
      let page =
        info.start;
      page <= info.end;
      page++
    ) {

      if (
        !hifz.has(page)
      ) {

        all = false;

        break;

      }

    }

    if (all)
      completed++;

  }

  return completed;

}

   الالتزام
========================================================= */

function getAttendanceCommitment() {

  const records =
    profile.attendance.filter(
      item =>
        dateInCurrentWeek(
          item.date
        )
    );

  if (!records.length)
    return 100;

  let score =
    0;

  records.forEach(
    item => {

      if (
        item.status === 'حاضر'
      ) {

        score += 1;

      } else if (
        item.status === 'متأخر'
      ) {

        score += .5;

      } else if (
        item.status === 'معتذر'
      ) {

        score += .5;

      }

    }
  );

  return (
    score /
    records.length
  ) * 100;

}


function getTestCommitment() {

  const tests =
    profile.tests.filter(
      item =>
        dateInCurrentWeek(
          item.date
        )
    );

  if (!tests.length)
    return 100;

  const passed =
    tests.filter(
      item =>
        getTestPointsByResult(
          item.result
        ) > 0
    ).length;

  return (
    passed /
    tests.length
  ) * 100;

}


function getCommitment() {

  const weekly =
    getCurrentWeekStats();

  const attendance =
    clamp(
      getAttendanceCommitment(),
      0,
      100
    );

  const hifz =
    clamp(
      weekly.hifzProgress,
      0,
      100
    );

  const review =
    clamp(
      weekly.reviewProgress,
      0,
      100
    );

  const tests =
    clamp(
      getTestCommitment(),
      0,
      100
    );

  const total =
    (
      attendance * .20
    ) +
    (
      hifz * .35
    ) +
    (
      review * .25
    ) +
    (
      tests * .20
    );

  let label =
    'بحاجة للمتابعة';

  if (total >= 90)
    label = 'ممتاز الالتزام';

  else if (total >= 80)
    label = 'جيد جداً';

  else if (total >= 70)
    label = 'جيد';

  else if (total >= 60)
    label = 'مقبول';

  return {

    total,

    label,

    attendance,

    hifz,

    review,

    tests

  };

}

function getHighestGrade() {

  const grades =
    profile.recitations
      .map(
        item =>
          getRecitationGrade(
            item.score
          )
      )
      .filter(
        grade =>
          grade.label !==
          'لم يتم التقييم'
      );

  if (!grades.length)
    return '—';

  const order = [

    'ممتاز (متقن)',

    'جيد جداً (أخطاء قليلة)',

    'جيد (أخطاء متعددة)',

    'مقبول (يحتاج تمكين)',

    'مراجعة الصفحة'

  ];

  for (
    const wanted of order
  ) {

    if (
      grades.some(
        grade =>
          grade.label === wanted
      )
    ) {

      return wanted;

    }

  }

  return '—';

}


function getRecitationStats() {

  const records =
    profile.recitations;

  const scores =
    records
      .map(
        item =>
          number(item.score)
      )
      .filter(
        score =>
          score >= 0 &&
          score <= 100
      );

  const average =
    scores.length
      ? (
          scores.reduce(
            (a,b) =>
              a + b,
            0
          ) /
          scores.length
        )
      : 0;

  return {

    records:
      records.length,

    pages:
      records.length,

    average,

    highest:
      getHighestGrade()

  };

}


/* =========================================================
   الخطة
========================================================= */

function isDateInsideRange(
  dateValue,
  range
) {

  if (!dateValue)
    return false;

  const d =
    new Date(
      `${dateValue}T12:00:00`
    );

  return (
    d >= range.start &&
    d <= range.end
  );

}


function getPlanStatus(
  item
) {

  const targetHifz =
    number(
      item.hifzTarget ??
      item.hifz ??
      0
    );

  const targetReview =
    number(
      item.reviewTarget ??
      item.review ??
      0
    );

  if (!item.date) {

    return {

      label:
        'قيد الإدخال',

      className:
        'status-pending'

    };

  }

  const range =
    getWeekRangeForDate(
      item.date
    );

  if (!range) {

    return {

      label:
        'قيد الإدخال',

      className:
        'status-pending'

    };

  }

  const hifz =
    profile.recitations.filter(
      rec =>
        rec.type === 'hifz' &&
        isDateInsideRange(
          rec.date,
          range
        )
    ).length;

  const review =
    profile.recitations.filter(
      rec =>
        rec.type === 'review' &&
        isDateInsideRange(
          rec.date,
          range
        )
    ).length;

  const hifzDone =
    targetHifz <= 0
      ? true
      : hifz >= targetHifz;

  const reviewDone =
    targetReview <= 0
      ? true
      : review >= targetReview;

  if (
    hifzDone &&
    reviewDone
  ) {

    return {

      label:
        'مكتملة ✅',

      className:
        'status-complete'

    };

  }

  if (
    hifz > 0 ||
    review > 0
  ) {

    return {

      label:
        'جزئية',

      className:
        'status-partial'

    };

  }

  return {

    label:
      'قيد التنفيذ',

    className:
      'status-running'

  };

}


/* =========================================================

async function loadStudent() {

  try {

    /*
      أولاً نحاول أخذ الطالب من رابط الصفحة،
      وإن لم يوجد نأخذه من جلسة الطالب المحفوظة.
    */

    const params =
      new URLSearchParams(
        window.location.search
      );

    let studentSession =
      null;

    try {

      studentSession =
        JSON.parse(
          sessionStorage.getItem(
            'studentSession'
          ) || 'null'
        );

    } catch (
      sessionError
    ) {

      console.warn(
        'STUDENT SESSION PARSE ERROR:',
        sessionError
      );

      studentSession =
        null;

    }


    studentId =
      params.get('id') ||
      studentSession?.id ||
      null;


    /*
      إذا لم توجد جلسة طالب ولا رقم طالب،
      نعيده إلى صفحة دخول الطالب.
    */

    if (!studentId) {

      window.location.href =
        'student-login.html';

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from('students')
        .select('*')
        .eq(
          'id',
          studentId
        )
        .maybeSingle();


    if (error)
      throw error;


    if (!data) {

      document.getElementById(
        'app'
      ).innerHTML = `

        <div class="loading">

          <div class="loading-icon">
            🔎
          </div>

          <div class="loading-title">
            تعذر العثور على الطالب
          </div>

          <div class="loading-sub">
            تأكد من صحة بيانات الدخول وحاول مرة أخرى.
          </div>

        </div>

      `;

      return;

    }


    /*
      نتأكد أن الطالب الذي تم تحميله
      هو الطالب الذي دخل عبر البوابة.
    */

    student =
      data;


    /*
      تحميل ملف الطالب من student_profiles
    */

    const {
      data: profileRow,
      error: profileError
    } =
      await supabaseClient
        .from('student_profiles')
        .select('data')
        .eq(
          'student_id',
          String(studentId)
        )
        .maybeSingle();


    if (profileError) {

      console.error(
        profileError
      );

      profile =
        defaultProfile();

    } else {

      profile =
        mergeProfile(
          profileRow?.data || {}
        );

    }


    /*
      تحديث الجلسة بآخر بيانات الطالب
    */

    sessionStorage.setItem(
      'studentSession',
      JSON.stringify({

        id:
          student.id,

        name:
          student.name,

        section:
          student.section,

        memorization:
          student.memorization,

        status:
          student.status

      })
    );


    render();


    document.body.classList.add(
      'ready'
    );

  } catch (
    error
  ) {

    console.error(
      'LOAD ERROR:',
      error
    );

    document.getElementById(
      'app'
    ).innerHTML = `

      <div class="loading">

        <div class="loading-icon">
          ⚠️
        </div>

        <div class="loading-title">

        </div>

        <div class="loading-sub">
          حدث خطأ أثناء تحميل البيانات.
        </div>

      </div>

    `;

  }

}

function setupRevealAnimations() {

  const items =
    document.querySelectorAll(
      '.section'
    );

  items.forEach(
    (item,index) => {

      item.style.animationDelay =
        `${Math.min(index * 45, 350)}ms`;

    }
  );


  requestAnimationFrame(
    () => {

      document
        .querySelectorAll('.bar-fill')
        .forEach(
          bar => {

            const width =
              bar.style.width;

            bar.style.width =
              '0%';

            requestAnimationFrame(
              () => {

                bar.style.width =
                  width;

              }
            );

          }
        );

    }
  );

}

async function handlePhotoFile(
  input
) {

  const file =
    input.files?.[0];

  if (!file)
    return;

  if (
    !file.type.startsWith(
      'image/'
    )
  ) {

    alert(
      'الملف المحدد ليس صورة.'
    );

    input.value =
      '';

    return;

  }

  try {

    const compressed =
      await compressImage(
        file
      );

    profile.photoUrl =
      compressed;

    const preview =
      document.getElementById(
        'photoPreview'
      );

    const hero =
      document.getElementById(
        'heroPhoto'
      );

    if (preview)
      preview.src =
        compressed;

    if (hero)
      hero.src =
        compressed;

    showMessage(
      'تم إدراج صورة الطالب بنجاح. اضغط حفظ لتثبيتها ✅',
      'success'
    );

    showToast(
      'تم إدراج الصورة بنجاح',
      '📷'
    );

  } catch (
    error
  ) {

    console.error(
      error
    );

    alert(
      'تعذر تجهيز الصورة.'
    );

  }

}


function compressImage(
  file
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();

      reader.onload =
        () => {

          const img =
            new Image();

          img.onload =
            () => {

              const maxSize =
                700;

              let width =
                img.width;

              let height =
                img.height;

              if (
                width > height &&
                width > maxSize
              ) {

                height =
                  Math.round(
                    height *
                    maxSize /
                    width
                  );

                width =
                  maxSize;

              } else if (
                height >= width &&
                height > maxSize
              ) {

                width =
                  Math.round(
                    width *
                    maxSize /
                    height
                  );

                height =
                  maxSize;

              }

              const canvas =
                document.createElement(
                  'canvas'
                );

              canvas.width =
                width;

              canvas.height =
                height;

              const ctx =
                canvas.getContext(
                  '2d'
                );

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );

              const result =
                canvas.toDataURL(
                  'image/jpeg',
                  0.82
                );

              resolve(
                result
              );

            };

          img.onerror =
            reject;

          img.src =
            reader.result;

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}

  const date =
    document.querySelector(
      `[data-plan-date="${index}"]`
    )?.value || '';

  const hifz =
    number(
      document.querySelector(
        `[data-plan-hifz="${index}"]`
      )?.value
    );

  const review =
    number(
      document.querySelector(
        `[data-plan-review="${index}"]`
      )?.value
    );

  const temporary = {

    ...item,

    date,

    hifzTarget:
      hifz,

    reviewTarget:
      review

  };

  const status =
    getPlanStatus(
      temporary
    );

  const element =
    document.getElementById(
      `plan-status-${index}`
    );

  if (element) {

    element.className =
      `status-badge ${status.className}`;

    element.textContent =
      status.label;
