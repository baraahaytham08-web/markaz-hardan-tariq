<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ملف الطالب | مركز حردان طارق القرآني</title>

  <link rel="icon" type="image/png" href="logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --green: #0d4d3a;
      --green2: #218866;
      --light-green: #eaf4ee;
      --very-light: #f5f9f7;
      --border: #dfe9e4;
      --text: #18352c;
      --muted: #71817a;
      --danger: #b42318;
      --warning: #a15c00;
      --white: #ffffff;
      --shadow: 0 10px 35px rgba(13, 77, 58, .08);
    }

    body {
      margin: 0;
      background:
        linear-gradient(135deg, #f5f9f7 0%, #eef6f2 100%);
      color: var(--text);
      font-family: "Cairo", sans-serif;
      min-height: 100vh;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================
       TOP BAR
    ========================================================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,.04);
    }

    .topbar-inner {
      max-width: 1250px;
      margin: auto;
      padding: 15px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--green);
      font-weight: 900;
    }

    .brand img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      border-radius: 12px;
    }

    .brand-text {
      line-height: 1.3;
    }

    .brand-title {
      font-size: 16px;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .back-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--green);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 800;
      transition: .2s;
    }

    .back-btn:hover {
      background: var(--light-green);
      transform: translateY(-1px);
    }

    /* =========================================================
       MAIN
    ========================================================= */

    .page {
      max-width: 1250px;
      margin: auto;
      padding: 28px 20px 50px;
    }

    /* =========================================================
       PROFILE HEADER
    ========================================================= */

    .profile-header {
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 25px;

      display: flex;
      align-items: center;
      gap: 25px;

      margin-bottom: 22px;
    }

    .photo-area {
      position: relative;
      flex-shrink: 0;
    }

    .student-photo {
      width: 125px;
      height: 125px;
      border-radius: 25px;
      object-fit: cover;
      border: 4px solid var(--light-green);
      background: #f0f4f2;
      display: block;
    }

    .photo-button {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);

      border: none;
      background: var(--green);
      color: white;

      padding: 7px 13px;
      border-radius: 10px;

      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;

      box-shadow: 0 5px 15px rgba(13,77,58,.2);
    }

    #photoInput {
      display: none;
    }

    .profile-main {
      flex: 1;
      min-width: 0;
    }

    .profile-name {
      font-size: 29px;
      font-weight: 900;
      color: var(--green);
      margin: 0 0 8px;
      word-break: break-word;
    }

    .profile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-badge {
      background: var(--very-light);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #18a05e;
    }

    /* =========================================================
       STATS
    ========================================================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .stat-value {
      color: var(--green);
      font-size: 25px;
      font-weight: 900;
    }

    /* =========================================================
       SECTIONS
    ========================================================= */

    .section {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-bottom: 15px;
      overflow: hidden;
      transition: .2s;
    }

    .section.open {
      border-color: #cfe0d8;
      box-shadow: 0 12px 30px rgba(13,77,58,.08);
    }

    .section-head {
      min-height: 62px;
      padding: 12px 58px 12px 18px;

      position: relative;
      cursor: pointer;
      user-select: none;

      display: flex;
      align-items: center;
    }

    .section-head::after {
      content: "＋";

      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);

      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: var(--very-light);
      color: var(--green);

      font-size: 20px;
      font-weight: 900;
    }

    .section.open .section-head::after {
      content: "−";
      background: var(--light-green);
    }

    .section-title {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      color: var(--green);
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .section-body {
      display: none;
      padding: 0 20px 20px;
    }

    .section.open .section-body {
      display: block;
      animation: openSection .22s ease;
    }

    @keyframes openSection {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       FORMS
    ========================================================= */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 12px;
      font-weight: 800;
      color: #496159;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #fbfdfc;
      color: var(--text);

      border-radius: 11px;
      padding: 11px 13px;

      outline: none;
      font-size: 13px;

      transition: .2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--green2);
      box-shadow: 0 0 0 3px rgba(33,136,102,.08);
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    /* =========================================================
       TABLES
    ========================================================= */

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 11px 10px;
      border-bottom: 1px solid #edf2ef;
      text-align: center;
      font-size: 12px;
    }

    th {
      background: var(--very-light);
      color: var(--green);
      font-weight: 900;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .table-input {
      min-width: 100px;
      padding: 8px 9px;
      font-size: 12px;
    }

    .small-input {
      width: 100px;
      margin: auto;
    }

    .add-row {
      margin-top: 12px;
      border: 1px dashed #b9ccc3;
      background: #f8fbf9;
      color: var(--green);
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 800;
    }

    .remove-row {
      border: none;
      background: #fff0ef;
      color: var(--danger);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-weight: 900;
    }

    /* =========================================================
       SAVE
    ========================================================= */

    .save-wrap {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #e2e9e5;

      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .save-btn {
      border: none;
      background: linear-gradient(135deg, var(--green), var(--green2));
      color: white;

      padding: 12px 20px;
      border-radius: 12px;

      font-weight: 900;
      font-size: 13px;

      box-shadow: 0 7px 18px rgba(13,77,58,.16);
      transition: .2s;
    }

    .save-btn:hover {
      transform: translateY(-2px);
    }

    .save-btn:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
    }

    .save-message {
      min-height: 20px;
      font-size: 12px;
      font-weight: 800;
    }

    .save-message.success {
      color: #13743f;
    }

    .save-message.error {
      color: var(--danger);
    }

    /* =========================================================
       LOADING / ERROR
    ========================================================= */

    .loading {
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: var(--muted);
      font-weight: 800;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #dceae3;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      background: #fff4f3;
      border: 1px solid #f1cbc7;
      color: var(--danger);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      font-weight: 800;
    }

    /* =========================================================
       EMPTY
    ========================================================= */

    .empty {
      text-align: center;
      padding: 25px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 800px) {

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .profile-header {
        align-items: flex-start;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

    }

    @media (max-width: 600px) {

      .topbar-inner {
        padding: 11px 13px;
      }

      .brand-title {
        font-size: 13px;
      }

      .brand-subtitle {
        display: none;
      }

      .brand img {
        width: 39px;
        height: 39px;
      }

      .back-btn {
        padding: 8px 11px;
        font-size: 11px;
      }

      .page {
        padding: 15px 10px 35px;
      }

      .profile-header {
        padding: 18px;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .profile-meta {
        justify-content: center;
      }

      .student-photo {
        width: 110px;
        height: 110px;
      }

      .profile-name {
        font-size: 23px;
      }

      .stats-grid {
        gap: 9px;
      }

      .stat-card {
        padding: 13px;
      }

      .stat-value {
        font-size: 20px;
      }

      .section-head {
        min-height: 56px;
        padding: 10px 50px 10px 12px;
      }

      .section-head::after {
        width: 31px;
        height: 31px;
        left: 10px;
      }

      .section-body {
        padding: 0 12px 15px;
      }

      .save-wrap {
        flex-direction: column;
        align-items: stretch;
      }

      .save-btn {
        width: 100%;
      }

    }

  </style>
</head>

<body>

  <!-- =========================================================
       TOP BAR
  ========================================================= -->

  <header class="topbar">

    <div class="topbar-inner">

      <a href="teacher-dashboard.html" class="brand">

        <img src="logo.png" alt="شعار المركز">

        <div class="brand-text">
          <div class="brand-title">
            مركز حردان طارق القرآني
          </div>

          <div class="brand-subtitle">
            ملف الطالب
          </div>
        </div>

      </a>

      <button
        class="back-btn"
        type="button"
        onclick="goBack()"
      >
        ← العودة للطلاب
      </button>

    </div>

  </header>


  <!-- =========================================================
       PAGE
  ========================================================= -->

  <main class="page">

    <div id="app">

      <div class="loading">

        <div class="spinner"></div>

        <div>
          جاري تحميل ملف الطالب...
        </div>

      </div>

    </div>

  </main>


  <script>

    /* =========================================================
       SUPABASE
    ========================================================= */

    const SUPABASE_URL =
      'https://lsbbcybpiulusdgfhepf.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_qECf_PrJFSGgMJJr4yJLew_MCeslUF0';

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================================
       AUTH
    ========================================================= */

    function checkUser() {

      const accessGranted =
        localStorage.getItem('teacherAccess') === 'granted';

      if (!accessGranted) {

        window.location.href =
          'teacher-login.html';

        return false;

      }

      return true;

    }


    if (!checkUser()) {
      throw new Error('Unauthorized');
    }


    /* =========================================================
       STUDENT ID
    ========================================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const studentId =
      params.get('id');


    if (!studentId) {

      document.getElementById('app').innerHTML = `

        <div class="error-box">

          لم يتم تحديد الطالب.

          <br><br>

          <button
            class="back-btn"
            onclick="goBack()"
          >
            العودة للوحة المعلم
          </button>

        </div>

      `;

      throw new Error('Student ID missing');

    }


    /* =========================================================
       DATA
    ========================================================= */

    let student = null;

    let profile = {};


    /* =========================================================
       DEFAULT PROFILE
    ========================================================= */

    function mergeProfile(data) {

      const source =
        data && typeof data === 'object'
          ? data
          : {};

      return {

        photoUrl:
          source.photoUrl || '',

        guardianPhone:
          source.guardianPhone || '',

        joiningDate:
          source.joiningDate || '',

        residence:
          source.residence || '',

        bus:
          source.bus || '',

        homeLocation:
          source.homeLocation || '',

        weeklyGoal:
          source.weeklyGoal || {
            hifz: '',
            review: ''
          },

        attendance:
          Array.isArray(source.attendance)
            ? source.attendance
            : [],

        weeklyPlan:
          Array.isArray(source.weeklyPlan)
            ? source.weeklyPlan
            : [],

        tests:
          Array.isArray(source.tests)
            ? source.tests
            : [],

        recitations:
          Array.isArray(source.recitations)
            ? source.recitations
            : [],

        notes:
          source.notes || ''

      };

    }


    /* =========================================================
       LOAD STUDENT
    ========================================================= */

    async function loadStudent() {

      try {

        const {
          data: studentData,
          error: studentError
        } =
          await supabaseClient

            .from('students')

            .select('*')

            .eq(
              'id',
              studentId
            )

            .maybeSingle();


        if (studentError)
          throw studentError;


        if (!studentData) {

          throw new Error(
            'لم يتم العثور على الطالب.'
          );

        }


        student =
          studentData;


        const {
          data: profileData,
          error: profileError
        } =
          await supabaseClient

            .from('student_profiles')

            .select('data')

            .eq(
              'student_id',
              String(studentId)
            )

            .maybeSingle();


        if (profileError)
          throw profileError;


        profile =
          mergeProfile(
            profileData?.data || {}
          );


        render();

      } catch (error) {

        console.error(
          'LOAD STUDENT ERROR:',
          error
        );

        document.getElementById('app').innerHTML = `

          <div class="error-box">

            حدث خطأ أثناء تحميل بيانات الطالب.

            <br><br>

            ${escapeHtml(
              error?.message ||
              'خطأ غير معروف'
            )}

            <br><br>

            <button
              class="back-btn"
              onclick="goBack()"
            >
              العودة للوحة المعلم
            </button>

          </div>

        `;

      }

    }


    /* =========================================================
       ESCAPE
    ========================================================= */

    function escapeHtml(value) {

      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }


    /* =========================================================
       NUMBER
    ========================================================= */

    function number(value) {

      if (
        value === '' ||
        value === null ||
        value === undefined
      ) {
        return '';
      }

      const n =
        Number(value);

      return Number.isFinite(n)
        ? n
        : '';

    }


    /* =========================================================
       STATUS
    ========================================================= */

    function statusText(status) {

      const map = {

        active: 'مستمر',

        inactive: 'متوقف',

        rejected: 'غير مقبول',

        expelled: 'مفصول',

        pending: 'طلب بانتظار الموافقة'

      };

      return (
        map[status] ||
        status ||
        'غير محدد'
      );

    }


    function statusDot(status) {

      const colors = {

        active: '#18a05e',

        inactive: '#999',

        rejected: '#d83a31',

        expelled: '#d83a31',

        pending: '#d98a00'

      };

      return (
        colors[status] ||
        '#999'
      );

    }


    /* =========================================================
       RENDER
    ========================================================= */

    function render() {

      const app =
        document.getElementById('app');


      app.innerHTML = `

        <!-- ================= PROFILE HEADER ================= -->

        <section class="profile-header">

          <div class="photo-area">

            <img
              id="studentPhoto"
              class="student-photo"
              src="${escapeHtml(
                getStudentPhoto()
              )}"
              alt="صورة الطالب"
              onerror="this.src=''; this.style.background='#eef4f1';"
            >

            <button
              type="button"
              class="photo-button"
              onclick="document.getElementById('photoInput').click()"
            >
              📷 تغيير الصورة
            </button>

            <input
              id="photoInput"
              type="file"
              accept="image/*"
              onchange="handlePhoto(event)"
            >

          </div>


          <div class="profile-main">

            <h1 class="profile-name">
              ${escapeHtml(
                student.name || 'طالب'
              )}
            </h1>

            <div class="profile-meta">

              <span class="meta-badge">
                الصف:
                ${escapeHtml(
                  student.section || 'غير محدد'
                )}
              </span>

              <span class="meta-badge">
                العمر:
                ${escapeHtml(
                  student.age || 'غير محدد'
                )}
              </span>

              <span class="meta-badge status-badge">

                <span
                  class="status-dot"
                  style="background:${statusDot(
                    student.status
                  )}"
                ></span>

                ${escapeHtml(
                  statusText(student.status)
                )}

              </span>

            </div>

          </div>

        </section>


        <!-- ================= STATS ================= -->

        <section class="stats-grid">

          <div class="stat-card">

            <div class="stat-label">
              عدد أيام الحضور
            </div>

            <div
              class="stat-value"
              id="attendanceCount"
            >
              0
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-label">
              عدد التسميعات
            </div>

            <div
              class="stat-value"
              id="recitationCount"
            >
              0
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-label">
              عدد الاختبارات
            </div>

            <div
              class="stat-value"
              id="testCount"
            >
              0
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-label">
              الصفحات المحفوظة
            </div>

            <div
              class="stat-value"
              id="memorizationValue"
            >
              ${escapeHtml(
                student.memorization || '—'
              )}
            </div>

          </div>

        </section>


        <!-- ================= BASIC ================= -->

        <section
          class="section accordion-section"
          data-key="basic"
        >

          <div
            class="section-head"
            onclick="toggleSection(this.parentElement)"
          >

            <div>

              <h2 class="section-title">
                📋 البيانات الأساسية
              </h2>

              <div class="section-subtitle">
                معلومات الطالب الأساسية وبيانات التواصل
              </div>

            </div>

          </div>


          <div class="section-body">

            <div class="form-grid">

              <div class="form-group">

                <label class="form-label">
                  اسم الطالب
                </label>

                <input
                  id="name"

    /* =========================================================
       GET PHOTO
    ========================================================= */

    function getStudentPhoto() {

      const localPhoto =
        localStorage.getItem(
          `studentPhoto_${studentId}`
        );

      if (localPhoto)
        return localPhoto;


      if (profile?.photoUrl)
        return profile.photoUrl;


      return '';

    }


    /* =========================================================
       PHOTO
    ========================================================= */

    async function handlePhoto(event) {

      const file =
        event.target.files?.[0];

      if (!file)
        return;


      if (!file.type.startsWith('image/')) {

        alert(
          'الرجاء اختيار صورة صحيحة.'
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload = async function(e) {

        const dataUrl =
          e.target.result;


        localStorage.setItem(
          `studentPhoto_${studentId}`,
          dataUrl
        );


        const img =
          document.getElementById(
            'studentPhoto'
          );


        if (img)
          img.src = dataUrl;


        try {

          const fresh =
            await readFreshProfile();


          await saveProfilePatch({

            photoUrl:
              dataUrl

          });


          profile =
            mergeProfile({

              ...fresh,

              photoUrl:
                dataUrl

            });


          showGlobalMessage(
            '✅ تم تغيير صورة الطالب وحفظها بنجاح.'
          );

        } catch (error) {

          console.error(
            'PHOTO SAVE ERROR:',
            error
          );

          showGlobalMessage(
            '⚠️ تم تغيير الصورة على الجهاز، لكن تعذر حفظها في قاعدة البيانات.'
          );

        }

      };


      reader.readAsDataURL(file);

    }


    /* =========================================================
       READ FRESH PROFILE
    ========================================================= */

    async function readFreshProfile() {

      const {
        data,
        error
      } =
        await supabaseClient

          .from('student_profiles')

          .select('data')

          .eq(
            'student_id',
            String(studentId)
          )

          .maybeSingle();


      if (error)
        throw error;


      return mergeProfile(
        data?.data || {}
      );

    }


    /* =========================================================
       SAVE PROFILE PATCH
    ========================================================= */

    async function saveProfilePatch(
      changes
    ) {

      const fresh =
        await readFreshProfile();


      const merged = {

        ...fresh,

        ...changes

      };


      const {
        error
      } =
        await supabaseClient

          .from('student_profiles')

          .upsert({

            student_id:
              String(studentId),

            data:
              merged,

            updated_at:
              new Date().toISOString()

          });


      if (error)
        throw error;


      return merged;

    }


    /* =========================================================
       SAVE SECTION
    ========================================================= */

    async function saveSection(
      key,
      button
    ) {

      if (
        !student ||
        !studentId
      ) {

        showSaveError(
          button,
          'لم يتم تحميل بيانات الطالب.'
        );

        return;

      }


      button.disabled =
        true;


      const oldText =
        button.textContent;


      button.textContent =
        '⏳ جاري الحفظ...';


      try {

        switch (key) {

          /* ================= BASIC ================= */

          case 'basic': {

            const name =
              document
                .getElementById('name')
                ?.value
                .trim() || '';


            if (!name) {

              throw new Error(
                'اسم الطالب مطلوب.'
              );

            }


            const studentUpdate = {

              name,

              age:
                number(
                  document
                    .getElementById('age')
                    ?.value
                ),

              section:
                document
                  .getElementById('section')
                  ?.value
                  .trim() || '',

              memorization:
                document
                  .getElementById('memorization')
                  ?.value
                  .trim() || '',

              status:
                document
                  .getElementById('status')
                  ?.value ||
                'active',

              guardian_phone:
                document
                  .getElementById('guardianPhone')
                  ?.value
                  .trim() || ''

            };


            const {
              error:
                studentError
            } =
              await supabaseClient

                .from('students')

                .update(
                  studentUpdate
                )

                .eq(
                  'id',
                  studentId
                );


            if (studentError)
              throw studentError;


            const profilePatch = {

              photoUrl:
                profile.photoUrl ||
                '',

              guardianPhone:
                document
                  .getElementById('guardianPhone')
                  ?.value
                  .trim() || '',

              joiningDate:
                document
                  .getElementById('joiningDate')
                  ?.value || '',

              residence:
                document
                  .getElementById('residence')
                  ?.value
                  .trim() || '',

              bus:
                document
                  .getElementById('bus')
                  ?.value
                  .trim() || '',

              homeLocation:
                document
                  .getElementById('homeLocation')
                  ?.value
                  .trim() || ''

            };


            await saveProfilePatch(
              profilePatch
            );


            student = {

              ...student,

              ...studentUpdate

            };


            profile =
              mergeProfile({

                ...profile,

                ...profilePatch

              });


            break;

          }


          /* ================= GOAL ================= */

          case 'weeklyGoal': {

            const weeklyGoal = {

              hifz:
                number(
                  document
                    .getElementById('goalHifz')
                    ?.value
                ),

              review:
                number(
                  document
                    .getElementById('goalReview')
                    ?.value
                )

            };


            await saveProfilePatch({

              weeklyGoal

            });


            profile.weeklyGoal =
              weeklyGoal;


            break;

          }


          /* ================= ATTENDANCE ================= */

          case 'attendance': {

            const attendance =
              collectAttendance();


            await saveProfilePatch({

              attendance

            });


            profile.attendance =
              attendance;


            break;

          }


          /* ================= PLAN ================= */

          case 'weeklyPlan': {

            const weeklyPlan =
              collectPlan();


            await saveProfilePatch({

              weeklyPlan

            });


            profile.weeklyPlan =
              weeklyPlan;


            break;

          }


          /* ================= TESTS ================= */

          case 'tests': {

            const tests =
              collectTests();


            await saveProfilePatch({

              tests

            });


            profile.tests =
              tests;


            break;

          }


          /* ================= RECITATIONS ================= */

          case 'recitations': {

            const recitations =
              collectRecitations();


            await saveProfilePatch({

              recitations

            });


            profile.recitations =
              recitations;


            break;

          }


          /* ================= NOTES ================= */

          case 'notes': {

            const notes =
              document
                .getElementById('notes')
                ?.value
                .trim() || '';


            await saveProfilePatch({

              notes

            });


            profile.notes =
              notes;


            break;

          }


          default:

            throw new Error(
              'الخانة غير معروفة.'
            );

        }


        updateStats();


        showSaveSuccess(
          button,
          '✅ تم حفظ هذه الخانة فقط بنجاح.'
        );


      } catch (error) {

        console.error(
          'SECTION SAVE ERROR:',
          error
        );


        showSaveError(
          button,
          error?.message ||
          'حدث خطأ أثناء الحفظ.'
        );

      } finally {

        button.disabled =
          false;

        button.textContent =
          oldText;

      }

    }


    /* =========================================================
       SAVE MESSAGES
    ========================================================= */

    function getSaveMessageBox(
      button
    ) {

      return button
        ?.closest('.save-wrap')
        ?.querySelector('.save-message');

    }


    function showSaveSuccess(
      button,
      message
    ) {

      const box =
        getSaveMessageBox(button);


      if (!box)
        return;


      box.className =
        'save-message success';


      box.textContent =
        message;

    }


    function showSaveError(
      button,
      message
    ) {

      const box =
        getSaveMessageBox(button);


      if (!box)
        return;


      box.className =
        'save-message error';


      box.textContent =
        message;

    }


    function showGlobalMessage(
      message
    ) {

      const old =
        document.getElementById(
          'globalMessage'
        );


      if (old)
        old.remove();


      const box =
        document.createElement('div');


      box.id =
        'globalMessage';


      box.textContent =
        message;


      Object.assign(
        box.style,
        {

          position: 'fixed',

          bottom: '20px',

          left: '50%',

          transform:
            'translateX(-50%)',

          zIndex: '9999',

          background: '#0d4d3a',

          color: 'white',

          padding: '12px 20px',

          borderRadius: '12px',

          fontWeight: '800',

          fontSize: '13px',

          boxShadow:
            '0 10px 30px rgba(0,0,0,.2)'

        }
      );


      document.body.appendChild(box);


      setTimeout(() => {

        box.remove();

      }, 3500);

    }


    /* =========================================================
       ACCORDION
    ========================================================= */

    function toggleSection(
      section
    ) {

      if (
        section.classList.contains('open')
      ) {

        section.classList.remove('open');

        return;

      }


      document
        .querySelectorAll(
          '.accordion-section.open'
        )
        .forEach(
          other => {

            if (
              other !== section
            ) {

              other.classList.remove(
                'open'
              );

            }

          }
        );


      section.classList.add('open');

    }


    /* =========================================================
       ATTENDANCE
    ========================================================= */

    function renderAttendance() {

      const body =
        document.getElementById(
          'attendanceBody'
        );


      if (!body)
        return;


      body.innerHTML = '';


      if (
        !profile.attendance ||
        !profile.attendance.length
      ) {

        return;

      }


      profile.attendance.forEach(
        item => {

          addAttendanceRow(
            item,
            false
          );

        }
      );

    }


    function addAttendanceRow(
      item = {},
      redraw = true
    ) {

      const body =
        document.getElementById(
          'attendanceBody'
        );


      if (!body)
        return;


      const row =
        document.createElement('tr');


      row.innerHTML = `

        <td>

          <input
            class="table-input attendance-date"
            type="date"
            value="${escapeHtml(
              item.date || ''
            )}"
          >

        </td>


        <td>

          <select
            class="table-input attendance-status"
          >

            <option
              value="present"
              ${item.status === 'present' ? 'selected' : ''}
            >
              حاضر
            </option>

            <option
              value="late"
              ${item.status === 'late' ? 'selected' : ''}
            >
              متأخر
            </option>

            <option
              value="excused"
              ${item.status === 'excused' ? 'selected' : ''}
            >
              معتذر
            </option>

            <option
              value="absent"
              ${item.status === 'absent' ? 'selected' : ''}
            >
              غائب
            </option>

          </select>

        </td>


        <td>

          <input
            class="table-input attendance-note"
            type="text"
            placeholder="ملاحظة"
            value="${escapeHtml(
              item.note || ''
            )}"
          >

        </td>


        <td>

          <button
            type="button"
            class="remove-row"
            onclick="this.closest('tr').remove()"
          >
            ×
          </button>

        </td>

      `;


      body.appendChild(row);

    }


    function collectAttendance() {

      return [
        ...document.querySelectorAll(
          '#attendanceBody tr'
        )
      ]
        .map(row => ({

          date:
            row
              .querySelector('.attendance-date')
              ?.value || '',

          status:
            row
              .querySelector('.attendance-status')
              ?.value || 'present',

          note:
            row
              .querySelector('.attendance-note')
              ?.value
              .trim() || ''

        }))
        .filter(
          item =>
            item.date ||
            item.note
        );

    }

    function renderPlan() {

      const body =
        document.getElementById(
          'planBody'

      if (!body)

      body.innerHTML = '';


      if (
        !profile.weeklyPlan ||
        !profile.weeklyPlan.length
      ) {

        return;

      }


      profile.weeklyPlan.forEach(
        item => {

          addPlanRow(
            item
          );

        }
      );

    }


    function addPlanRow(
      item = {}
    ) {

      const body =
        document.getElementById(
          'planBody'
        );


      if (!body)
        return;


      const row =
        document.createElement('tr');


      row.innerHTML = `

        <td>

          <input
            class="table-input plan-day"
            type="text"
            placeholder="السبت"
            value="${escapeHtml(
              item.day || ''
            )}"
          >

        </td>


        <td>

          <input
            class="table-input plan-hifz"
            type="text"
            placeholder="مثال: ص 20-22"
            value="${escapeHtml(
              item.hifz || ''
            )}"
          >

        </td>


        <td>

          <input
            class="table-input plan-review"
            type="text"
            placeholder="مثال: ص 10-19"
            value="${escapeHtml(
              item.review || ''
            )}"
          >

        </td>


        <td>

          <input
            class="table-input plan-note"
            type="text"
            placeholder="ملاحظات"
            value="${escapeHtml(
              item.note || ''
            )}"
          >

        </td>


        <td>

          <button
            type="button"
            class="remove-row"
            onclick="this.closest('tr').remove()"
          >
            ×
          </button>

        </td>

      `;


      body.appendChild(row);

    }


    function collectPlan() {

      return [
        ...document.querySelectorAll(
          '#planBody tr'
        )
      ]
        .map(row => ({

          day:
            row
              .querySelector('.plan-day')
              ?.value
              .trim() || '',

          hifz:
            row
              .querySelector('.plan-hifz')
              ?.value
              .trim() || '',

          review:
            row
              .querySelector('.plan-review')
              ?.value
              .trim() || '',

          note:
            row
              .querySelector('.plan-note')
              ?.value
              .trim() || ''

        }))
        .filter(
          item =>
            item.day ||
            item.hifz ||
            item.review ||
            item.note
        );

    }


    /* =========================================================
       TESTS
    ========================================================= */

    function renderTests() {

      const body =
        document.getElementById(
          'testsBody'
        );


      if (!body)
        return;


      body.innerHTML = '';


      if (
        !profile.tests ||
        !profile.tests.length
      ) {

        return;

      }


      profile.tests.forEach(
        item => {

          addTestRow(
            item
          );

        }
      );

    }


    function addTestRow(
      item = {}
    ) {

      const body =
        document.getElementById(
          'testsBody'
        );


      if (!body)
        return;


      const row =
        document.createElement('tr');


      row.innerHTML = `

        <td>

          <input
            class="table-input test-date"
            type="date"
            value="${escapeHtml(
              item.date || ''
            )}"
          >

        </td>


        <td>

          <input
            class="table-input test-name"
            type="text"
            placeholder="اسم الاختبار"
            value="${escapeHtml(
              item.name || ''
            )}"
          >

        </td>


        <td>

          <input
            class="table-input test-score"
            type="number"
            step="0.1"
            min="0"
            value="${escapeHtml(
              item.score ?? ''
            )}"
          >

        </td>


        <td>

          <input
            class="table-input test-outof"
            type="number"
            step="0.1"
            min="1"
            value="${escapeHtml(
              item.outOf ?? 100
            )}"
          >

        </td>


        <td>

          <input
            class="table-input test-note"
            type="text"
            placeholder="ملاحظات"
            value="${escapeHtml(
              item.note || ''
            )}"
          >

        </td>


        <td>

          <button
            type="button"
            class="remove-row"
            onclick="this.closest('tr').remove()"
          >
            ×
          </button>

        </td>

      `;


      body.appendChild(row);

    }


    function collectTests() {

      return [
        ...document.querySelectorAll(
          '#testsBody tr'
        )
      ]
        .map(row => ({

          date:
            row
              .querySelector('.test-date')
              ?.value || '',

          name:
            row
              .querySelector('.test-name')
              ?.value
              .trim() || '',

          score:
            number(
              row
                .querySelector('.test-score')
                ?.value
            ),

          outOf:
            number(
              row
                .querySelector('.test-outof')
                ?.value
            ) || 100,

          note:
            row
              .querySelector('.test-note')
              ?.value
              .trim() || ''

        }))
        .filter(
          item =>
            item.date ||
            item.name ||
            item.score !== ''
        );

    }


    /* =========================================================
       RECITATIONS
    ========================================================= */

    function renderRecitations() {

      const body =
        document.getElementById(
          'recitationsBody'
        );


      if (!body)
        return;


      body.innerHTML = '';


      if (
        !profile.recitations ||
        !profile.recitations.length
      ) {

        return;

      }


      profile.recitations.forEach(
        item => {

          addRecitationRow(
            item
          );

        }
      );

    }


    function addRecitationRow(
      item = {}
    ) {

      const body =
        document.getElementById(
          'recitationsBody'
        );


      if (!body)
        return;


      const row =
        document.createElement('tr');


      row.innerHTML = `

        <td>

          <input
            class="table-input rec-date"
            type="date"
            value="${escapeHtml(
              item.date || ''
            )}"
          >

        </td>


        <td>

          <select
            class="table-input rec-type"
          >

            <option
              value="hifz"
              ${item.type === 'hifz' ? 'selected' : ''}
            >
              حفظ
            </option>

            <option
              value="review"
              ${item.type === 'review' ? 'selected' : ''}
            >
              مراجعة
            </option>

          </select>

        </td>


        <td>

          <input
            class="table-input rec-from"
            type="number"
            min="1"
            max="604"
            placeholder="1"
            value="${escapeHtml(
              item.from ?? ''
            )}"
          >

        </td>


        <td>

          <input
            class="table-input rec-to"
            type="number"
            min="1"
            max="604"
            placeholder="604"
            value="${escapeHtml(
              item.to ?? ''
            )}"
          >

        </td>


        <td>

          <input
            class="table-input rec-score"
            type="number"
            min="0"
            max="100"
            step="0.1"
            placeholder="100"
            value="${escapeHtml(
              item.score ?? ''
            )}"
          >

        </td>


        <td>

          <input
            class="table-input rec-note"
            type="text"
            placeholder="ملاحظات"
            value="${escapeHtml(
              item.note || ''
            )}"
          >

        </td>


        <td>

          <button
            type="button"
            class="remove-row"
            onclick="this.closest('tr').remove()"
          >
            ×
          </button>

        </td>

      `;


      body.appendChild(row);

    }


    function collectRecitations() {

      return [
        ...document.querySelectorAll(
          '#recitationsBody tr'
        )
      ]
        .map(row => ({

          date:
            row
              .querySelector('.rec-date')
              ?.value || '',

          type:
            row
              .querySelector('.rec-type')
              ?.value || 'hifz',

          from:
            number(
              row
                .querySelector('.rec-from')
                ?.value
            ),

          to:
            number(
              row
                .querySelector('.rec-to')
                ?.value
            ),

          score:
            number(
              row
                .querySelector('.rec-score')
                ?.value
            ),

          note:
            row
              .querySelector('.rec-note')
              ?.value
              .trim() || ''

        }))
        .filter(
          item =>
            item.date ||
            item.from !== '' ||
            item.to !== '' ||
            item.score !== '' ||
            item.note
        );

    }


    /* =========================================================
       STATS
    ========================================================= */

    function updateStats() {

      const attendanceCount =
        document.querySelectorAll(
          '#attendanceBody tr'
        ).length;


      const recitationCount =
        document.querySelectorAll(
          '#recitationsBody tr'
        ).length;


      const testCount =
        document.querySelectorAll(
          '#testsBody tr'
        ).length;


      const attendanceElement =
        document.getElementById(
          'attendanceCount'
        );


      const recitationElement =
        document.getElementById(
          'recitationCount'
        );


      const testElement =
        document.getElementById(
          'testCount'
        );


      if (attendanceElement)
        attendanceElement.textContent =
          attendanceCount;


      if (recitationElement)
        recitationElement.textContent =
          recitationCount;


      if (testElement)
        testElement.textContent =
          testCount;

    }


    /* =========================================================
       BACK
    ========================================================= */

    function goBack() {

      if (
        document.referrer &&
        document.referrer.includes(
          'teacher-dashboard'
        )
      ) {

        history.back();

      } else {

        window.location.href =
          'teacher-dashboard.html';

      }

    }


    /* =========================================================
       START
    ========================================================= */

    loadStudent();

  </script>

</body>

</html>
