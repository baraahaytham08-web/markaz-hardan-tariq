<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تفاصيل الطالب | مركز حردان طارق القرآني</title>

  <link rel="icon" type="image/png" href="logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --green: #0d4d3a;
      --green2: #218866;
      --green3: #2da579;
      --light-green: #eaf4ee;
      --very-light: #f5f9f7;

      --gold: #b78a28;
      --gold-light: #fbf4df;

      --border: #dfe9e4;
      --text: #18352c;
      --muted: #71817a;

      --danger: #b42318;
      --danger-light: #fff0ef;

      --warning: #a15c00;
      --warning-light: #fff7e7;

      --blue: #2563a6;
      --blue-light: #edf5ff;

      --purple: #6d4db5;
      --purple-light: #f3effd;

      --white: #ffffff;

      --shadow:
        0 10px 35px rgba(13, 77, 58, .08);

      --shadow-big:
        0 18px 55px rgba(13, 77, 58, .12);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          circle at top right,
          rgba(33,136,102,.07),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #f5f9f7 0%,
          #eef6f2 100%
        );

      color: var(--text);
      font-family: "Cairo", sans-serif;
      min-height: 100vh;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================
       TOP BAR
    ========================================================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);

      border-bottom: 1px solid var(--border);

      box-shadow:
        0 4px 20px rgba(0,0,0,.04);
    }

    .topbar-inner {
      max-width: 1350px;
      margin: auto;

      padding: 13px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      text-decoration: none;
      color: var(--green);
      font-weight: 900;
    }

    .brand img {
      width: 45px;
      height: 45px;

      object-fit: contain;
      border-radius: 12px;
    }

    .brand-text {
      line-height: 1.3;
    }

    .brand-title {
      font-size: 16px;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .back-btn {
      border: 1px solid var(--border);

      background: white;
      color: var(--green);

      padding: 10px 16px;

      border-radius: 12px;

      font-weight: 800;

      transition: .2s;
    }

    .back-btn:hover {
      background: var(--light-green);
      transform: translateY(-1px);
    }

    /* =========================================================
       MAIN
    ========================================================= */

    .page {
      max-width: 1350px;
      margin: auto;

      padding:
        25px
        20px
        60px;
    }

    /* =========================================================
       PROFILE HEADER
    ========================================================= */

    .profile-header {
      position: relative;

      background: white;

      border: 1px solid var(--border);
      border-radius: 24px;

      box-shadow: var(--shadow-big);

      padding: 25px;

      display: flex;
      align-items: center;

      gap: 25px;

      margin-bottom: 18px;

      overflow: hidden;
    }

    .profile-header::before {
      content: "";

      position: absolute;

      top: 0;
      right: 0;
      left: 0;

      height: 4px;

      background:
        linear-gradient(
          90deg,
          var(--green),
          var(--green3),
          var(--gold)
        );
    }

    .photo-area {
      position: relative;
      flex-shrink: 0;
    }

    .student-photo {
      width: 125px;
      height: 125px;

      border-radius: 25px;

      object-fit: cover;

      border: 4px solid var(--light-green);

      background: #f0f4f2;

      display: block;
    }

    .photo-button {
      position: absolute;

      bottom: -8px;
      left: 50%;

      transform: translateX(-50%);

      border: none;

      background: var(--green);
      color: white;

      padding: 7px 13px;

      border-radius: 10px;

      font-size: 11px;
      font-weight: 800;

      white-space: nowrap;

      box-shadow:
        0 5px 15px rgba(13,77,58,.2);
    }

    #photoInput {
      display: none;
    }

    .profile-main {
      flex: 1;
      min-width: 0;
    }

    .profile-name {
      font-size: 29px;
      font-weight: 900;

      color: var(--green);

      margin:
        0
        0
        8px;

      word-break: break-word;
    }

    .profile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-badge {
      background: var(--very-light);

      border: 1px solid var(--border);

      color: var(--muted);

      border-radius: 10px;

      padding: 6px 10px;

      font-size: 12px;
      font-weight: 700;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;
    }

    /* =========================================================
       SMART SUMMARY
    ========================================================= */

    .smart-summary {
      background:
        linear-gradient(
          135deg,
          #ffffff,
          #f7fbf9
        );

      border:
        1px solid var(--border);

      border-radius: 20px;

      padding: 20px;

      box-shadow: var(--shadow);

      margin-bottom: 18px;
    }

    .summary-title {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 15px;
    }

    .summary-title h2 {
      margin: 0;

      color: var(--green);

      font-size: 17px;
      font-weight: 900;
    }

    .week-label {
      background: var(--light-green);

      color: var(--green);

      border: 1px solid #d3e7dc;

      border-radius: 10px;

      padding: 6px 10px;

      font-size: 11px;
      font-weight: 800;
    }

    .progress-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 13px;
    }

    .progress-card {
      background: white;

      border: 1px solid var(--border);

      border-radius: 16px;

      padding: 15px;
    }

    .progress-top {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 8px;

      margin-bottom: 9px;
    }

    .progress-title {
      font-size: 12px;
      font-weight: 800;

      color: var(--muted);
    }

    .progress-percent {
      font-size: 19px;
      font-weight: 900;

      color: var(--green);
    }

    .progress-bar {
      height: 9px;

      background: #edf2ef;

      border-radius: 999px;

      overflow: hidden;

      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;

      width: 0%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          var(--green),
          var(--green3)
        );

      transition:
        width .5s ease;
    }

    .progress-fill.gold {
      background:
        linear-gradient(
          90deg,
          #a67c1f,
          #d3aa4a
        );
    }

    .progress-fill.blue {
      background:
        linear-gradient(
          90deg,
          #2563a6,
          #4d8dcc
        );
    }

    .progress-fill.purple {
      background:
        linear-gradient(
          90deg,
          #6d4db5,
          #9878d3
        );
    }

    .progress-details {
      color: var(--muted);

      font-size: 11px;
      font-weight: 700;

      line-height: 1.7;
    }

    /* =========================================================
       STATS
    ========================================================= */

    .stats-grid {
      display: grid;

      grid-template-columns:
        repeat(6, 1fr);

      gap: 12px;

      margin-bottom: 20px;
    }

    .stat-card {
      background: white;

      border: 1px solid var(--border);

      border-radius: 17px;

      padding: 15px;

      box-shadow: var(--shadow);

      min-width: 0;
    }

    .stat-icon {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .stat-label {
      color: var(--muted);

      font-size: 11px;
      font-weight: 700;

      margin-bottom: 4px;
    }

    .stat-value {
      color: var(--green);

      font-size: 21px;
      font-weight: 900;

      word-break: break-word;
    }

    .stat-small {
      color: var(--muted);

      font-size: 10px;
      font-weight: 700;

      margin-top: 2px;
    }

    /* =========================================================
       QUICK INFO
    ========================================================= */

    .quick-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 13px;

      margin-bottom: 20px;
    }

    .info-card {
      background: white;

      border: 1px solid var(--border);

      border-radius: 17px;

      padding: 16px;

      box-shadow: var(--shadow);
    }

    .info-label {
      color: var(--muted);

      font-size: 11px;
      font-weight: 700;

      margin-bottom: 4px;
    }

    .info-value {
      color: var(--text);

      font-size: 13px;
      font-weight: 800;

      line-height: 1.7;

      word-break: break-word;
    }

    /* =========================================================
       EVALUATION
    ========================================================= */

    .evaluation {
      background:
        linear-gradient(
          135deg,
          #0d4d3a,
          #218866
        );

      color: white;

      border-radius: 19px;

      padding: 18px 20px;

      margin-bottom: 20px;

      box-shadow:
        0 12px 30px
        rgba(13,77,58,.18);

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .evaluation-label {
      font-size: 11px;
      opacity: .8;

      margin-bottom: 3px;
    }

    .evaluation-title {
      font-size: 20px;
      font-weight: 900;
    }

    .evaluation-details {
      font-size: 11px;
      opacity: .88;

      margin-top: 3px;
    }

    .evaluation-score {
      text-align: center;

      min-width: 100px;
    }

    .evaluation-score strong {
      display: block;

      font-size: 29px;
      font-weight: 900;
    }

    .evaluation-score span {
      font-size: 10px;
      opacity: .8;
    }

    /* =========================================================
       SECTIONS
    ========================================================= */

    .section {
      background: white;

      border: 1px solid var(--border);

      border-radius: 18px;

      margin-bottom: 15px;

      overflow: hidden;

      transition: .2s;
    }

    .section.open {
      border-color: #cfe0d8;

      box-shadow:
        0 12px 30px
        rgba(13,77,58,.08);
    }

    .section-head {
      min-height: 62px;

      padding:
        12px
        58px
        12px
        18px;

      position: relative;

      cursor: pointer;

      user-select: none;

      display: flex;
      align-items: center;
    }

    .section-head::after {
      content: "＋";

      position: absolute;

      left: 15px;
      top: 50%;

      transform:
        translateY(-50%);

      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: var(--very-light);
      color: var(--green);

      font-size: 20px;
      font-weight: 900;
    }

    .section.open .section-head::after {
      content: "−";

      background:
        var(--light-green);
    }

    .section-title {
      margin: 0;

      font-size: 16px;
      font-weight: 900;

      color: var(--green);
    }

    .section-subtitle {
      color: var(--muted);

      font-size: 11px;

      margin-top: 2px;
    }

    .section-body {
      display: none;

      padding:
        0
        20px
        20px;
    }

    .section.open .section-body {
      display: block;

      animation:
        openSection .22s ease;
    }

    @keyframes openSection {

      from {
        opacity: 0;
        transform:
          translateY(-5px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }

    }

    /* =========================================================
       FORMS
    ========================================================= */

    .form-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 15px;
    }

    .form-group {
      display: flex;

      flex-direction: column;

      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 12px;

      font-weight: 800;

      color: #496159;
    }

    input,
    select,
    textarea {
      width: 100%;

      border:
        1px solid var(--border);

      background:
        #fbfdfc;

      color: var(--text);

      border-radius: 11px;

      padding:
        11px
        13px;

      outline: none;

      font-size: 13px;

      transition: .2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color:
        var(--green2);

      box-shadow:
        0 0 0 3px
        rgba(33,136,102,.08);

      background: white;
    }

    textarea {
      min-height: 110px;

      resize: vertical;
    }

    /* =========================================================
       TABLES
    ========================================================= */

    .table-wrap {
      overflow-x: auto;

      border:
        1px solid var(--border);

      border-radius: 13px;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 700px;
    }

    th,
    td {
      padding:
        11px
        10px;

      border-bottom:
        1px solid #edf2ef;

      text-align: center;

      font-size: 12px;
    }

    th {
      background:
        var(--very-light);

      color: var(--green);

      font-weight: 900;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .table-input {
      min-width: 100px;

      padding:
        8px
        9px;

      font-size: 12px;
    }

    .add-row {
      margin-top: 12px;

      border:
        1px dashed #b9ccc3;

      background:
        #f8fbf9;

      color: var(--green);

      border-radius: 10px;

      padding:
        9px
        14px;

      font-weight: 800;
    }

    .remove-row {
      border: none;

      background:
        var(--danger-light);

      color: var(--danger);

      width: 32px;
      height: 32px;

      border-radius: 8px;

      font-weight: 900;
    }

    /* =========================================================
       QURAN MAP
    ========================================================= */

    .quran-intro {
      background:
        var(--very-light);

      border:
        1px solid var(--border);

      border-radius: 14px;

      padding: 13px;

      margin-bottom: 15px;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.8;
    }

    .quran-summary {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;

      margin-bottom: 18px;
    }

    .quran-summary-card {
      background: white;

      border:
        1px solid var(--border);

      border-radius: 13px;

      padding: 12px;

      text-align: center;
    }

    .quran-summary-card strong {
      display: block;

      color: var(--green);

      font-size: 20px;

      font-weight: 900;
    }

    .quran-summary-card span {
      color: var(--muted);

      font-size: 10px;

      font-weight: 700;
    }

    .juz-card {
      border:
        1px solid var(--border);

      border-radius: 15px;

      margin-bottom: 12px;

      overflow: hidden;

      background: #fff;
    }

    .juz-head {
      padding: 12px 14px;

      background:
        linear-gradient(
          90deg,
          #f5f9f7,
          #ffffff
        );

      border-bottom:
        1px solid var(--border);

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;
    }

    .juz-name {
      color: var(--green);

      font-size: 13px;

      font-weight: 900;
    }

    .juz-count {
      color: var(--muted);

      font-size: 10px;

      font-weight: 700;
    }

    .page-grid {
      display: grid;

      grid-template-columns:
        repeat(10, 1fr);

      gap: 6px;

      padding: 12px;
    }

    .quran-page {
      min-height: 38px;

      border:
        1px solid var(--border);

      background:
        #f9fbfa;

      color: #697871;

      border-radius: 8px;

      font-size: 11px;

      font-weight: 800;

      transition: .15s;
    }

    .quran-page:hover {
      transform:
        translateY(-1px);

      border-color:
        var(--green2);
    }

    .quran-page.hifz {
      background:
        #dff2e7;

      border-color:
        #a8d7ba;

      color:
        #14633e;
    }

    .quran-page.review {
      background:
        #edf5ff;

      border-color:
        #b8d4f0;

      color:
        #235b91;
    }

    .quran-page.both {
      background:
        linear-gradient(
          135deg,
          #dff2e7 0 50%,
          #edf5ff 50% 100%
        );

      border-color:
        #9fc8b2;

      color:
        #145c3b;
    }

    .quran-page.current-week {
      box-shadow:
        inset 0 0 0 2px
        rgba(183,138,40,.55);
    }

    .quran-legend {
      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 13px;
    }

    .legend-item {
      display: inline-flex;

      align-items: center;

      gap: 6px;

      color: var(--muted);

      font-size: 10px;

      font-weight: 700;
    }

    .legend-dot {
      width: 14px;
      height: 14px;

      border-radius: 4px;

      border:
        1px solid var(--border);
    }

    .legend-dot.hifz {
      background: #dff2e7;
      border-color: #a8d7ba;
    }

    .legend-dot.review {
      background: #edf5ff;
      border-color: #b8d4f0;
    }

    .legend-dot.none {
      background: #f9fbfa;
    }

    /* =========================================================
       SAVE
    ========================================================= */

    .save-wrap {
      margin-top: 18px;

      padding-top: 15px;

      border-top:
        1px solid #e2e9e5;

      display: flex;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;
    }

    .save-btn {
      border: none;

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green2)
        );

      color: white;

      padding:
        12px
        20px;

      border-radius: 12px;

      font-weight: 900;

      font-size: 13px;

      box-shadow:
        0 7px 18px
        rgba(13,77,58,.16);

      transition: .2s;
    }

    .save-btn:hover {
      transform:
        translateY(-2px);
    }

    .save-btn:disabled {
      opacity: .65;

      cursor: wait;

      transform: none;
    }

    .save-message {
      min-height: 20px;

      font-size: 12px;

      font-weight: 800;
    }

    .save-message.success {
      color: #13743f;
    }

    .save-message.error {
      color: var(--danger);
    }

    /* =========================================================
       LOADING / ERROR
    ========================================================= */

    .loading {
      min-height: 300px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      gap: 12px;

      color: var(--muted);

      font-weight: 800;
    }

    .spinner {
      width: 38px;
      height: 38px;

      border:
        4px solid #dceae3;

      border-top-color:
        var(--green);

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }

    .error-box {
      background:
        #fff4f3;

      border:
        1px solid #f1cbc7;

      color: var(--danger);

      border-radius: 15px;

      padding: 20px;

      text-align: center;

      font-weight: 800;
    }

    .empty {
      text-align: center;

      padding: 25px;

      color: var(--muted);

      font-size: 13px;

      font-weight: 700;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 1100px) {

      .stats-grid {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .progress-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (max-width: 800px) {

      .stats-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .quick-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .profile-header {
        align-items: flex-start;
      }

      .form-grid {
        grid-template-columns:
          1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .quran-summary {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .page-grid {
        grid-template-columns:
          repeat(8, 1fr);
      }

    }

    @media (max-width: 600px) {

      .topbar-inner {
        padding:
          10px
          12px;
      }

      .brand-title {
        font-size: 13px;
      }

      .brand-subtitle {
        display: none;
      }

      .brand img {
        width: 39px;
        height: 39px;
      }

      .back-btn {
        padding:
          8px
          11px;

        font-size: 11px;
      }

      .page {
        padding:
          14px
          9px
          35px;

  /* =========================================================

  /* =========================================================

  /* =========================================================

  /* =========================================================
     ESCAPE
  ========================================================= */

  function escapeHtml(value) {

    return String(value ?? '')
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );

  }


  /* =========================================================
     NUMBER
  ========================================================= */

  function number(value) {

    if (
      value === '' ||
      value === null ||
      value === undefined
    ) {
      return '';
    }

    const n =
      Number(value);

    return Number.isFinite(n)
      ? n
      : '';

  }


  /* =========================================================
     STATUS
  ========================================================= */

  function statusText(status) {

    const map = {

      active: 'مستمر',

      inactive: 'متوقف',

      rejected: 'غير مقبول',

      expelled: 'مفصول',

      pending:
        'طلب بانتظار الموافقة'

    };

    return (
      map[status] ||
      status ||
      'غير محدد'
    );

  }


  function statusDot(status) {

    const colors = {

      active: '#18a05e',

      inactive: '#999',

      rejected: '#d83a31',

      expelled: '#d83a31',

      pending: '#d98a00'

    };

    return (
      colors[status] ||
      '#999'
    );

  }


  /* =========================================================
     DATE HELPERS
  ========================================================= */

  function localDateString(date) {

    const d =
      new Date(date);

    const year =
      d.getFullYear();

    const month =
      String(
        d.getMonth() + 1
      ).padStart(2, '0');

    const day =
      String(
        d.getDate()
      ).padStart(2, '0');

    return `${year}-${month}-${day}`;

  }


  /*
    نظام الحلقة:
    السبت → الجمعة
  */

  function getCurrentWeekRange() {

    const now =
      new Date();

    now.setHours(
      0, 0, 0, 0
    );

    const day =
      now.getDay();

    /*
      JS:
      Sunday = 0
      Monday = 1
      ...
      Saturday = 6

      نريد السبت كبداية.
    */

    const daysSinceSaturday =
      (day + 1) % 7;

    const start =
      new Date(now);

    start.setDate(
      start.getDate() -
      daysSinceSaturday
    );

    const end =
      new Date(start);

    end.setDate(
      end.getDate() + 6
    );

    return {

      start:
        localDateString(start),

      end:
        localDateString(end)

    };

  }


  function isDateInCurrentWeek(
    date
  ) {

    if (!date)
      return false;

    const range =
      getCurrentWeekRange();

    return (
      date >= range.start &&
      date <= range.end
    );

  }


  function formatDate(
    date
  ) {

    if (!date)
      return '—';

    try {

      return new Date(
        date + 'T00:00:00'
      ).toLocaleDateString(
        'ar-JO',
        {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }
      );

    } catch {

      return date;

    }

  }


  /* =========================================================
     RANGE HELPERS
  ========================================================= */

  function validPage(
    page
  ) {

    const n =
      Number(page);

    return (
      Number.isInteger(n) &&
      n >= 1 &&
      n <= 604
    );

  }


  function getRangePages(
    from,
    to
  ) {

    const start =
      Number(from);

    const end =
      Number(to);

    if (
      !validPage(start) ||
      !validPage(end)
    ) {
      return [];
    }

    const first =
      Math.min(
        start,
        end
      );

    const last =
      Math.max(
        start,
        end
      );

    const pages = [];

    for (
      let p = first;
      p <= last;
      p++
    ) {

      pages.push(p);

    }

    return pages;

  }


  function uniquePagesFromRecitations(
    recitations,
    type = null,
    onlyCurrentWeek = false
  ) {

    const set =
      new Set();

    (
      recitations || []
    ).forEach(item => {

      if (
        type &&
        item.type !== type
      ) {
        return;
      }

      if (
        onlyCurrentWeek &&
        !isDateInCurrentWeek(
          item.date
        )
      ) {
        return;
      }

      const pages =
        getRangePages(
          item.from,
          item.to
        );

      pages.forEach(
        page =>
          set.add(page)
      );

    });

    return set;

  }


  function countRange(
    from,
    to
  ) {

    return getRangePages(
      from,
      to
    ).length;

  }


  /* =========================================================
     SMART STATISTICS
  ========================================================= */

  function calculateStats() {

    const recitations =
      Array.isArray(
        profile.recitations
      )
        ? profile.recitations
        : [];

    const attendance =
      Array.isArray(
        profile.attendance
      )
        ? profile.attendance
        : [];

    const tests =
      Array.isArray(
        profile.tests
      )
        ? profile.tests
        : [];


    /*
      جميع صفحات الحفظ الفعلية
    */

    const allHifzPages =
      uniquePagesFromRecitations(
        recitations,
        'hifz',
        false
      );


    /*
      جميع صفحات المراجعة الفعلية
    */

    const allReviewPages =
      uniquePagesFromRecitations(
        recitations,
        'review',
        false
      );


    /*
      صفحات الأسبوع الحالي
    */

    const weeklyHifzPages =
      uniquePagesFromRecitations(
        recitations,
        'hifz',
        true
      );


    const weeklyReviewPages =
      uniquePagesFromRecitations(
        recitations,
        'review',
        true
      );


    const goalHifz =
      Number(
        profile.weeklyGoal?.hifz
      ) || 0;


    const goalReview =
      Number(
        profile.weeklyGoal?.review
      ) || 0;


    const hifzPercent =
      goalHifz > 0
        ? Math.min(
            100,
            Math.round(
              (
                weeklyHifzPages.size /
                goalHifz
              ) * 100
            )
          )
        : 0;


    const reviewPercent =
      goalReview > 0
        ? Math.min(
            100,
            Math.round(
              (
                weeklyReviewPages.size /
                goalReview
              ) * 100
            )
          )
        : 0;


    /*
      إنجاز الأسبوع العام:
      متوسط الحفظ والمراجعة
    */

    let weeklyAchievement = 0;

    if (
      goalHifz > 0 &&
      goalReview > 0
    ) {

      weeklyAchievement =
        Math.round(
          (
            hifzPercent +
            reviewPercent
          ) / 2
        );

    } else if (goalHifz > 0) {

      weeklyAchievement =
        hifzPercent;

    } else if (goalReview > 0) {

      weeklyAchievement =
        reviewPercent;

    }


    /*
      نسبة القرآن الكلية
    */

    const quranPercent =
      Math.round(
        (
          allHifzPages.size /
          604
        ) * 100
      );


    /*
      الصفحات المعادلة:
      كل 5 مراجعة = صفحة حفظ
    */

    const equivalentPages =
      allHifzPages.size +
      (
        allReviewPages.size / 5
      );


    /*
      متوسط التسميع
    */

    const scoredRecitations =
      recitations.filter(
        item =>
          item.score !== '' &&
          item.score !== null &&
          item.score !== undefined &&
          Number.isFinite(
            Number(item.score)
          )
      );


    let averageScore = 0;

    if (
      scoredRecitations.length
    ) {

      averageScore =
        scoredRecitations.reduce(
          (
            sum,
            item
          ) =>
            sum +
            Number(item.score),
          0
        ) /
        scoredRecitations.length;

    }


    /*
      أعلى درجة
    */

    const highestScore =
      scoredRecitations.length
        ? Math.max(
            ...scoredRecitations.map(
              item =>
                Number(item.score)
            )
          )
        : 0;


    /*
      عدد الأجزاء المكتملة
    */

    const completedJuz =
      getCompletedJuzCount(
        allHifzPages
      );


    /*
      نقاط الاختبارات
    */

    let testPoints = 0;

    tests.forEach(test => {

      const score =
        Number(test.score);

      const outOf =
        Number(test.outOf) || 100;

      if (
        !Number.isFinite(score) ||
        !Number.isFinite(outOf) ||
        outOf <= 0
      ) {
        return;
      }

      const percent =
        (
          score /
          outOf
        ) * 100;

      if (percent >= 90) {

        testPoints += 12;

      } else if (
        percent >= 80
      ) {

        testPoints += 8;

      } else if (
        percent >= 70
      ) {

        testPoints += 4;

      }

    });


    /*
      نقاط بسيطة للتسميع الممتاز
      بناءً على درجات التسميع
    */

    let recitationPoints = 0;

    scoredRecitations.forEach(
      item => {

        const score =
          Number(item.score);

        if (score >= 90) {

          recitationPoints += 3;

        } else if (
          score >= 80
        ) {

          recitationPoints += 2;

        } else if (
          score >= 70
        ) {

          recitationPoints += 1;

        }

      }
    );


    const totalPoints =
      testPoints +
      recitationPoints;


    return {

      attendanceCount:
        attendance.length,

      recitationCount:
        recitations.length,

      testCount:
        tests.length,

      allHifzPages,

      allReviewPages,

      weeklyHifzPages,

      weeklyReviewPages,

      goalHifz,

      goalReview,

      hifzPercent,

      reviewPercent,

      weeklyAchievement,

      quranPercent,

      equivalentPages,

      averageScore,

      highestScore,

      completedJuz,

      totalPoints

    };

  }


  /* =========================================================
     JUZ RANGES
  ========================================================= */

  function getJuzRanges() {

    const ranges = [];

    ranges.push({
      juz: 1,
      start: 1,
      end: 21
    });

    for (
      let juz = 2;
      juz <= 29;
      juz++
    ) {

      const start =
        22 +
        (
          (juz - 2) * 20
        );

      const end =
        start + 19;

      ranges.push({
        juz,
        start,
        end
      });

    }

    ranges.push({
      juz: 30,
      start: 582,
      end: 604
    });

    return ranges;

  }


  function getCompletedJuzCount(
    hifzPages
  ) {

    let count = 0;

    getJuzRanges().forEach(
      range => {

        let complete = true;

        for (
          let p =
            range.start;
          p <= range.end;
          p++
        ) {

          if (
            !hifzPages.has(p)
          ) {

            complete = false;
            break;

          }

        }

        if (complete)
          count++;

      }
    );

    return count;

  }


  /* =========================================================
     EVALUATION

      details:
        'لم يتم تسجيل إنجاز لهذا الأسبوع بعد.',
    };

  }

        ></span>

  /* =========================================================
     GET PHOTO
  ========================================================= */

  function getStudentPhoto() {

    const localPhoto =
      localStorage.getItem(
        `studentPhoto_${studentId}`
      );

    if (localPhoto)
      return localPhoto;


    if (profile?.photoUrl)
      return profile.photoUrl;


    return '';

  }


  /* =========================================================
     PHOTO
  ========================================================= */

  async function handlePhoto(event) {

    const file =
      event.target.files?.[0];

    if (!file)
      return;


    if (
      !file.type.startsWith(
        'image/'
      )
    ) {

      alert(
        'الرجاء اختيار صورة صحيحة.'
      );

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      async function(e) {

        const dataUrl =
          e.target.result;


        localStorage.setItem(
          `studentPhoto_${studentId}`,
          dataUrl
        );


        const img =
          document.getElementById(
            'studentPhoto'
          );


        if (img)
          img.src =
            dataUrl;


        try {

          const fresh =
            await readFreshProfile();


          await saveProfilePatch({

            photoUrl:
              dataUrl

          });


          profile =
            mergeProfile({

              ...fresh,

              photoUrl:
                dataUrl

            });


          showGlobalMessage(
            '✅ تم تغيير صورة الطالب وحفظها بنجاح.'
          );

        } catch (error) {

          console.error(
            'PHOTO SAVE ERROR:',
            error
          );

          showGlobalMessage(
            '⚠️ تم تغيير الصورة على الجهاز، لكن تعذر حفظها في قاعدة البيانات.'
          );

        }

      };


    reader.readAsDataURL(file);

  }


  /* =========================================================
     READ FRESH PROFILE
  ========================================================= */

  async function readFreshProfile() {

    const {
      data,
      error
    } =
      await supabaseClient

        .from('student_profiles')

        .select('data')

        .eq(
          'student_id',
          String(studentId)
        )

        .maybeSingle();


    if (error)
      throw error;


    return mergeProfile(
      data?.data || {}
    );

  }


  /* =========================================================
     SAVE PROFILE PATCH
  ========================================================= */

  async function saveProfilePatch(
    changes
  ) {

    const fresh =
      await readFreshProfile();


    const merged = {

      ...fresh,

      ...changes

    };


    const {
      error
    } =
      await supabaseClient

        .from('student_profiles')

        .upsert({

          student_id:
            String(studentId),

          data:
            merged,

          updated_at:
            new Date().toISOString()

        });


    if (error)
      throw error;


    return merged;

  }


  /* =========================================================
     SAVE SECTION
  ========================================================= */

  async function saveSection(
    key,
    button
  ) {

    if (
      !student ||
      !studentId
    ) {

      showSaveError(
        button,
        'لم يتم تحميل بيانات الطالب.'
      );

      return;

    }


    button.disabled =
      true;


    const oldText =
      button.textContent;


    button.textContent =
      '⏳ جاري الحفظ...';


    try {

      switch (key) {


        /* ================= BASIC ================= */

        case 'basic': {

          const name =
            document
              .getElementById('name')
              ?.value
              .trim() || '';


          if (!name) {

            throw new Error(
              'اسم الطالب مطلوب.'
            );

          }


          const studentUpdate = {

            name,

            age:
              number(
                document
                  .getElementById('age')
                  ?.value
              ),

            section:
              document
                .getElementById('section')
                ?.value
                .trim() || '',

            memorization:
              document
                .getElementById(
                  'memorization'
                )
                ?.value
                .trim() || '',

            status:
              document
                .getElementById('status')
                ?.value ||
              'active',

            guardian_phone:
              document
                .getElementById(
                  'guardianPhone'
                )
                ?.value
                .trim() || ''

          };


          const {
            error:
              studentError
          } =
            await supabaseClient

              .from('students')

              .update(
                studentUpdate
              )

              .eq(
                'id',
                studentId
              );


          if (studentError)
            throw studentError;


          const profilePatch = {

            photoUrl:
              profile.photoUrl ||
              '',

            guardianPhone:
              document
                .getElementById(
                  'guardianPhone'
                )
                ?.value
                .trim() || '',

            joiningDate:
              document
                .getElementById(
                  'joiningDate'
                )
                ?.value || '',

            residence:
              document
                .getElementById(
                  'residence'
                )
                ?.value
                .trim() || '',

            bus:
              document
                .getElementById(
                  'bus'
                )
                ?.value
                .trim() || '',

            homeLocation:
              document
                .getElementById(
                  'homeLocation'
                )
                ?.value
                .trim() || ''

          };


          await saveProfilePatch(
            profilePatch
          );


          student = {

            ...student,

            ...studentUpdate

          };


          profile =
            mergeProfile({

              ...profile,

              ...profilePatch

            });


          break;

        }


        /* ================= GOAL ================= */

        case 'weeklyGoal': {

          const weeklyGoal = {

            hifz:
              number(
                document
                  .getElementById(
                    'goalHifz'
                  )
                  ?.value
              ),

            review:
              number(
                document
                  .getElementById(
                    'goalReview'
                  )
                  ?.value
              )

          };


          await saveProfilePatch({

            weeklyGoal

          });


          profile.weeklyGoal =
            weeklyGoal;


          break;

        }


        /* ================= ATTENDANCE ================= */

        case 'attendance': {

          const attendance =
            collectAttendance();


          await saveProfilePatch({

            attendance

          });


          profile.attendance =
            attendance;


          break;

        }


        /* ================= PLAN ================= */

        case 'weeklyPlan': {

          const weeklyPlan =
            collectPlan();


          await saveProfilePatch({

            weeklyPlan

          });


          profile.weeklyPlan =
            weeklyPlan;


          break;

        }


        /* ================= TESTS ================= */

        case 'tests': {

          const tests =
            collectTests();


          await saveProfilePatch({

            tests

          });


          profile.tests =
            tests;


          break;

        }


        /* ================= RECITATIONS ================= */

        case 'recitations': {

          const recitations =
            collectRecitations();


          await saveProfilePatch({

            recitations

          });


          profile.recitations =
            recitations;


          break;

        }


        /* ================= NOTES ================= */

        case 'notes': {

          const notes =
            document
              .getElementById(
                'notes'
              )
              ?.value
              .trim() || '';


          await saveProfilePatch({

            notes

          });


          profile.notes =
            notes;


          break;

        }


        default:

          throw new Error(
            'الخانة غير معروفة.'
          );

      }


      /*
        إعادة بناء الصفحة بعد الحفظ
        حتى تتحدث النسب فورًا.
      */

      render();


      showGlobalMessage(
        '✅ تم الحفظ وتحديث الإحصائيات تلقائيًا.'
      );


    } catch (error) {

      console.error(
        'SECTION SAVE ERROR:',
        error
      );


      showSaveError(
        button,
        error?.message ||
        'حدث خطأ أثناء الحفظ.'
      );

    } finally {

      button.disabled =
        false;

      button.textContent =
        oldText;

    }

  }

  function showSaveSuccess(

    const box =
      getSaveMessageBox(

      return;


    box.className =
      'save-message success';


    box.textContent =
      message;

  }


  function showSaveError(
    button,
    message
  ) {

    const box =
      getSaveMessageBox(
        button
      );


    if (!box)
      return;


    box.className =
      'save-message error';


    box.textContent =
      message;

  }


  function showGlobalMessage(
    message
  ) {

    const old =
      document.getElementById(
        'globalMessage'
      );


    if (old)
      old.remove();


    const box =
      document.createElement(
        'div'
      );


    box.id =
      'globalMessage';


    box.textContent =
      message;


    Object.assign(
      box.style,
      {

        position: 'fixed',

        bottom: '20px',

        left: '50%',

        transform:
          'translateX(-50%)',

        zIndex: '9999',

        background:
          '#0d4d3a',

        color: 'white',

        padding:
          '12px 20px',

        borderRadius:
          '12px',

        fontWeight:
          '800',

        fontSize:
          '13px',

        boxShadow:
          '0 10px 30px rgba(0,0,0,.2)',

        maxWidth:
          'calc(100% - 30px)',

        textAlign:
          'center'

      }
    );


    document.body.appendChild(
      box
    );


    setTimeout(
      () => {

        box.remove();

      },
      3500
    );

  }


  /* =========================================================
     ACCORDION
  ========================================================= */

  function toggleSection(
    section
  ) {

    if (
      section.classList.contains(
        'open'
      )
    ) {

      section.classList.remove(
        'open'
      );

      return;

    }


    document
      .querySelectorAll(
        '.accordion-section.open'
      )
      .forEach(
        other => {

          if (
            other !== section
          ) {

            other.classList.remove(
              'open'
            );

          }

        }
      );


    section.classList.add(
      'open'
    );

  }

          <span>
            صفحة محفوظة
          </span>

        </div>


        <div class="quran-summary-card">

          <strong>
            ${reviewPages.size}
          </strong>

          <span>
            صفحة مراجعة
          </span>

        </div>


        <div class="quran-summary-card">

          <strong>
            ${stats.quranPercent}%
          </strong>

          <span>
            نسبة الحفظ
          </span>

        </div>


        <div class="quran-summary-card">

          <strong>
            ${stats.completedJuz}
          </strong>

          <span>
            أجزاء مكتملة
          </span>

        </div>

      `;

    }


    map.innerHTML = '';


    getJuzRanges().forEach(
      range => {

        let hifzCount = 0;

        let reviewCount = 0;

        for (
          let p =
            range.start;
          p <= range.end;
          p++
        ) {

          if (
            hifzPages.has(p)
          ) {

            hifzCount++;

          }

          if (
            reviewPages.has(p)
          ) {

            reviewCount++;

          }

        }


        const card =
          document.createElement(
            'div'
          );

        card.className =
          'juz-card';


        const head =
          document.createElement(
            'div'
          );

        head.className =
          'juz-head';


        const name =
          document.createElement(
            'div'
          );

        name.className =
          'juz-name';

        name.textContent =
          `الجزء ${toArabicNumber(
            range.juz
          )}`;


        const count =
          document.createElement(
            'div'
          );

        count.className =
          'juz-count';

        count.textContent =
          `${range.start} - ${range.end}
           • ${hifzCount} حفظ
           • ${reviewCount} مراجعة`;


        head.appendChild(
          name
        );

        head.appendChild(
          count
        );


        const grid =
          document.createElement(
            'div'
          );

        grid.className =
          'page-grid';


        for (
          let page =
            range.start;
          page <= range.end;
          page++
        ) {

          const button =
            document.createElement(
              'button'
            );

          button.type =
            'button';

          button.className =
            'quran-page';


          const hasHifz =
            hifzPages.has(
              page
            );

          const hasReview =
            reviewPages.has(
              page
            );


          if (
            hasHifz &&
            hasReview
          ) {

            button.classList.add(
              'both'
            );

          } else if (
            hasHifz
          ) {

            button.classList.add(
              'hifz'
            );

          } else if (
            hasReview
          ) {

            button.classList.add(
              'review'
            );

          }


          if (
            isPageInCurrentWeek(
              page
            )
          ) {

            button.classList.add(
              'current-week'
            );

          }


          button.textContent =
            page;


          button.title =
            getPageTooltip(
              page,
              hasHifz,
              hasReview
            );


          button.onclick =
            function() {

              showPageDetails(
                page
              );

            };


          grid.appendChild(
            button
          );

        }


        card.appendChild(
          head
        );

        card.appendChild(
          grid
        );


        map.appendChild(
          card
        );

      }
    );

  }


  function isPageInCurrentWeek(
    page
  ) {

    const recitations =
      profile.recitations ||
      [];

    return recitations.some(
      item => {

        if (
          !isDateInCurrentWeek(
            item.date
          )
        ) {

          return false;

        }

        return getRangePages(
          item.from,
          item.to
        ).includes(
          page
        );

      }
    );

  }


  function getPageTooltip(
    page,
    hasHifz,
    hasReview
  ) {

    let state =
      'غير مسجلة';

    if (
      hasHifz &&
      hasReview
    ) {

      state =
        'حفظ + مراجعة';

    } else if (hasHifz) {

      state =
        'حفظ';

    } else if (hasReview) {

      state =
        'مراجعة';

    }

    return `صفحة ${page} — ${state}`;

  }


  function showPageDetails(
    page
  ) {

    const records =
      (
        profile.recitations ||
        []
      ).filter(
        item =>
          getRangePages(
            item.from,
            item.to
          ).includes(
            page
          )
      );


    if (!records.length) {

      showGlobalMessage(
        `صفحة ${page}: لم يتم تسجيلها بعد.`
      );

      return;

    }


    const latest =
      records[
        records.length - 1
      ];


    const type =
      latest.type === 'review'
        ? 'مراجعة'
        : 'حفظ';


    const score =
      latest.score !== '' &&
      latest.score !== null &&
      latest.score !== undefined
        ? ` • الدرجة ${latest.score}%`
        : '';


    showGlobalMessage(
      `صفحة ${page}: ${type}${score}`
    );

  }


  function toArabicNumber(
    numberValue
  ) {

    const arabic =
      [
        '٠',
        '١',
        '٢',
        '٣',
        '٤',
        '٥',
        '٦',
        '٧',
        '٨',
        '٩'
      ];

    return String(
      numberValue
    ).replace(
      /\d/g,
      d => arabic[
        Number(d)
      ]
    );

  }


  /* =========================================================
     STATS
  ========================================================= */

  function updateStats() {

    const stats =
      calculateStats();


    const attendanceElement =
      document.getElementById(
        'attendanceCount'
      );


    if (attendanceElement) {

      attendanceElement.textContent =
        stats.attendanceCount;

    }

  }


  /* =========================================================
     BACK
  ========================================================= */

  function goBack() {

    if (
      document.referrer &&
      document.referrer.includes(
        'teacher-dashboard'
      )
    ) {

      history.back();

    } else {

      window.location.href =
        'teacher-dashboard.html';

    }

  }


  /* =========================================================
     START
  ========================================================= */

  loadStudent();

</script>
