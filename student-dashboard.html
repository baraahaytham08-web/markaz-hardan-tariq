<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ملفي | مركز حردان طارق القرآني</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #07563c;
      --green2: #0b7450;
      --gold: #c29d45;
      --cream: #f8f4e8;
      --text: #17352b;
      --muted: #777;
      --white: #fff;
    }

    body {
      background: #f4f6f2;
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
    }

    header {
      background: linear-gradient(135deg, var(--green), #063626);
      color: white;
      padding: 22px 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .brand p {
      font-size: 13px;
      opacity: .8;
    }

    .logout {
      border: 1px solid rgba(255,255,255,.3);
      background: transparent;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      width: calc(100% - 30px);
      max-width: 1100px;
      margin: 25px auto 50px;
    }

    .welcome {
      background: white;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      border-right: 5px solid var(--gold);
    }

    .welcome h2 {
      color: var(--green);
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.7;
    }

    .profile {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .student-card {
      text-align: center;
    }

    .photo {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--gold);
      background: var(--cream);
      margin-bottom: 15px;
    }

    .student-card h2 {
      color: var(--green);
      margin-bottom: 8px;
      font-size: 21px;
    }

    .section {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 15px;
    }

    .code-badge {
      display: inline-block;
      background: var(--cream);
      color: var(--green);
      border: 1px solid #e4d5aa;
      border-radius: 10px;
      padding: 8px 13px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .detail {
      background: #fafafa;
      border-radius: 13px;
      padding: 15px;
      border: 1px solid #eee;
    }

    .detail small {
      display: block;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .detail strong {
      color: var(--text);
      line-height: 1.5;
    }

    .section-title {
      color: var(--green);
      margin-bottom: 18px;
      font-size: 21px;
    }

    .progress-box {
      margin-bottom: 18px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .progress {
      height: 13px;
      background: #e9ece8;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--gold));
      border-radius: inherit;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th, td {
      padding: 13px;
      text-align: right;
      border-bottom: 1px solid #eee;
    }

    th {
      background: var(--cream);
      color: var(--green);
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 8px;
      background: #fff5d8;
      color: #856404;
      font-size: 13px;
    }

    .attendance {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .attendance-item {
      background: #f8fbf8;
      border: 1px solid #dce9df;
      padding: 15px;
      border-radius: 14px;
      text-align: center;
    }

    .present {
      color: #087443;
      font-weight: bold;
      margin-top: 7px;
    }

    .empty {
      color: var(--muted);
      padding: 20px 0;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      font-size: 17px;
    }

    .error {
      max-width: 600px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      color: #a22;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .error button {
      margin-top: 18px;
      border: none;
      background: var(--green);
      color: white;
      padding: 11px 20px;
      border-radius: 10px;
      cursor: pointer;
    }

    @media (max-width: 750px) {

      .profile {
        grid-template-columns: 1fr;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .header-inner {
        align-items: flex-start;
      }

      .brand h1 {
        font-size: 18px;
      }

      .welcome {
        padding: 20px;
      }
    }
  </style>

</head>

<body>

<header>
  <div class="header-inner">

```
<div class="brand">
  <h1>مركز حردان طارق القرآني</h1>
  <p>بوابة الطالب</p>
</div>

<button class="logout" onclick="logout()">
  تسجيل الخروج
</button>
```

  </div>
</header>

<main class="container" id="app">

  <div class="loading">
    جاري تحميل ملفك...
  </div>

</main>

<script>

const SUPABASE_URL =
  'https://lsbbcybpiulusdgfhepf.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_qECf_PrJFSGgMJJr4yJLew_MCeslUF0';

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function logout() {

  sessionStorage.removeItem('studentSession');

  window.location.href =
    'student-login.html';

}


function getSession() {

  try {

    return JSON.parse(
      sessionStorage.getItem('studentSession')
    );

  } catch {

    return null;

  }

}


function progressBar(value) {

  let number = Number(value);

  if (isNaN(number)) number = 0;

  number = Math.max(0, Math.min(100, number));

  return `
    <div class="progress">
      <div
        class="progress-bar"
        style="width:${number}%"
      ></div>
    </div>
  `;

}


function detail(label, value) {

  return `
    <div class="detail">
      <small>${escapeHtml(label)}</small>
      <strong>${escapeHtml(value || 'غير محدد')}</strong>
    </div>
  `;

}


async function loadStudent() {

  const session = getSession();

  if (!session || !session.id) {

    window.location.href =
      'student-login.html';

    return;

  }

  try {

    const { data: profileData, error } =
      await supabaseClient.rpc(
        'get_student_profile',
        {
          p_student_id: String(session.id)
        }
      );

    if (error) {
      console.error(error);
      throw error;
    }

    const profile =
      profileData && typeof profileData === 'object'
        ? profileData
        : {};

    renderStudent(session, profile);

  } catch (error) {

    console.error(error);

    document.getElementById('app').innerHTML = `
      <div class="error">
        <h2>تعذر تحميل الملف</h2>
        <p style="margin-top:10px">
          حدثت مشكلة أثناء تحميل بيانات الطالب.
        </p>

        <button onclick="location.reload()">
          المحاولة مرة أخرى
        </button>
      </div>
    `;

  }

}


function renderStudent(student, profile) {

  const app =
    document.getElementById('app');

  const photo =
    profile.photoUrl ||
    profile.photo_url ||
    '';


  const weeklyGoal =
    profile.weeklyGoal ||
    profile.weekly_goal ||
    'غير محدد';


  const points =
    profile.totalPoints ??
    profile.total_points ??
    '0';


  const weeklyProgress =
    profile.weeklyProgress ??
    profile.weekly_progress ??
    0;


  const attendance =
    Array.isArray(profile.attendance)
      ? profile.attendance
      : [];


  const weeklyPlan =
    Array.isArray(profile.weeklyPlan)
      ? profile.weeklyPlan
      : [];


  const tests =
    Array.isArray(profile.tests)
      ? profile.tests
      : [];


  const hifzProgress =
    Number(
      profile.hifzProgress ??
      profile.hifz_progress ??
      0
    );


  const reviewProgress =
    Number(
      profile.reviewProgress ??
      profile.review_progress ??
      0
    );


  const completedPages =
    profile.completedPages ??
    profile.completed_pages ??
    '0';


  const requiredPages =
    profile.requiredPages ??
    profile.required_pages ??
    '0';


  const generalEvaluation =
    profile.generalEvaluation ??
    profile.general_evaluation ??
    'غير محدد';


  const equivalentRecitation =
    profile.equivalentRecitation ??
    profile.equivalent_recitation ??
    'غير محدد';


  const nextExam =
    profile.nextExam ??
    profile.next_exam ??
    'غير محدد';


  const nextExamDate =
    profile.nextExamDate ??
    profile.next_exam_date ??
    'غير محدد';


  app.innerHTML = `

    <section class="welcome">

      <h2>
        أهلاً بك، ${escapeHtml(student.name)}
      </h2>

      <p>
        هذه صفحتك الشخصية في المركز.
        المعلومات الظاهرة هنا يتم تسجيلها وتحديثها من قبل المعلم.
      </p>

    </section>


    <section class="profile">

      <div class="card student-card">

        ${
          photo
            ? `
              <img
                class="photo"
                src="${escapeHtml(photo)}"
                alt="صورة الطالب"
              >
            `
            : `
              <div
                class="photo"
                style="
                  display:inline-flex;
                  align-items:center;
                  justify-content:center;
                  font-size:40px;
                  color:#07563c;
                "
              >
                👤
              </div>
            `
        }

        <h2>
          ${escapeHtml(student.name)}
        </h2>

        <div class="section">
          ${escapeHtml(student.section || 'غير محدد')}
        </div>

        <div class="code-badge">
          ${escapeHtml(student.login_code || '—')}
        </div>

      </div>


      <div class="card">

        <h2 class="section-title">
          معلومات الطالب
        </h2>

        <div class="details">

          ${detail(
            'الشعبة',
            student.section
          )}

          ${detail(
            'الحفظ الحالي',
            student.memorization
          )}

          ${detail(
            'الحالة',
            student.status === 'active'
              ? 'فعال'
              : student.status
          )}

          ${detail(
            'الهدف الأسبوعي',
            weeklyGoal
          )}

          ${detail(
            'مجموع النقاط',
            points
          )}

          ${detail(
            'التقدم الأسبوعي',
            weeklyProgress + '%'
          )}

          ${detail(
            'تاريخ الالتحاق',
            profile.joiningDate ||
            profile.joining_date
          )}

          ${detail(
            'مكان السكن',
            profile.residence
          )}

          ${detail(
            'الحافلة',
            profile.bus
          )}

          ${detail(
            'موقع المنزل',
            profile.homeLocation ||
            profile.home_location
          )}

          ${detail(
            'رقم ولي الأمر',
            profile.guardianPhone ||
            profile.guardian_phone
          )}

          ${detail(
            'أجزاء القرآن المكتملة',
            profile.completedQuranParts ||
            profile.completed_quran_parts
          )}

        </div>

      </div>

    </section>


    <section class="card" style="margin-bottom:20px">

      <h2 class="section-title">
        التقدم الأسبوعي
      </h2>

      <div class="progress-box">

        <div class="progress-head">
          <span>الحفظ</span>
          <span>${hifzProgress}%</span>
        </div>

        ${progressBar(hifzProgress)}

        <p style="margin-top:8px;color:#777">
          تم إنجاز
          ${escapeHtml(completedPages)}
          من
          ${escapeHtml(requiredPages)}
        </p>

      </div>


      <div class="progress-box">

        <div class="progress-head">
          <span>المراجعة</span>
          <span>${reviewProgress}%</span>
        </div>

        ${progressBar(reviewProgress)}

      </div>

      <div class="details">

        ${detail(
          'التقييم العام',
          generalEvaluation
        )}

        ${detail(
          'التسميع المكافئ',
          equivalentRecitation
        )}

        ${detail(
          'الهدف الأسبوعي',
          weeklyGoal
        )}

        ${detail(
          'الاختبار القادم',
          nextExam
        )}

        ${detail(
          'تاريخ الاختبار',
          nextExamDate
        )}

      </div>

    </section>


    <section class="card" style="margin-bottom:20px">

      <h2 class="section-title">
        الحضور
      </h2>

      ${
        attendance.length
          ? `
            <div class="attendance">

              ${attendance.map(item => `

                <div class="attendance-item">

                  <strong>
                    ${escapeHtml(
                      item.date ||
                      item.day ||
                      ''
                    )}
                  </strong>

                  <div class="present">
                    ${escapeHtml(
                      item.status || 'حاضر'
                    )}
                  </div>

                </div>

              `).join('')}

            </div>
          `
          : `
            <div class="empty">
              لا يوجد سجل حضور مسجل حاليًا.
            </div>
          `
      }

    </section>


    <section class="card" style="margin-bottom:20px">

      <h2 class="section-title">
        الخطة الأسبوعية
      </h2>

      ${
        weeklyPlan.length
          ? `
            <div class="table-wrap">

              <table>

                <thead>
                  <tr>
                    <th>التاريخ</th>
                    <th>الجزء</th>
                    <th>الصفحات</th>
                    <th>المطلوب</th>
                    <th>الحالة</th>
                  </tr>
                </thead>

                <tbody>

                  ${weeklyPlan.map(item => `

                    <tr>

                      <td>
                        ${escapeHtml(item.date)}
                      </td>

                      <td>
                        ${escapeHtml(item.juz)}
                      </td>

                      <td>
                        ${escapeHtml(item.pages)}
                      </td>

                      <td>
                        ${escapeHtml(item.exam || 'لا يوجد')}
                      </td>

                      <td>
                        <span class="status">
                          ${escapeHtml(
                            item.status || 'قيد الانتظار'
                          )}
                        </span>
                      </td>

                    </tr>

                  `).join('')}

                </tbody>

              </table>

            </div>
          `
          : `
            <div class="empty">
              لم يتم تسجيل خطة أسبوعية بعد.
            </div>
          `
      }

    </section>


    <section class="card" style="margin-bottom:20px">

      <h2 class="section-title">
        الاختبارات
      </h2>

      ${
        tests.length
          ? `
            <div class="table-wrap">

              <table>

                <thead>
                  <tr>
                    <th>الاختبار</th>
                    <th>التاريخ</th>
                    <th>النتيجة</th>
                    <th>النقاط</th>
                  </tr>
                </thead>

                <tbody>

                  ${tests.map(test => `

                    <tr>

                      <td>
                        ${escapeHtml(test.name)}
                      </td>

                      <td>
                        ${escapeHtml(test.date)}
                      </td>

                      <td>
                        ${escapeHtml(test.result)}
                      </td>

                      <td>
                        ${escapeHtml(test.points)}
                      </td>

                    </tr>

                  `).join('')}

                </tbody>

              </table>

            </div>
          `
          : `
            <div class="empty">
              لا توجد اختبارات مسجلة حاليًا.
            </div>
          `
      }

    </section>


    <section class="card">

      <h2 class="section-title">
        ملاحظات المعلم
      </h2>

      <p style="line-height:2;color:#555">

        ${escapeHtml(
          profile.notes ||
          profile.generalNotes ||
          profile.general_notes ||
          'لا يوجد ملاحظات عامة مسجلة للطالب في الوقت الحالي.'
        )}

      </p>

    </section>

  `;

}


loadStudent();

</script>

</body>
</html>
